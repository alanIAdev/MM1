<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Challenges — Mini Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet"/>
<style>
:root[data-theme="dark"]{
  --bg:#0e0e10;--surface:#17171a;--border:#2a2a30;
  --text:#e8e6e0;--muted:#6b6b72;
  --accent:#e8c97a;--accent-dim:rgba(232,201,122,0.12);--accent-dimmer:rgba(232,201,122,0.05);
  --danger:#e87a7a;--success:#7ae8b0;--success-dim:rgba(122,232,176,0.12);
  --card-bg:#131316;--shadow:rgba(0,0,0,0.5);--toggle-bg:#2a2a30;
  --modal-bg:rgba(0,0,0,0.75);
}
:root[data-theme="light"]{
  --bg:#f5f2eb;--surface:#fff;--border:#ddd9ce;
  --text:#1a1a1c;--muted:#888880;
  --accent:#c8900a;--accent-dim:rgba(200,144,10,0.1);--accent-dimmer:rgba(200,144,10,0.04);
  --danger:#c02020;--success:#1a8050;--success-dim:rgba(26,128,80,0.1);
  --card-bg:#fefcf7;--shadow:rgba(0,0,0,0.08);--toggle-bg:#e8e4dc;
  --modal-bg:rgba(0,0,0,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;transition:background .4s,color .4s}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.6}

.top-nav{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;border-bottom:1px solid var(--border)}
.back-link{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:.4rem;transition:color .2s}
.back-link:hover{color:var(--accent)}
.nav-title{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.nav-title span{font-style:italic;font-weight:300}
.toggle-wrap{display:flex;align-items:center;gap:.5rem}
.toggle-icon{font-size:.85rem}
.toggle{position:relative;width:40px;height:22px;background:var(--toggle-bg);border-radius:11px;border:1px solid var(--border);cursor:pointer;transition:background .3s}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--accent);border-radius:50%;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
[data-theme="light"] .toggle::after{transform:translateX(18px)}

.main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:1.5rem 2rem 4rem;width:100%}

/* PROG TABS */
.prog-bar{display:flex;align-items:center;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
.prog-tabs{display:flex;gap:.5rem;flex-wrap:wrap;flex:1}
.prog-tab{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.45rem .9rem;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap}
.prog-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.prog-tab:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.prog-tab.add-tab{border-style:dashed}
.prog-tab.add-tab:hover{border-color:var(--success);color:var(--success)}

/* PROG HEADER */
.prog-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem;background:var(--card-bg);border:1px solid var(--border);border-radius:4px;padding:1.25rem 1.5rem;flex-wrap:wrap}
.prog-name{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.25rem}
.prog-name span{font-style:italic;font-weight:300}
.prog-sub{font-size:.65rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.streak-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.62rem;color:var(--accent);background:var(--accent-dim);padding:.2rem .5rem;border-radius:10px;margin-top:.4rem}
.prog-stats{display:flex;gap:1.5rem;flex-shrink:0}
.stat{text-align:center}
.stat-val{font-size:1.5rem;font-weight:500;letter-spacing:-.03em;color:var(--accent);line-height:1}
.stat-lbl{font-size:.58rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:.2rem}
.prog-actions{display:flex;gap:.5rem;align-items:flex-start}
.btn-sm{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.35rem .7rem;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.danger:hover{border-color:var(--danger);color:var(--danger)}

/* PROGRESS BAR */
.prog-progress{margin-bottom:1.5rem}
.progress-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s}
.progress-labels{display:flex;justify-content:space-between;margin-top:.4rem;font-size:.6rem;color:var(--muted)}

/* GRID */
.content-grid{display:grid;grid-template-columns:1fr 320px;gap:1.5rem;align-items:start}

/* CALENDAR */
.calendar-card{background:var(--card-bg);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;border-bottom:1px solid var(--border)}
.cal-title{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cal-nav{display:flex;gap:.3rem}
.cal-nav-btn{font-size:.75rem;padding:.2rem .5rem;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace}
.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:1rem}
.cal-day-label{font-size:.58rem;color:var(--muted);text-align:center;padding-bottom:.4rem;letter-spacing:.06em;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;transition:all .18s;position:relative;gap:1px}
.cal-day:hover{border-color:var(--accent)}
.cal-day.empty{cursor:default;pointer-events:none}
.cal-day.outside-range{opacity:.2;cursor:default;pointer-events:none}
.cal-day .day-num{font-size:.68rem;font-weight:500;line-height:1}
.cal-day .day-dot{width:4px;height:4px;border-radius:50%;background:var(--border)}
.cal-day.today{border-color:var(--accent);background:var(--accent-dim)}
.cal-day.today .day-num{color:var(--accent)}
.cal-day.selected{box-shadow:0 0 0 2px var(--accent)}
.cal-day.done{background:var(--success-dim)}
.cal-day.done .day-dot{background:var(--success)}
.cal-day.done .day-num{color:var(--success)}
.cal-day.partial{background:var(--accent-dimmer)}
.cal-day.partial .day-dot{background:var(--accent)}
.cal-day.future{opacity:.45}
.cal-day.missed .day-dot{background:var(--danger)}

/* DETAIL */
.detail-card{background:var(--card-bg);border:1px solid var(--border);border-radius:4px;overflow:hidden;position:sticky;top:1.5rem}
.detail-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.detail-date{font-family:'Fraunces',serif;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.detail-day-num{font-size:.62rem;color:var(--accent);background:var(--accent-dim);padding:.15rem .45rem;border-radius:10px;flex-shrink:0}
.detail-body{padding:1rem 1.25rem}
.detail-empty{font-size:.7rem;color:var(--muted);text-align:center;padding:1.5rem 0;line-height:1.8}
.action-list{display:flex;flex-direction:column;gap:.5rem}
.action-item{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .75rem;border:1px solid var(--border);border-radius:3px;transition:all .2s;cursor:pointer}
.action-item:hover{border-color:var(--accent);background:var(--accent-dimmer)}
.action-item.checked{background:var(--success-dim);border-color:rgba(122,232,176,0.4)}
.action-check{width:17px;height:17px;flex-shrink:0;border:1.5px solid var(--border);border-radius:3px;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.action-item.checked .action-check{background:var(--success);border-color:var(--success)}
.action-item.checked .action-check::after{content:'✓';font-size:.65rem;color:#111}
.action-text{font-size:.72rem;line-height:1.5;flex:1}
.action-item.checked .action-text{color:var(--muted);text-decoration:line-through}
.action-note{font-size:.62rem;color:var(--muted);margin-top:.15rem;font-style:italic}
.detail-footer{padding:.75rem 1.25rem;border-top:1px solid var(--border);font-size:.62rem;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.detail-progress-mini{height:3px;background:var(--border);border-radius:2px;overflow:hidden;flex:1}
.detail-progress-fill{height:100%;background:var(--success);border-radius:2px;transition:width .4s}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:var(--modal-bg);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:6px;width:min(96vw,640px);max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px var(--shadow);transform:translateY(12px);transition:transform .25s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700}
.modal-close{font-size:1rem;background:transparent;border:none;color:var(--muted);cursor:pointer;padding:.2rem .4rem;transition:color .2s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.1rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.75rem}
.field{display:flex;flex-direction:column;gap:.4rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.label{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.input{font-family:'DM Mono',monospace;font-size:.78rem;padding:.5rem .7rem;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);transition:border-color .2s;width:100%}
.input:focus{outline:none;border-color:var(--accent)}
select.input{cursor:pointer}
.emoji-row{display:flex;gap:.35rem;flex-wrap:wrap}
.emoji-btn{font-size:1.15rem;padding:.2rem .25rem;background:transparent;border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;line-height:1}
.emoji-btn:hover,.emoji-btn.sel{border-color:var(--accent);background:var(--accent-dim)}
.color-row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.color-btn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s}
.color-btn:hover,.color-btn.sel{border-color:var(--text);transform:scale(1.18)}
.days-editor{display:flex;flex-direction:column;gap:.6rem;max-height:340px;overflow-y:auto;padding-right:.25rem}
.days-editor::-webkit-scrollbar{width:4px}
.days-editor::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.day-editor-row{border:1px solid var(--border);border-radius:3px;overflow:hidden}
.day-editor-hdr{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;background:var(--accent-dimmer);cursor:pointer;font-size:.68rem;user-select:none}
.day-editor-hdr:hover{background:var(--accent-dim)}
.day-editor-body{display:none;padding:.75rem;flex-direction:column;gap:.45rem}
.day-editor-body.open{display:flex}
.action-editor-row{display:flex;gap:.4rem;align-items:flex-start}
.action-editor-row .input{flex:1;font-size:.73rem;padding:.38rem .5rem}
.btn-icon{font-size:.75rem;padding:.32rem .45rem;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace;flex-shrink:0}
.btn-icon:hover{border-color:var(--danger);color:var(--danger)}
.add-action-btn{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.28rem .55rem;background:transparent;border:1px dashed var(--border);border-radius:3px;color:var(--muted);cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace}
.add-action-btn:hover{border-color:var(--success);color:var(--success)}
.copy-btn{margin-left:.3rem}
.btn{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.6rem 1.4rem;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:500}
.btn-primary:hover{opacity:.85}
.empty-state{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-state h2{font-family:'Fraunces',serif;font-size:1.4rem;font-style:italic;font-weight:300;margin-bottom:.75rem;color:var(--text)}
.empty-state p{font-size:.75rem;line-height:1.8;margin-bottom:1.5rem}
@media(max-width:900px){.content-grid{grid-template-columns:1fr}.detail-card{position:static}}
@media(max-width:580px){.main{padding:1rem 1rem 3rem}.prog-header{flex-direction:column}.prog-stats{justify-content:flex-start}.field-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="top-nav">
  <a class="back-link" href="../../index.html">← Accueil</a>
  <div class="nav-title">Chal<span>lenges</span></div>
  <div class="toggle-wrap">
    <span class="toggle-icon">🌙</span>
    <div class="toggle" id="themeToggle" role="button" tabindex="0"></div>
    <span class="toggle-icon">☀️</span>
  </div>
</nav>

<div class="main">
  <div class="prog-bar">
    <div class="prog-tabs" id="progTabs"></div>
    <button class="prog-tab add-tab" id="addProgBtn">+ Nouveau</button>
  </div>
  <div id="appContent"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Nouveau programme</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" id="modalCancel">Annuler</button>
      <button class="btn btn-primary" id="modalSave">Créer</button>
    </div>
  </div>
</div>

<script>
// ── THEME ─────────────────────────────────────────────────────
const html=document.documentElement;
const themeToggle=document.getElementById('themeToggle');
html.setAttribute('data-theme',localStorage.getItem('theme')||'dark');
themeToggle.addEventListener('click',()=>{
  const n=html.getAttribute('data-theme')==='dark'?'light':'dark';
  html.setAttribute('data-theme',n);localStorage.setItem('theme',n);
});

// ── STORAGE ───────────────────────────────────────────────────
function loadPrograms(){try{return JSON.parse(localStorage.getItem('ch-progs')||'[]')}catch{return[]}}
function savePrograms(p){localStorage.setItem('ch-progs',JSON.stringify(p))}
function loadProgress(){try{return JSON.parse(localStorage.getItem('ch-prog')||'{}')}catch{return{}}}
function saveProgress(p){localStorage.setItem('ch-prog',JSON.stringify(p))}

let programs=loadPrograms();
let progress=loadProgress();
let activeProg=null;
let selectedDayIdx=null;

// ── UTILS ─────────────────────────────────────────────────────
function todayISO(){return new Date().toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((new Date(b)-new Date(a))/(864e5))}
function formatDate(iso){return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function formatDateShort(iso){return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function uid(){return Math.random().toString(36).slice(2,9)}
function getDayISO(prog,idx){return addDays(prog.startDate,idx)}
function getProgress(pid,idx){return(progress[pid]&&progress[pid][idx])||[]}
function setProgress(pid,idx,ids){if(!progress[pid])progress[pid]={};progress[pid][idx]=ids;saveProgress(progress)}

function getDayState(prog,idx){
  const iso=getDayISO(prog,idx);
  const today=todayISO();
  const acts=prog.days[idx]?.actions||[];
  const done=getProgress(prog.id,idx);
  if(iso>today)return'future';
  if(!acts.length)return'empty';
  if(done.length>=acts.length)return'done';
  if(done.length>0)return'partial';
  return iso<today?'missed':'today';
}

function countDone(prog){
  let n=0;
  for(let i=0;i<prog.duration;i++){
    if(getDayISO(prog,i)>todayISO())break;
    const acts=prog.days[i]?.actions||[];
    if(acts.length&&getProgress(prog.id,i).length>=acts.length)n++;
  }
  return n;
}

function currentStreak(prog){
  let streak=0,i=prog.duration-1;
  while(i>=0&&getDayISO(prog,i)>todayISO())i--;
  while(i>=0){
    const acts=prog.days[i]?.actions||[];
    if(acts.length&&getProgress(prog.id,i).length>=acts.length){streak++;i--;}
    else break;
  }
  return streak;
}

function currentDayIdx(prog){
  return Math.max(0,Math.min(diffDays(prog.startDate,todayISO()),prog.duration-1));
}

// ── PRESETS ───────────────────────────────────────────────────
const PRESETS=[
  {
    id:'p-pec',name:'Pectoraux',emoji:'💪',color:'#e8c97a',duration:30,startDate:todayISO(),
    days:Array.from({length:30},(_,i)=>{
      const w=Math.floor(i/7);const s=[3,3,4,4][Math.min(w,3)];const r=[10,12,15,15][Math.min(w,3)];
      return{actions:[
        {id:`pec${i}a`,text:`Pompes — ${s}×${r}`,note:'Dos droit, coudes à 45°'},
        {id:`pec${i}b`,text:`Dips entre 2 chaises — ${s}×${Math.round(r*.8)}`,note:'Descendre à 90°'},
        {id:`pec${i}c`,text:'Étirements pectoraux — 2×30s',note:'Bras en croix contre un mur'},
      ]};
    })
  },
  {
    id:'p-cui',name:'Cuisine saine',emoji:'🥗',color:'#7ae8b0',duration:7,startDate:todayISO(),
    days:[
      {actions:[{id:'c0a',text:'Batch cooking de la semaine',note:'1h30 max'},{id:'c0b',text:'Soupe de légumes maison',note:''},{id:'c0c',text:'Légumineuses pour 3 jours',note:'Pois chiches, lentilles…'}]},
      {actions:[{id:'c1a',text:'Petit-dej sans sucre ajouté',note:''},{id:'c1b',text:'Plat à base de légumineuses',note:''},{id:'c1c',text:'Vinaigrette maison',note:''}]},
      {actions:[{id:'c2a',text:'Repas entièrement végétal',note:''},{id:'c2b',text:'Salade de céréales (quinoa…)',note:''},{id:'c2c',text:'Zéro plat transformé',note:''}]},
      {actions:[{id:'c3a',text:'Poisson en papillote',note:''},{id:'c3b',text:'Snacks sains (noix, fruits)',note:''},{id:'c3c',text:'Sauce tomate maison',note:''}]},
      {actions:[{id:'c4a',text:'Jour sans gluten',note:'Riz, sarrasin, patate douce'},{id:'c4b',text:'Épices anti-inflammatoires',note:'Curcuma, gingembre'},{id:'c4c',text:'Dessert sans sucre raffiné',note:''}]},
      {actions:[{id:'c5a',text:'Repas végétarien complet',note:''},{id:'c5b',text:'Pain ou crackers maison',note:''},{id:'c5c',text:'Un légume jamais cuisiné',note:''}]},
      {actions:[{id:'c6a',text:'Bilan de la semaine',note:''},{id:'c6b',text:'Planifier la semaine suivante',note:''},{id:'c6c',text:'Cuisiner un plat à partager',note:''}]},
    ]
  },
  {
    id:'p-conf',name:'Confiance en soi',emoji:'🧠',color:'#a78bfa',duration:90,startDate:todayISO(),
    days:Array.from({length:90},(_,i)=>{
      const p=Math.floor(i/30);
      const phases=[
        ['Écrire 3 forces personnelles dans un carnet','1 compliment sincère à quelqu\'un','Identifier une peur et son origine'],
        ['Faire une chose hors zone de confort','Méditation guidée 10 minutes','Lire 20 min développement personnel'],
        ['Décision sans demander validation','Power pose 2 minutes','Journaling : fierté de la semaine'],
      ];
      return{actions:phases[p].map((text,j)=>({id:`cf${i}-${j}`,text,note:''}))};
    })
  },
  {
    id:'p-keg',name:'Kegel',emoji:'🌸',color:'#7abfe8',duration:15,startDate:todayISO(),
    days:Array.from({length:15},(_,i)=>{
      const r=10+i*2;const h=Math.min(3+Math.floor(i/3),8);
      return{actions:[
        {id:`kg${i}a`,text:`Contractions lentes — ${Math.round(r/2)}×${h}s`,note:'Expire pendant la contraction'},
        {id:`kg${i}b`,text:`Contractions rapides — ${r} reps`,note:'1 seconde par contraction'},
        {id:`kg${i}c`,text:'Relaxation pelvienne — 2 min',note:'Allongé(e), respiration abdominale'},
      ]};
    })
  },
];

if(!programs.length){programs=PRESETS.map(p=>({...p}));savePrograms(programs);}

// ── RENDER ALL ────────────────────────────────────────────────
function renderAll(){
  renderTabs();
  if(!activeProg&&programs.length)activeProg=programs[0].id;
  const prog=programs.find(p=>p.id===activeProg);
  if(!prog){renderEmpty();return;}
  if(selectedDayIdx===null)selectedDayIdx=currentDayIdx(prog);
  renderContent(prog);
}

function renderTabs(){
  const tabs=document.getElementById('progTabs');
  tabs.innerHTML='';
  programs.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='prog-tab'+(p.id===activeProg?' active':'');
    btn.textContent=`${p.emoji} ${p.name}`;
    btn.addEventListener('click',()=>{activeProg=p.id;selectedDayIdx=null;renderAll();});
    tabs.appendChild(btn);
  });
}

function renderEmpty(){
  document.getElementById('appContent').innerHTML=`<div class="empty-state">
    <h2>Aucun programme</h2>
    <p>Crée ton premier challenge en cliquant sur « + Nouveau ».</p>
    <button class="btn btn-primary" onclick="openCreateModal()">+ Créer un programme</button>
  </div>`;
}

function renderContent(prog){
  const done=countDone(prog);
  const pct=Math.round(done/prog.duration*100);
  const streak=currentStreak(prog);
  const todayIdx=currentDayIdx(prog);
  const remaining=Math.max(0,prog.duration-todayIdx-1);

  document.getElementById('appContent').innerHTML=`
    <div class="prog-header">
      <div>
        <div class="prog-name">${prog.emoji} ${prog.name}</div>
        <div class="prog-sub">Programme ${prog.duration} jours · démarré le ${formatDateShort(prog.startDate)}</div>
        ${streak>1?`<div class="streak-badge">🔥 ${streak} jours consécutifs</div>`:''}
      </div>
      <div class="prog-stats">
        <div class="stat"><div class="stat-val" id="statDone">${done}</div><div class="stat-lbl">Jours ok</div></div>
        <div class="stat"><div class="stat-val" id="statPct">${pct}%</div><div class="stat-lbl">Progression</div></div>
        <div class="stat"><div class="stat-val">${remaining}</div><div class="stat-lbl">Restants</div></div>
      </div>
      <div class="prog-actions">
        <button class="btn-sm" onclick="openEditModal('${prog.id}')">✎</button>
        <button class="btn-sm danger" onclick="deleteProgram('${prog.id}')">✕</button>
      </div>
    </div>
    <div class="prog-progress">
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:${pct}%"></div></div>
      <div class="progress-labels"><span>Jour 1</span><span>${done}/${prog.duration} complétés</span><span>Jour ${prog.duration}</span></div>
    </div>
    <div class="content-grid">
      <div class="calendar-card" id="calCard"></div>
      <div class="detail-card" id="detailCard"></div>
    </div>`;

  renderCalendar(prog);
  renderDetail(prog);
}

// ── CALENDAR ──────────────────────────────────────────────────
const PAGE=35;

function renderCalendar(prog){
  const card=document.getElementById('calCard');
  if(!card)return;
  const page=Math.floor((selectedDayIdx||0)/PAGE);
  const start=page*PAGE;
  const end=Math.min(start+PAGE,prog.duration);

  card.innerHTML=`
    <div class="cal-header">
      <div class="cal-title">📅 Jours ${start+1}–${end} / ${prog.duration}</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="calPrev">◀</button>
        <button class="cal-nav-btn" id="calNext">▶</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid">
      ${['L','M','M','J','V','S','D'].map(d=>`<div class="cal-day-label">${d}</div>`).join('')}
    </div>`;

  const grid=document.getElementById('calGrid');
  const firstDate=new Date(prog.startDate+'T12:00:00');
  firstDate.setDate(firstDate.getDate()+start);
  const firstWday=(firstDate.getDay()+6)%7;

  for(let e=0;e<firstWday;e++){
    const emp=document.createElement('div');emp.className='cal-day empty';grid.appendChild(emp);
  }
  for(let idx=start;idx<start+PAGE;idx++){
    if(idx>=prog.duration){
      const emp=document.createElement('div');emp.className='cal-day outside-range';grid.appendChild(emp);
      continue;
    }
    const state=getDayState(prog,idx);
    const iso=getDayISO(prog,idx);
    const isToday=iso===todayISO();
    const isSel=idx===selectedDayIdx;
    const cell=document.createElement('div');
    let cls='cal-day '+state;
    if(isToday)cls+=' today';
    if(isSel)cls+=' selected';
    cell.className=cls;
    cell.innerHTML=`<div class="day-num">${idx+1}</div><div class="day-dot"></div>`;
    cell.title=`Jour ${idx+1} — ${formatDateShort(iso)}`;
    cell.addEventListener('click',()=>{selectedDayIdx=idx;renderCalendar(prog);renderDetail(prog);});
    grid.appendChild(cell);
  }

  document.getElementById('calPrev').addEventListener('click',()=>{
    selectedDayIdx=Math.max(0,(page-1)*PAGE);renderCalendar(prog);renderDetail(prog);
  });
  document.getElementById('calNext').addEventListener('click',()=>{
    selectedDayIdx=Math.min(prog.duration-1,(page+1)*PAGE);renderCalendar(prog);renderDetail(prog);
  });
}

// ── DETAIL ────────────────────────────────────────────────────
function renderDetail(prog){
  const card=document.getElementById('detailCard');
  if(!card)return;
  const idx=selectedDayIdx??currentDayIdx(prog);
  const iso=getDayISO(prog,idx);
  const acts=prog.days[idx]?.actions||[];
  const done=getProgress(prog.id,idx);
  const isFuture=iso>todayISO();
  const pct=acts.length?Math.round(done.length/acts.length*100):0;

  card.innerHTML=`
    <div class="detail-header">
      <div class="detail-date">${formatDate(iso)}</div>
      <div class="detail-day-num">Jour ${idx+1}</div>
    </div>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-footer">
      <span>${done.length}/${acts.length}</span>
      <div class="detail-progress-mini"><div class="detail-progress-fill" style="width:${pct}%"></div></div>
      <span>${pct}%</span>
    </div>`;

  const body=document.getElementById('detailBody');
  if(!acts.length){body.innerHTML=`<div class="detail-empty">Aucune action définie<br>pour ce jour.</div>`;return;}

  const list=document.createElement('div');list.className='action-list';
  acts.forEach(act=>{
    const checked=done.includes(act.id);
    const item=document.createElement('div');
    item.className='action-item'+(checked?' checked':'');
    if(isFuture)item.style.opacity='.5';
    item.innerHTML=`<div class="action-check"></div>
      <div><div class="action-text">${act.text}</div>${act.note?`<div class="action-note">${act.note}</div>`:''}</div>`;
    if(!isFuture){
      item.addEventListener('click',()=>{
        const cur=getProgress(prog.id,idx);
        const next=cur.includes(act.id)?cur.filter(x=>x!==act.id):[...cur,act.id];
        setProgress(prog.id,idx,next);
        // refresh stats
        const d2=countDone(prog);
        const p2=Math.round(d2/prog.duration*100);
        const sd=document.getElementById('statDone');
        const sp=document.getElementById('statPct');
        const pf=document.getElementById('progFill');
        if(sd)sd.textContent=d2;
        if(sp)sp.textContent=p2+'%';
        if(pf)pf.style.width=p2+'%';
        renderCalendar(prog);renderDetail(prog);
      });
    }
    list.appendChild(item);
  });
  body.appendChild(list);
}

// ── MODAL ─────────────────────────────────────────────────────
const EMOJIS=['💪','🥗','🧠','🌸','🏃','📚','🧘','✍️','🎯','💧','🌿','🔥','⚡','🎨','🎵','🏋️','🚴','🥦'];
const COLORS=['#e8c97a','#7ae8b0','#a78bfa','#7abfe8','#e87a7a','#f0a060','#60d0a0','#e0a0e0','#80d0e0'];

let editingId=null;
let modalDays=[];
let selEmoji='🎯';
let selColor='#e8c97a';

function openCreateModal(){editingId=null;buildModal(null);document.getElementById('modalOverlay').classList.add('open');}
function openEditModal(id){editingId=id;buildModal(programs.find(p=>p.id===id));document.getElementById('modalOverlay').classList.add('open');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}

document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modalCancel').addEventListener('click',closeModal);
document.getElementById('addProgBtn').addEventListener('click',openCreateModal);
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();});

function buildModal(prog){
  document.getElementById('modalTitle').textContent=prog?`Éditer — ${prog.name}`:'Nouveau programme';
  document.getElementById('modalSave').textContent=prog?'Enregistrer':'Créer';
  selEmoji=prog?.emoji||'🎯';
  selColor=prog?.color||'#e8c97a';
  const dur=prog?.duration||30;
  modalDays=prog?.days?prog.days.map(d=>({actions:d.actions.map(a=>({...a}))})):Array.from({length:dur},()=>({actions:[]}));

  const body=document.getElementById('modalBody');
  body.innerHTML=`
    <div class="field-row">
      <div class="field"><div class="label">Nom</div><input class="input" id="mName" placeholder="Ex: Pompes 30 jours" value="${prog?.name||''}"/></div>
      <div class="field"><div class="label">Durée</div>
        <select class="input" id="mDur">${[7,15,30,90].map(n=>`<option value="${n}"${dur==n?' selected':''}>${n} jours</option>`).join('')}</select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><div class="label">Emoji</div><div class="emoji-row" id="emojiRow">${EMOJIS.map(e=>`<button class="emoji-btn${e===selEmoji?' sel':''}" data-e="${e}">${e}</button>`).join('')}</div></div>
      <div class="field"><div class="label">Couleur</div><div class="color-row" id="colorRow">${COLORS.map(c=>`<div class="color-btn${c===selColor?' sel':''}" data-c="${c}" style="background:${c}"></div>`).join('')}</div></div>
    </div>
    <div class="field"><div class="label">Date de début</div><input class="input" type="date" id="mStart" value="${prog?.startDate||todayISO()}"/></div>
    <div class="field"><div class="label">Actions par jour</div><div class="days-editor" id="daysEditor"></div></div>`;

  body.querySelectorAll('.emoji-btn').forEach(b=>b.addEventListener('click',()=>{selEmoji=b.dataset.e;body.querySelectorAll('.emoji-btn').forEach(x=>x.classList.toggle('sel',x.dataset.e===selEmoji));}));
  body.querySelectorAll('.color-btn').forEach(b=>b.addEventListener('click',()=>{selColor=b.dataset.c;body.querySelectorAll('.color-btn').forEach(x=>x.classList.toggle('sel',x.dataset.c===selColor));}));
  document.getElementById('mDur').addEventListener('change',e=>{
    const n=parseInt(e.target.value);
    while(modalDays.length<n)modalDays.push({actions:[]});
    modalDays=modalDays.slice(0,n);
    renderDaysEditor();
  });
  renderDaysEditor();
}

function renderDaysEditor(){
  const editor=document.getElementById('daysEditor');
  if(!editor)return;
  editor.innerHTML='';
  modalDays.forEach((day,idx)=>{
    const row=document.createElement('div');row.className='day-editor-row';
    const hdr=document.createElement('div');hdr.className='day-editor-hdr';
    const bdy=document.createElement('div');bdy.className='day-editor-body';

    function updHdr(){hdr.innerHTML=`<span>Jour ${idx+1}</span><span>${day.actions.length} action${day.actions.length!==1?'s':''}${day.actions.length?' ✓':''}</span>`;}
    updHdr();
    hdr.addEventListener('click',()=>bdy.classList.toggle('open'));

    function refreshActions(){
      bdy.innerHTML='';
      day.actions.forEach((act,ai)=>{
        const r=document.createElement('div');r.className='action-editor-row';
        r.innerHTML=`<input class="input" placeholder="Action…" value="${act.text}"/><input class="input" placeholder="Note" value="${act.note||''}" style="max-width:120px"/><button class="btn-icon">✕</button>`;
        r.querySelectorAll('.input')[0].addEventListener('input',e=>{day.actions[ai].text=e.target.value;updHdr();});
        r.querySelectorAll('.input')[1].addEventListener('input',e=>{day.actions[ai].note=e.target.value;});
        r.querySelector('.btn-icon').addEventListener('click',()=>{day.actions.splice(ai,1);refreshActions();updHdr();});
        bdy.appendChild(r);
      });
      const addBtn=document.createElement('button');addBtn.className='add-action-btn';addBtn.textContent='+ Action';
      addBtn.addEventListener('click',()=>{day.actions.push({id:uid(),text:'',note:''});refreshActions();updHdr();});
      bdy.appendChild(addBtn);
      if(idx>0&&modalDays[idx-1].actions.length){
        const cp=document.createElement('button');cp.className='add-action-btn copy-btn';cp.textContent='↑ Copier jour précédent';
        cp.addEventListener('click',()=>{day.actions=modalDays[idx-1].actions.map(a=>({...a,id:uid()}));refreshActions();updHdr();});
        bdy.appendChild(cp);
      }
    }
    refreshActions();
    row.appendChild(hdr);row.appendChild(bdy);
    editor.appendChild(row);
  });
}

document.getElementById('modalSave').addEventListener('click',()=>{
  const name=document.getElementById('mName')?.value.trim();
  if(!name){alert('Donne un nom au programme.');return;}
  const dur=parseInt(document.getElementById('mDur').value);
  const start=document.getElementById('mStart').value||todayISO();
  while(modalDays.length<dur)modalDays.push({actions:[]});
  const days=modalDays.slice(0,dur);
  if(editingId){
    const i=programs.findIndex(p=>p.id===editingId);
    if(i>-1)programs[i]={...programs[i],name,emoji:selEmoji,color:selColor,duration:dur,startDate:start,days};
  }else{
    const np={id:uid(),name,emoji:selEmoji,color:selColor,duration:dur,startDate:start,days};
    programs.push(np);activeProg=np.id;
  }
  savePrograms(programs);selectedDayIdx=null;closeModal();renderAll();
});

function deleteProgram(id){
  if(!confirm('Supprimer ce programme et sa progression ?'))return;
  programs=programs.filter(p=>p.id!==id);
  delete progress[id];
  savePrograms(programs);saveProgress(progress);
  if(activeProg===id)activeProg=programs[0]?.id||null;
  selectedDayIdx=null;renderAll();
}

renderAll();
</script>
</body>
