<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Cuisine — Recettes pour débutants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e59834;
    --gold-light: rgba(229,152,52,0.15);
    --bg: #0d0d1a;
    --bg2: #1a1a2e;
    --bg3: #0f2744;
    --text: #f0e6d3;
    --text-muted: #aaa;
    --text-dim: #888;
    --border: rgba(255,255,255,0.1);
    --teal: #4ecdc4;
    --red: #ff6b6b;
    --yellow: #ffe66d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 40%, var(--bg3) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 16px;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
  ::-webkit-scrollbar-thumb { background: rgba(229,152,52,0.3); border-radius: 3px; }

  /* ── TIMER BAR ─────────────────────────────── */
  #timer-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: 56px;
    background: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-bottom: 2px solid rgba(229,152,52,0.4);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .timer-brand { display: flex; align-items: center; gap: 8px; }
  .timer-brand span { color: var(--gold); font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
  .timers-wrap { display: flex; gap: 12px; }
  .timer-widget {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; padding: 4px 12px;
    transition: all 0.3s;
  }
  .timer-widget.running {
    background: rgba(229,152,52,0.15);
    border-color: rgba(229,152,52,0.6);
  }
  .timer-icon { font-size: 14px; color: var(--text-muted); }
  .timer-widget.running .timer-icon { color: var(--gold); }
  .timer-display {
    font-family: 'Courier New', monospace; font-weight: 700; font-size: 17px;
    color: #ccc; min-width: 60px; letter-spacing: 2px;
  }
  .timer-widget.running .timer-display { color: var(--gold); }
  .btn-timer {
    background: rgba(255,255,255,0.1); border: none; border-radius: 6px;
    color: #ccc; font-weight: 700; cursor: pointer; padding: 3px 10px; font-size: 13px;
    transition: all 0.2s; font-family: inherit;
  }
  .timer-widget.running .btn-timer { background: var(--gold); color: #1a1a2e; }
  .btn-reset {
    background: transparent; border: none; color: #888; cursor: pointer;
    padding: 3px 6px; font-size: 14px; font-family: inherit;
    transition: color 0.2s;
  }
  .btn-reset:hover { color: var(--red); }

  /* ── LAYOUT ────────────────────────────────── */
  #app { padding-top: 56px; }
  .page { display: none; }
  .page.active { display: block; }
  
  /* ── HOME PAGE ─────────────────────────────── */
  .home-wrapper { max-width: 1100px; margin: 0 auto; padding: 48px 24px 60px; }
  .home-header { text-align: center; margin-bottom: 40px; }
  .home-label {
    color: var(--gold); font-family: monospace; font-size: 12px;
    text-transform: uppercase; letter-spacing: 4px; margin-bottom: 12px; display: block;
  }
  .home-title {
    font-family: 'Playfair Display', serif; font-size: clamp(36px, 6vw, 58px);
    font-weight: 900; line-height: 1.1; margin-bottom: 14px;
  }
  .home-sub { color: var(--text-dim); font-size: 16px; max-width: 480px; margin: 0 auto; line-height: 1.6; }

  /* ── FILTERS ───────────────────────────────── */
  .filters { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; justify-content: center; }
  .filter-sep { width: 1px; background: rgba(255,255,255,0.12); margin: 4px; }
  .btn-filter {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-muted); border-radius: 20px; padding: 7px 18px;
    cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s;
  }
  .btn-filter.active {
    background: rgba(229,152,52,0.2); border-color: var(--gold); color: var(--gold); font-weight: 600;
  }
  .recipe-count { color: #666; font-size: 13px; text-align: center; margin-bottom: 20px; }

  /* ── RECIPE GRID ───────────────────────────── */
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .recipe-card {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; cursor: pointer;
    transition: all 0.25s ease;
  }
  .recipe-card:hover {
    background: rgba(229,152,52,0.08);
    border-color: rgba(229,152,52,0.4);
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }
  .card-emoji { font-size: 42px; margin-bottom: 12px; display: block; }
  .card-meta { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-family: monospace; }
  .card-name { color: var(--text); font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
  .card-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
  .card-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    background: rgba(255,255,255,0.07); border-radius: 6px;
    padding: 3px 9px; color: #bbb; font-size: 12px;
  }

  /* ── RECIPE PAGE ───────────────────────────── */
  .recipe-header {
    background: linear-gradient(180deg, rgba(229,152,52,0.07) 0%, transparent 100%);
    padding: 24px 32px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .btn-back {
    background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-muted);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px;
    margin-bottom: 18px; font-family: inherit; transition: all 0.2s; display: inline-block;
  }
  .btn-back:hover { border-color: var(--gold); color: var(--gold); }
  .recipe-header-inner { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .recipe-header-left { flex: 1; min-width: 280px; }
  .recipe-category-badge { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-family: monospace; margin-bottom: 8px; }
  .recipe-title { font-family: 'Playfair Display', serif; font-size: clamp(22px, 4vw, 34px); font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
  .recipe-tagline { color: var(--text-muted); font-size: 14px; margin-bottom: 14px; line-height: 1.6; }
  .recipe-times { display: flex; gap: 10px; flex-wrap: wrap; }
  .time-badge {
    background: rgba(255,255,255,0.06); border-radius: 8px; padding: 5px 12px;
    color: #ccc; font-size: 13px;
  }
  .time-badge.total { background: rgba(229,152,52,0.15); color: var(--gold); font-weight: 600; }

  <nav class="top-nav">
  <a class="back-link" href="../../index.html">← Accueil</a>
  <div class="nav-title">Reci<span>Pe</span></div>
  <div class="toggle-wrap">
    <span class="toggle-icon">🌙</span>
    <div class="toggle" id="themeToggle" role="button" tabindex="0"></div>
    <span class="toggle-icon">☀️</span>
  </div>
  </nav>
  
  /* Nutrition panel */
  .nutrition-panel {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; min-width: 210px; max-width: 250px;
  }
  .nutrition-title { color: var(--gold); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .servings-control { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .btn-serving {
    background: rgba(229,152,52,0.2); border: 1px solid var(--gold); color: var(--gold);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 20px;
    font-weight: 700; display: flex; align-items: center; justify-content: center;
    font-family: inherit; line-height: 1; transition: background 0.2s;
  }
  .btn-serving:hover { background: rgba(229,152,52,0.35); }
  .servings-num { color: var(--text); font-size: 22px; font-weight: 700; font-family: 'Playfair Display', serif; min-width: 28px; text-align: center; }
  .servings-label { color: var(--text-dim); font-size: 13px; }
  .kcal-box { background: rgba(229,152,52,0.1); border-radius: 8px; padding: 7px 12px; margin-bottom: 12px; text-align: center; }
  .kcal-num { color: var(--gold); font-weight: 700; font-size: 20px; }
  .kcal-label { color: var(--text-muted); font-size: 12px; margin-left: 5px; }
  .macro-row { margin-bottom: 10px; }
  .macro-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .macro-name { color: var(--text-muted); font-size: 12px; }
  .macro-val { color: var(--text); font-size: 12px; font-weight: 600; }
  .macro-track { background: rgba(255,255,255,0.08); border-radius: 4px; height: 6px; overflow: hidden; }
  .macro-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }

  /* ── RECIPE BODY ───────────────────────────── */
  .recipe-body { display: flex; align-items: flex-start; }
  .steps-panel { flex: 1; padding: 24px 28px; min-width: 0; }
  .step-nav { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .btn-step {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-muted); border-radius: 8px; padding: 6px 14px;
    cursor: pointer; font-size: 13px; font-family: inherit; transition: all 0.2s;
  }
  .btn-step.active {
    background: var(--gold); border-color: var(--gold); color: #1a1a2e; font-weight: 700;
  }
  .step-card {
    background: rgba(229,152,52,0.05); border: 1px solid rgba(229,152,52,0.25);
    border-radius: 16px; padding: 24px;
  }
  .step-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
  .step-label { color: var(--gold); font-family: monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
  .step-title { color: var(--text); font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; line-height: 1.2; }
  .step-duration {
    background: rgba(229,152,52,0.15); border: 1px solid rgba(229,152,52,0.3);
    border-radius: 10px; padding: 6px 14px; text-align: center; flex-shrink: 0;
  }
  .step-duration-num { color: var(--gold); font-weight: 700; font-size: 18px; display: block; }
  .step-duration-unit { color: var(--text-muted); font-size: 11px; }
  .step-text { color: #d4c5b0; font-size: 15px; line-height: 1.85; margin-bottom: 16px; }
  .step-tip {
    background: rgba(78,205,196,0.08); border: 1px solid rgba(78,205,196,0.25);
    border-radius: 10px; padding: 12px 16px;
  }
  .step-tip p { color: var(--teal); font-size: 14px; line-height: 1.7; }
  .step-footer { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
  .btn-nav {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #ccc; border-radius: 10px; padding: 10px 20px; cursor: pointer;
    font-size: 14px; font-family: inherit; transition: all 0.2s;
  }
  .btn-nav:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
  .btn-nav:disabled { opacity: 0.35; cursor: default; }
  .btn-nav.next {
    background: rgba(229,152,52,0.2); border-color: var(--gold); color: var(--gold); font-weight: 600;
  }
  .btn-nav.next:hover:not(:disabled) { background: rgba(229,152,52,0.35); }

  /* ── INGREDIENTS SIDEBAR ───────────────────── */
  .ingredients-sidebar {
    width: 270px; flex-shrink: 0;
    padding: 24px 20px 24px 0;
    position: sticky; top: 56px;
    max-height: calc(100vh - 56px);
    overflow-y: auto;
  }
  .ing-panel {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px;
  }
  .ing-panel-title { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .ing-item {
    padding: 8px 10px; border-radius: 8px; margin-bottom: 4px;
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .ing-item.active {
    background: rgba(229,152,52,0.12);
    border-color: rgba(229,152,52,0.35);
  }
  .ing-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .ing-name { color: #888; font-size: 13px; line-height: 1.4; flex: 1; }
  .ing-item.active .ing-name { color: var(--text); font-weight: 600; }
  .ing-active-dot { color: var(--gold); margin-right: 4px; font-size: 10px; }
  .ing-qty { color: #666; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ing-item.active .ing-qty { color: var(--gold); }
  .ing-tip { color: var(--teal); font-size: 11px; margin-top: 4px; line-height: 1.5; font-style: italic; }

  /* ── RESPONSIVE ────────────────────────────── */
  @media (max-width: 768px) {
    .recipe-header { padding: 16px; }
    .recipe-header-inner { flex-direction: column; }
    .nutrition-panel { max-width: 100%; width: 100%; }
    .recipe-body { flex-direction: column-reverse; }
    .ingredients-sidebar { width: 100%; position: static; max-height: none; padding: 0 16px 0; }
    .steps-panel { padding: 16px; }
    .timers-wrap { gap: 8px; }
    .timer-widget { padding: 4px 8px; gap: 5px; }
    .timer-display { font-size: 14px; min-width: 50px; }
    .home-wrapper { padding: 32px 16px 48px; }
  }
  @media (max-width: 480px) {
    .timer-brand span { display: none; }
    .recipe-header { padding: 12px; }
  }
</style>
</head>
<body>

<div id="timer-bar">
  <div class="timer-brand">
    <span>👨‍🍳</span>
    <span>Ma Cuisine</span>
  </div>
  <div class="timers-wrap">
    <div class="timer-widget" id="tw1">
      <span class="timer-icon">⏱</span>
      <span class="timer-display" id="td1">00:00</span>
      <button class="btn-timer" onclick="timerToggle(1)">▶</button>
      <button class="btn-reset" onclick="timerReset(1)" title="Reset">↺</button>
    </div>
    <div class="timer-widget" id="tw2">
      <span class="timer-icon">⏱</span>
      <span class="timer-display" id="td2">00:00</span>
      <button class="btn-timer" onclick="timerToggle(2)">▶</button>
      <button class="btn-reset" onclick="timerReset(2)" title="Reset">↺</button>
    </div>
  </div>
</div>

<div id="app">
  <!-- HOME PAGE -->
  <div id="page-home" class="page active">
    <div class="home-wrapper">
      <div class="home-header">
        <span class="home-label">Recettes pour débutants</span>
        <h1 class="home-title">Ma Cuisine 🍳</h1>
        <p class="home-sub">Toutes les recettes expliquées pas à pas, avec conseils et astuces pour apprendre à cuisiner facilement.</p>
      </div>

      <div class="filters">
        <button class="btn-filter active" data-cat="all" onclick="setFilter('cat','all',this)">Toutes les recettes</button>
        <button class="btn-filter" data-cat="plat" onclick="setFilter('cat','plat',this)">🍽️ Plats</button>
        <button class="btn-filter" data-cat="dessert" onclick="setFilter('cat','dessert',this)">🍰 Desserts</button>
        <div class="filter-sep"></div>
        <button class="btn-filter active" data-oven="all" onclick="setFilter('oven','all',this)">Toutes cuissons</button>
        <button class="btn-filter" data-oven="noOven" onclick="setFilter('oven','noOven',this)">🚫 Sans four</button>
        <button class="btn-filter" data-oven="oven" onclick="setFilter('oven','oven',this)">🔥 Avec four</button>
      </div>
      <p class="recipe-count" id="recipe-count"></p>
      <div class="recipe-grid" id="recipe-grid"></div>
    </div>
  </div>

  <!-- RECIPE PAGE -->
  <div id="page-recipe" class="page">
    <div class="recipe-header">
      <button class="btn-back" onclick="showHome()">← Retour aux recettes</button>
      <div class="recipe-header-inner">
        <div class="recipe-header-left">
          <div class="recipe-category-badge" id="r-badge"></div>
          <h2 class="recipe-title" id="r-title"></h2>
          <p class="recipe-tagline" id="r-tagline"></p>
          <div class="recipe-times">
            <span class="time-badge" id="r-prep"></span>
            <span class="time-badge" id="r-cook"></span>
            <span class="time-badge total" id="r-total"></span>
          </div>
        </div>
        <div class="nutrition-panel">
          <div class="nutrition-title">Portions &amp; Nutrition</div>
          <div class="servings-control">
            <button class="btn-serving" onclick="changeServings(-1)">−</button>
            <span class="servings-num" id="servings-num">4</span>
            <button class="btn-serving" onclick="changeServings(1)">+</button>
            <span class="servings-label">personnes</span>
          </div>
          <div class="kcal-box">
            <span class="kcal-num" id="kcal-val">—</span>
            <span class="kcal-label">kcal total</span>
          </div>
          <div id="macros-panel"></div>
        </div>
      </div>
    </div>

    <div class="recipe-body">
      <div class="steps-panel">
        <div class="step-nav" id="step-nav"></div>
        <div class="step-card" id="step-card"></div>
        <div class="step-footer">
          <button class="btn-nav" id="btn-prev" onclick="changeStep(-1)">← Étape précédente</button>
          <button class="btn-nav next" id="btn-next" onclick="changeStep(1)">Étape suivante →</button>
        </div>
      </div>
      <div class="ingredients-sidebar">
        <div class="ing-panel">
          <div class="ing-panel-title">🧺 Ingrédients</div>
          <div id="ing-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────

const RECIPES = [
  {
    id: 1,
    name: "Émincé de porc aux légumes façon wok",
    emoji: "🥢",
    category: "plat",
    needsOven: false,
    prepTime: 15,
    cookTime: 15,
    baseServings: 4,
    kcalPerServing: 380,
    macros: { proteines: 32, lipides: 14, glucides: 18, fibres: 4 },
    description: "Un plat asiatique savoureux, coloré et rapide à préparer. Parfait pour un repas équilibré en semaine.",
    tips: "Le secret du wok : feu très vif et ingrédients coupés en petits morceaux pour une cuisson rapide et homogène.",
    ingredients: [
      { id:"i1", name:"Filet de porc", qty:600, unit:"g", tip:"Coupez-le en fines lamelles dans le sens contraire des fibres pour qu'il soit plus tendre." },
      { id:"i2", name:"Poivron rouge", qty:1, unit:"pièce", tip:"Lavez-le, coupez le haut et le bas, retirez les graines blanches, puis tranchez en lanières." },
      { id:"i3", name:"Poivron jaune", qty:1, unit:"pièce", tip:"Même technique que le rouge." },
      { id:"i4", name:"Courgette", qty:1, unit:"pièce", tip:"Lavez-la, pas besoin d'éplucher. Coupez en rondelles de 5mm." },
      { id:"i5", name:"Carotte", qty:2, unit:"pièces", tip:"Épluchez avec un économe, taillez en fins bâtonnets pour qu'elles cuisent vite." },
      { id:"i6", name:"Oignon", qty:1, unit:"pièce", tip:"Épluchez et émincez finement. Pour ne pas pleurer, réfrigérez-le 15 min avant." },
      { id:"i7", name:"Gousses d'ail", qty:3, unit:"pièces", tip:"Écrasez avec le plat du couteau pour retirer la peau, puis hachez finement." },
      { id:"i8", name:"Sauce soja", qty:4, unit:"c.à.s", tip:"Utilisez de la sauce soja claire pour saler." },
      { id:"i9", name:"Huile de sésame", qty:1, unit:"c.à.s", tip:"Ajoutez-la en fin de cuisson, jamais au début : elle brûle et perd son arôme." },
      { id:"i10", name:"Huile neutre", qty:2, unit:"c.à.s", tip:"Pour la cuisson au wok." },
      { id:"i11", name:"Gingembre frais", qty:1, unit:"cm", tip:"Épluchez avec une cuillère et râpez finement." },
      { id:"i12", name:"Maïzena", qty:1, unit:"c.à.s", tip:"Servira à épaissir légèrement la sauce." },
      { id:"i13", name:"Sel, poivre", qty:0, unit:"", tip:"" },
    ],
    steps: [
      { id:"s1", title:"Préparer la viande", duration:10, ingredientIds:["i1","i8","i12"],

        text:"Sortez la pâte du réfrigérateur. Chauffez une poêle à crêpes à feu moyen-vif. Huilez légèrement avec un papier absorbant. Versez une petite louche de pâte et inclinez immédiatement la poêle en rond pour étaler finement. Cuisez 1 minute jusqu'à ce que les bords se décollent, puis retournez et cuisez 30 secondes.",
        tip:"✨ Astuce : La première crêpe est souvent ratée — c'est normal ! Elle sert à calibrer la poêle. Mangez-la en cuisine, c'est le privilège du cuisinier !" },
      { id:"s4", title:"Garnitures et service", duration:5, ingredientIds:[],
        text:"Empilez les crêpes cuites sur une assiette. Garnissez selon vos envies : beurre + sucre, confiture, Nutella, ou jus de citron + sucre pour la version bretonne classique. Les crêpes se conservent 2-3 jours au réfrigérateur.",
        tip:"✨ Astuce : Vous pouvez congeler les crêpes en séparant chaque crêpe avec du papier cuisson." }
    ]
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────

let state = {
  catFilter: 'all',
  ovenFilter: 'all',
  currentRecipe: null,
  currentStep: 0,
  servings: 4,
};

// ─── TIMERS ───────────────────────────────────────────────────────────────

const timers = {
  1: { seconds: 0, running: false, interval: null },
  2: { seconds: 0, running: false, interval: null },
};

function formatTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

function timerToggle(id) {
  const t = timers[id];
  const w = document.getElementById('tw' + id);
  const d = document.getElementById('td' + id);
  const btn = w.querySelector('.btn-timer');
  if (t.running) {
    clearInterval(t.interval);
    t.running = false;
    w.classList.remove('running');
    btn.textContent = '▶';
  } else {
    t.interval = setInterval(() => {
      t.seconds++;
      d.textContent = formatTime(t.seconds);
    }, 1000);
    t.running = true;
    w.classList.add('running');
    btn.textContent = '⏸';
  }
}

function timerReset(id) {
  const t = timers[id];
  clearInterval(t.interval);
  t.running = false;
  t.seconds = 0;
  const w = document.getElementById('tw' + id);
  w.classList.remove('running');
  w.querySelector('.btn-timer').textContent = '▶';
  document.getElementById('td' + id).textContent = '00:00';
}

// ─── FILTERS ─────────────────────────────────────────────────────────────

function setFilter(type, value, btn) {
  if (type === 'cat') {
    state.catFilter = value;
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
  } else {
    state.ovenFilter = value;
    document.querySelectorAll('[data-oven]').forEach(b => b.classList.remove('active'));
  }
  btn.classList.add('active');
  renderGrid();
}

function getFiltered() {
  return RECIPES.filter(r => {
    if (state.catFilter !== 'all' && r.category !== state.catFilter) return false;
    if (state.ovenFilter === 'noOven' && r.needsOven) return false;
    if (state.ovenFilter === 'oven' && !r.needsOven) return false;
    return true;
  });
}

// ─── RENDER HOME ──────────────────────────────────────────────────────────

function renderGrid() {
  const filtered = getFiltered();
  const grid = document.getElementById('recipe-grid');
  const count = document.getElementById('recipe-count');
  count.textContent = `${filtered.length} recette${filtered.length !== 1 ? 's' : ''} disponible${filtered.length !== 1 ? 's' : ''}`;
  grid.innerHTML = filtered.map(r => `
    <div class="recipe-card" onclick="openRecipe(${r.id})">
      <span class="card-emoji">${r.emoji}</span>
      <div class="card-meta">${r.category === 'dessert' ? '🍰 Dessert' : '🍽️ Plat'} · ${r.needsOven ? '🔥 Four' : '🚫 Sans four'}</div>
      <div class="card-name">${r.name}</div>
      <div class="card-desc">${r.description}</div>
      <div class="card-tags">
        <span class="tag">⏱ ${r.prepTime + r.cookTime} min</span>
        <span class="tag">🔥 ${r.kcalPerServing} kcal</span>
        <span class="tag">👥 ${r.baseServings} pers.</span>
      </div>
    </div>
  `).join('');
}

// ─── OPEN RECIPE ──────────────────────────────────────────────────────────

function openRecipe(id) {
  const r = RECIPES.find(x => x.id === id);
  state.currentRecipe = r;
  state.currentStep = 0;
  state.servings = r.baseServings;
  renderRecipe();
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-recipe').classList.add('active');
  window.scrollTo(0, 0);
}

function showHome() {
  document.getElementById('page-recipe').classList.remove('active');
  document.getElementById('page-home').classList.add('active');
  window.scrollTo(0, 0);
}

// ─── RENDER RECIPE ────────────────────────────────────────────────────────

function renderRecipe() {
  const r = state.currentRecipe;
  const ratio = state.servings / r.baseServings;

  // Header
  document.getElementById('r-badge').textContent =
    (r.category === 'dessert' ? '🍰 Dessert' : '🍽️ Plat principal') +
    ' · ' + (r.needsOven ? '🔥 Nécessite un four' : '🚫 Sans four');
  document.getElementById('r-title').textContent = r.emoji + ' ' + r.name;
  document.getElementById('r-tagline').textContent = r.tips;
  document.getElementById('r-prep').textContent = '⏱ Prép : ' + r.prepTime + ' min';
  document.getElementById('r-cook').textContent = '🔥 Cuisson : ' + r.cookTime + ' min';
  document.getElementById('r-total').textContent = 'Total : ' + (r.prepTime + r.cookTime) + ' min';

  // Nutrition
  renderNutrition();

  // Step nav
  const nav = document.getElementById('step-nav');
  nav.innerHTML = r.steps.map((s, i) => `
    <button class="btn-step${i === state.currentStep ? ' active' : ''}" onclick="goToStep(${i})">${i+1}. ${s.title}</button>
  `).join('');

  // Step card
  renderStep();

  // Ingredients
  renderIngredients();
}

function renderNutrition() {
  const r = state.currentRecipe;
  const ratio = state.servings / r.baseServings;
  document.getElementById('servings-num').textContent = state.servings;
  document.getElementById('kcal-val').textContent = Math.round(r.kcalPerServing * ratio);

  const macroColors = {
    proteines: '#4ecdc4',
    glucides: '#ffe66d',
    lipides: '#ff6b6b',
    fibres: '#a8e6cf'
  };
  const macroMax = { proteines: 60, glucides: 80, lipides: 50, fibres: 20 };
  const macroLabels = { proteines: 'Protéines', glucides: 'Glucides', lipides: 'Lipides', fibres: 'Fibres' };

  document.getElementById('macros-panel').innerHTML = Object.keys(r.macros).map(k => {
    const val = Math.round(r.macros[k] * ratio);
    const pct = Math.min((val / macroMax[k]) * 100, 100);
    return `
      <div class="macro-row">
        <div class="macro-header">
          <span class="macro-name">${macroLabels[k]}</span>
          <span class="macro-val">${val}g</span>
        </div>
        <div class="macro-track"><div class="macro-fill" style="width:${pct}%;background:${macroColors[k]}"></div></div>
      </div>`;
  }).join('');
}

function renderStep() {
  const r = state.currentRecipe;
  const step = r.steps[state.currentStep];

  document.getElementById('step-card').innerHTML = `
    <div class="step-card-header">
      <div>
        <div class="step-label">Étape ${state.currentStep + 1} / ${r.steps.length}</div>
        <div class="step-title">${step.title}</div>
      </div>
      ${step.duration > 0 ? `
        <div class="step-duration">
          <span class="step-duration-num">${step.duration}</span>
          <span class="step-duration-unit">min</span>
        </div>` : ''}
    </div>
    <p class="step-text">${step.text}</p>
    ${step.tip ? `<div class="step-tip"><p>${step.tip}</p></div>` : ''}
  `;

  document.getElementById('btn-prev').disabled = state.currentStep === 0;
  document.getElementById('btn-next').disabled = state.currentStep === r.steps.length - 1;

  // Update step nav buttons
  document.querySelectorAll('.btn-step').forEach((btn, i) => {
    btn.classList.toggle('active', i === state.currentStep);
  });

  // Update ingredients highlights
  renderIngredients();
}

function renderIngredients() {
  const r = state.currentRecipe;
  const ratio = state.servings / r.baseServings;
  const activeIds = r.steps[state.currentStep].ingredientIds;

  document.getElementById('ing-list').innerHTML = r.ingredients.map(ing => {
    const isActive = activeIds.includes(ing.id);
    const scaledQty = ing.qty > 0
      ? (() => { const v = ing.qty * ratio; return Number.isInteger(v) ? v : Math.round(v * 10) / 10; })()
      : null;
    return `
      <div class="ing-item${isActive ? ' active' : ''}">
        <div class="ing-row">
          <span class="ing-name">${isActive ? '<span class="ing-active-dot">●</span>' : ''}${ing.name}</span>
          ${scaledQty !== null ? `<span class="ing-qty">${scaledQty}${ing.unit ? ' ' + ing.unit : ''}</span>` : ''}
        </div>
        ${isActive && ing.tip ? `<div class="ing-tip">${ing.tip}</div>` : ''}
      </div>`;
  }).join('');
}

function goToStep(i) {
  state.currentStep = i;
  renderStep();
}

function changeStep(dir) {
  const r = state.currentRecipe;
  const next = state.currentStep + dir;
  if (next >= 0 && next < r.steps.length) {
    state.currentStep = next;
    renderStep();
    document.querySelector('.steps-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function changeServings(dir) {
  const next = state.servings + dir;
  if (next < 1) return;
  state.servings = next;
  renderNutrition();
  renderIngredients();
}

// ─── INIT ─────────────────────────────────────────────────────────────────

renderGrid();
</script>
</body>
</html>
