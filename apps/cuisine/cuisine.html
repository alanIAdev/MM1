steps:[
{id:"s1",title:"Dorer la viande",duration:15,ingredientIds:["i1","i9","i10","i13"],
text:"Préchauffez le four à 160°C. Salez, poivrez et farinez les tranches d'osso buco. Dans une cocotte, chauffez l'huile à feu vif. Faites dorer les tranches 3-4 min par face. Réservez.",
tip:"✨ Fariner puis dorer = croûte savoureuse + la farine épaissira la sauce naturellement."},
{id:"s2",title:"Légumes et sauce",duration:10,ingredientIds:["i5","i6","i7","i8","i3","i2","i4"],
text:"Faites revenir oignon, carotte et céleri 5 min. Ajoutez l'ail 1 min. Versez le vin blanc, réduisez 2 min. Ajoutez tomates et bouillon. Remettez la viande.",
tip:"✨ Les dés de carotte, céleri et oignon s'appellent une 'mirepoix' — la base aromatique des plats mijotés italiens."},
{id:"s3",title:"Mijoter au four et gremolata",duration:90,ingredientIds:["i11","i12","i8"],
text:"Couvrez et enfournez à 160°C pendant 1h30. La viande doit se détacher de l'os. Préparez la gremolata : mélangez persil haché + zeste de citron + 1 gousse d'ail hachée. Parsemez juste avant de servir.",
tip:"✨ La gremolata est la touche finale OBLIGATOIRE. Elle apporte fraîcheur et luminosité à ce plat riche."}
]},

{id:27,name:"Épaule de veau aux légumes du soleil",emoji:"☀️",category:"plat",meat:"veau",needsOven:true,prepTime:15,cookTime:90,baseServings:4,kcalPerServing:440,macros:{proteines:40,lipides:18,glucides:16,fibres:5},

{id:"i5",name:"Tomates",qty:3,unit:"pièces",tip:"Coupez en quartiers."},
{id:"i6",name:"Oignon rouge",qty:1,unit:"pièce",tip:"Coupez en quartiers."},
{id:"i7",name:"Ail",qty:5,unit:"gousses",tip:"En chemise (avec la peau)."},
{id:"i8",name:"Huile d'olive",qty:4,unit:"c.à.s",tip:""},
{id:"i9",name:"Herbes de Provence",qty:2,unit:"c.à.c",tip:""},

steps:[
{id:"s1",title:"Préparer et dorer",duration:15,ingredientIds:["i1","i8","i9","i10"],
text:"Préchauffez le four à 180°C. Badigeonnez l'épaule d'huile d'olive, salez, poivrez, parsemez d'herbes. Dans une grande poêle, faites dorer l'épaule sur toutes les faces 8-10 min.",

{id:"s2",title:"Préparer les légumes et enfourner",duration:90,ingredientIds:["i2","i3","i4","i5","i6","i7","i8","i9","i10"],

tip:"✨ Les légumes doivent légèrement caraméliser. S'ils colorent trop vite, ajoutez un peu d'eau."}

// FOUR — POISSON
,{id:28,name:"Saumon en papillote aux légumes",emoji:"🐠",category:"plat",meat:"poisson",needsOven:true,prepTime:10,cookTime:20,baseServings:4,kcalPerServing:340,macros:{proteines:38,lipides:16,glucides:8,fibres:3},
description:"La papillote est la méthode la plus simple et saine du four. Le poisson cuit dans sa vapeur et reste toujours moelleux.",
tips:"La papillote doit être bien fermée pour que la vapeur reste à l'intérieur — c'est ce qui cuit le poisson.",
ingredients:[
{id:"i1",name:"Pavés de saumon",qty:4,unit:"pièces 150g",tip:"Frais de préférence. Séchez avec du papier absorbant."},
{id:"i2",name:"Courgette",qty:1,unit:"pièce",tip:"Très fines rondelles (2mm) pour qu'elles cuisent vite."},
{id:"i3",name:"Tomates cerises",qty:200,unit:"g",tip:"Coupez en deux."},
{id:"i4",name:"Citron",qty:2,unit:"pièces",tip:"Tranches fines."},
{id:"i5",name:"Aneth ou persil frais",qty:0.5,unit:"bouquet",tip:"L'aneth est l'herbe classique du saumon."},
{id:"i6",name:"Ail",qty:2,unit:"gousses",tip:"Hachez finement."},
{id:"i7",name:"Huile d'olive",qty:2,unit:"c.à.s",tip:"Un filet par papillote."},
{id:"i8",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer les papillotes",duration:10,ingredientIds:["i1","i2","i3","i4","i5","i6","i7","i8"],
text:"Préchauffez le four à 200°C. Découpez 4 grands carrés de papier aluminium. Sur chaque carré : rondelles de courgette, tomates cerises, tranches de citron. Posez le pavé de saumon dessus. Ajoutez ail, aneth, sel, poivre. Arrosez d'huile. Refermez hermétiquement.",
tip:"✨ Une papillote bien fermée crée un 'four dans le four'. La vapeur circule et cuit le poisson en douceur."},
{id:"s2",title:"Cuire et ouvrir",duration:20,ingredientIds:["i1"],
text:"Posez les papillotes sur une plaque. Enfournez 15-18 min. ATTENTION en ouvrant : la vapeur brûlante sort d'un coup ! Ouvrez en vous penchant de côté. Servez dans la papillote ou en assiette.",
tip:"✨ Pour vérifier sans ouvrir : pressez légèrement la papillote. Si la chair cède sans résistance, c'est cuit."}
]},

{id:29,name:"Gratin de poisson à la béchamel",emoji:"🧅",category:"plat",meat:"poisson",needsOven:true,prepTime:20,cookTime:35,baseServings:4,kcalPerServing:420,macros:{proteines:36,lipides:18,glucides:28,fibres:2},
description:"Un gratin crémeux et réconfortant qui transforme du poisson simple en plat festif.",
tips:"Vous pouvez utiliser n'importe quel poisson à chair blanche : cabillaud, lieu, merlan, etc.",
ingredients:[
{id:"i1",name:"Filets de poisson blanc",qty:600,unit:"g",tip:"Séchez-les bien. Vérifiez les arêtes."},
{id:"i2",name:"Crevettes cuites",qty:200,unit:"g",tip:"Optionnel mais donne du luxe au gratin."},
{id:"i3",name:"Lait",qty:500,unit:"ml",tip:"Pour la béchamel."},
{id:"i4",name:"Beurre",qty:50,unit:"g",tip:""},
{id:"i5",name:"Farine",qty:50,unit:"g",tip:""},
{id:"i6",name:"Gruyère râpé",qty:100,unit:"g",tip:""},
{id:"i7",name:"Échalotes",qty:2,unit:"pièces",tip:"Émincez finement."},
{id:"i8",name:"Persil frais",qty:0.5,unit:"bouquet",tip:"Hachez."},
{id:"i9",name:"Noix de muscade",qty:1,unit:"pincée",tip:""},
{id:"i10",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Pocher le poisson",duration:10,ingredientIds:["i1","i7"],
text:"Préchauffez le four à 200°C. Chauffez le lait avec les échalotes. Plongez les filets de poisson dans le lait frémissant, couvrez et laissez pocher 5 min. Retirez délicatement les filets (gardez le lait pour la béchamel). Émiettez grossièrement.",
tip:"✨ Pocher le poisson dans le lait = il reste tendre et le lait s'imprègne du goût du poisson pour la béchamel."},
{id:"s2",title:"Faire la béchamel",duration:8,ingredientIds:["i4","i5","i3","i9","i10"],
text:"Faites fondre le beurre à feu moyen. Ajoutez la farine, mélangez 1 min (roux). Versez le lait de cuisson chaud progressivement en fouettant sans cesse. Portez à ébullition en fouettant — la sauce épaissit. Salez, poivrez, muscade. Ajoutez le persil.",
tip:"✨ Verser le lait chaud (et non froid) évite les grumeaux. Fouetter sans interruption est la clé."},
{id:"s3",title:"Monter le gratin",duration:30,ingredientIds:["i1","i2","i6","i3"],
text:"Beurrez un plat à gratin. Disposez le poisson émietté et les crevettes. Versez la béchamel. Parsemez de gruyère. Enfournez à 200°C pendant 20-25 min jusqu'à dorure.",
tip:"✨ Pour une belle croûte dorée, passez sous le grill les 3 dernières minutes."}
]},

{id:30,name:"Daurade entière rôtie",emoji:"🐡",category:"plat",meat:"poisson",needsOven:true,prepTime:10,cookTime:25,baseServings:4,kcalPerServing:320,macros:{proteines:40,lipides:12,glucides:4,fibres:2},
description:"Rôtir un poisson entier au four est la méthode la plus simple et spectaculaire pour les débutants.",
tips:"Un poisson entier cuit mieux qu'en filets : les os parfument la chair et la protègent de la dessication.",
ingredients:[
{id:"i1",name:"Daurade royale",qty:2,unit:"pièces 600g",tip:"Demandez au poissonnier de les vider et écailler. Faites 3 incisions sur chaque flanc."},
{id:"i2",name:"Citron",qty:2,unit:"pièces",tip:"En tranches pour farcir la cavité."},
{id:"i3",name:"Fenouil",qty:1,unit:"bulbe",tip:"Émincez finement. Se marie parfaitement avec la daurade."},
{id:"i4",name:"Tomates cerises",qty:200,unit:"g",tip:""},
{id:"i5",name:"Ail",qty:4,unit:"gousses",tip:"En chemise."},
{id:"i6",name:"Thym et romarin",qty:0,unit:"quelques branches",tip:"Dans la cavité et autour."},
{id:"i7",name:"Huile d'olive",qty:3,unit:"c.à.s",tip:""},
{id:"i8",name:"Vin blanc sec",qty:100,unit:"ml",tip:"Versé dans le fond du plat."},
{id:"i9",name:"Fleur de sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer les daurades",duration:10,ingredientIds:["i1","i2","i6","i9","i7"],
text:"Préchauffez le four à 200°C. Rincez et séchez les poissons. Farcissez les cavités avec des tranches de citron, du thym et du romarin. Badigeonnez généreusement d'huile d'olive des deux côtés. Salez à la fleur de sel, poivrez.",
tip:"✨ Les 3 incisions sur les flancs permettent aux épices de pénétrer et à la chaleur d'atteindre le cœur plus rapidement."},
{id:"s2",title:"Préparer le lit de légumes",duration:5,ingredientIds:["i3","i4","i5","i7","i9"],
text:"Dans le plat à four, disposez le fenouil émincé, les tomates cerises et l'ail en chemise. Arrosez d'huile, salez et poivrez. Versez le vin blanc dans le fond.",
tip:"✨ Les légumes servent de 'lit' pour le poisson. Ils se gorgent du jus de cuisson."},
{id:"s3",title:"Rôtir au four",duration:25,ingredientIds:["i1"],
text:"Posez les daurades sur les légumes. Enfournez à 200°C pour 20-25 min. Le poisson est cuit quand l'œil est blanc et que la chair se détache de l'arête avec une fourchette.",
tip:"✨ Pour lever un filet : glissez une spatule le long de l'arête centrale, soulevez — toute la chair vient d'un côté. Retournez et répétez."}
]}

,{id:31,name:"Ratatouille de légumes du soleil",emoji:"🍆",category:"veggie",meat:"none",needsOven:false,prepTime:20,cookTime:40,baseServings:4,kcalPerServing:220,macros:{proteines:5,lipides:10,glucides:22,fibres:8},
description:"La ratatouille est un plat provençal mythique qui transforme les légumes d'été en une symphonie de saveurs.",
tips:"Le secret : cuire chaque légume séparément pour qu'il garde sa texture, puis les réunir à la fin.",
ingredients:[
{id:"i1",name:"Aubergine",qty:2,unit:"pièces",tip:"Cubes de 2cm. Salez, attendez 15 min, rincez et séchez."},
{id:"i2",name:"Courgette",qty:3,unit:"pièces",tip:"Rondelles épaisses de 1,5cm."},
{id:"i3",name:"Poivron rouge",qty:2,unit:"pièces",tip:"Épépinez et coupez en morceaux."},
{id:"i4",name:"Poivron jaune",qty:1,unit:"pièce",tip:"Épépinez et coupez en morceaux."},
{id:"i5",name:"Tomates",qty:4,unit:"pièces",tip:"Bien mûres. Ébouillantez 30 sec pour peler, puis coupez en morceaux."},
{id:"i6",name:"Oignon",qty:2,unit:"pièces",tip:"Hachez grossièrement."},
{id:"i7",name:"Ail",qty:4,unit:"gousses",tip:"Hachez finement."},
{id:"i8",name:"Herbes de Provence",qty:2,unit:"c.à.c",tip:"Thym, romarin, basilic..."},
{id:"i9",name:"Huile d'olive",qty:5,unit:"c.à.s",tip:"Indispensable dans ce plat."},
{id:"i10",name:"Sel, poivre",qty:0,unit:"",tip:""},
{id:"i11",name:"Basilic frais",qty:0.5,unit:"bouquet",tip:"Ajoutez en fin de cuisson — ne supporte pas la chaleur."}
],
steps:[
{id:"s1",title:"Préparer les légumes",duration:20,ingredientIds:["i1","i2","i3","i4","i5"],
text:"Salez les aubergines coupées, posez sur un torchon 15 min pour dégorger. Rincez et séchez. Préparez tous les autres légumes.",
tip:"✨ 'Dégorger' les aubergines avec le sel élimine l'eau amère. Sans cette étape, elles absorbent trop d'huile et restent amères."},
{id:"s2",title:"Cuire les légumes séparément",duration:25,ingredientIds:["i1","i2","i3","i4","i9","i10"],
text:"Chauffez l'huile à feu moyen-vif. Cuisez chaque légume séparément 5-7 min jusqu'à légèrement doré : d'abord les aubergines, puis les courgettes, puis les poivrons. Réservez chaque légume.",
tip:"✨ Cuire séparément = chaque légume garde sa texture. Si on met tout ensemble, les plus tendres (courgette) deviennent de la bouillie."},
{id:"s3",title:"Réunir et mijoter",duration:20,ingredientIds:["i6","i7","i5","i8","i11","i10"],
text:"Dans la même poêle, faites revenir les oignons 3 min. Ajoutez l'ail 1 min. Ajoutez les tomates et les herbes. Laissez compoter 5 min. Réunissez tous les légumes. Mélangez doucement et laissez mijoter 10 min. Parsemez de basilic frais.",
tip:"✨ La ratatouille est meilleure réchauffée le lendemain. Les saveurs ont eu le temps de se mélanger."}
]},

{id:32,name:"Soupe de légumes maison",emoji:"🥣",category:"veggie",meat:"none",needsOven:false,prepTime:15,cookTime:30,baseServings:4,kcalPerServing:160,macros:{proteines:5,lipides:4,glucides:24,fibres:7},
description:"La soupe maison est l'une des choses les plus réconfortantes qui soit. Simple, économique et infiniment modulable.",
tips:"Plus les légumes sont variés, meilleure est la soupe. Voici une base que vous pouvez adapter avec ce que vous avez.",
ingredients:[
{id:"i1",name:"Pommes de terre",qty:3,unit:"pièces",tip:"Épluchez et coupez en cubes. Elles épaissiront la soupe naturellement."},
{id:"i2",name:"Carottes",qty:3,unit:"pièces",tip:"Épluchez et coupez en rondelles."},
{id:"i3",name:"Poireaux",qty:2,unit:"pièces",tip:"Coupez les parties vertes foncées, lavez soigneusement (il y a souvent de la terre entre les couches), coupez en rondelles."},
{id:"i4",name:"Courgette",qty:1,unit:"pièce",tip:"En cubes."},
{id:"i5",name:"Oignon",qty:1,unit:"pièce",tip:"Hachez."},
{id:"i6",name:"Ail",qty:2,unit:"gousses",tip:"Hachez finement."},
{id:"i7",name:"Bouillon de légumes",qty:1200,unit:"ml",tip:"3 cubes dans 1,2L d'eau chaude."},
{id:"i8",name:"Huile d'olive",qty:2,unit:"c.à.s",tip:""},
{id:"i9",name:"Cerfeuil ou persil",qty:0.5,unit:"bouquet",tip:"Pour garnir."},
{id:"i10",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Faire revenir les aromates",duration:5,ingredientIds:["i5","i6","i3","i8"],
text:"Chauffez l'huile dans une grande casserole. Faites revenir l'oignon et l'ail 3 min. Ajoutez les poireaux et cuisez encore 3 min.",
tip:"✨ Faire revenir les aromates avant d'ajouter l'eau concentre leurs saveurs et parfume mieux la soupe."},
{id:"s2",title:"Ajouter et cuire",duration:25,ingredientIds:["i1","i2","i4","i7","i10"],
text:"Ajoutez carottes, pommes de terre et courgette. Versez le bouillon. Portez à ébullition, baissez le feu et laissez mijoter 20-25 min jusqu'à ce que tous les légumes soient tendres.",
tip:"✨ Goûtez en cours de cuisson pour ajuster le sel. Les bouillons du commerce sont souvent déjà salés."},
{id:"s3",title:"Mixer et servir",duration:3,ingredientIds:["i9","i10"],
text:"Pour une soupe veloutée : mixez avec un mixeur plongeant directement dans la casserole. Pour une soupe avec morceaux : servez tel quel. Parsemez d'herbes fraîches. Servez avec du pain grillé.",
tip:"✨ ATTENTION au mixeur plongeant dans les liquides chauds : ne remplissez pas au max, tenez le couvercle pour éviter les projections. Ou attendez que la soupe refroidisse un peu."}
]},

{id:33,name:"Omelette aux légumes et fromage",emoji:"🍳",category:"veggie",meat:"none",needsOven:false,prepTime:10,cookTime:10,baseServings:2,kcalPerServing:380,macros:{proteines:24,lipides:26,glucides:8,fibres:2},
description:"L'omelette est le plat le plus simple et rapide du répertoire. Maîtrisez-la et vous aurez toujours une solution en 10 minutes.",
tips:"Une bonne omelette est baveuse à l'intérieur et ne brunit jamais à l'extérieur — feu moyen et attention !",
ingredients:[
{id:"i1",name:"Œufs",qty:6,unit:"pièces",tip:"Cassez chaque œuf dans un bol avant d'ajouter au mélange."},
{id:"i2",name:"Champignons de Paris",qty:150,unit:"g",tip:"Tranchez finement."},
{id:"i3",name:"Poivron",qty:0.5,unit:"pièce",tip:"Coupez en tout petits dés."},
{id:"i4",name:"Échalote",qty:1,unit:"pièce",tip:"Émincez finement."},
{id:"i5",name:"Fromage râpé (gruyère, comté...)",qty:60,unit:"g",tip:""},
{id:"i6",name:"Beurre",qty:20,unit:"g",tip:"Ne pas utiliser d'huile — le beurre donne plus de goût."},
{id:"i7",name:"Sel, poivre",qty:0,unit:"",tip:""},
{id:"i8",name:"Ciboulette ou persil",qty:0,unit:"quelques brins",tip:"Hachez finement."}
],
steps:[
{id:"s1",title:"Faire revenir les légumes",duration:5,ingredientIds:["i2","i3","i4","i6","i7"],
text:"Faites fondre la moitié du beurre à feu moyen-vif. Faites revenir l'échalote 1 min. Ajoutez les champignons et le poivron, faites sauter 4-5 min jusqu'à dorure. Salez, poivrez. Réservez.",
tip:"✨ La garniture doit être cuite à l'avance car l'omelette cuit très vite."},
{id:"s2",title:"Cuire l'omelette",duration:5,ingredientIds:["i1","i6","i5","i7"],
text:"Battez les œufs avec une fourchette. Salez, poivrez. Faites fondre le reste de beurre à feu moyen dans une poêle antiadhésive. Versez les œufs. Avec une spatule, ramenez les bords vers le centre en inclinant la poêle. Quand le dessus est encore légèrement coulant, ajoutez la garniture et le fromage d'un côté.",
tip:"✨ L'omelette parfaite est jaune pâle dehors et légèrement coulante dedans."},
{id:"s3",title:"Plier et servir",duration:1,ingredientIds:["i8"],
text:"Pliez l'omelette en deux ou en trois. Faites-la glisser dans une assiette. Parsemez d'herbes fraîches. Servez IMMÉDIATEMENT.",
tip:"✨ Une omelette n'attend pas — elle continue à cuire avec sa chaleur résiduelle."}
]},

{id:34,name:"Riz sauté aux légumes façon thaï",emoji:"🌿",category:"veggie",meat:"none",needsOven:false,prepTime:15,cookTime:15,baseServings:4,kcalPerServing:380,macros:{proteines:10,lipides:10,glucides:62,fibres:5},

{id:"i2",name:"Œufs",qty:3,unit:"pièces",tip:"Battez en omelette."},

{id:"i4",name:"Petits pois surgelés",qty:150,unit:"g",tip:"Pas besoin de décongeler."},

{id:"i8",name:"Huile de sésame",qty:1,unit:"c.à.s",tip:"En fin de cuisson."},
{id:"i9",name:"Huile neutre",qty:2,unit:"c.à.s",tip:"Pour cuire."},

],
steps:[
{id:"s1",title:"Faire les œufs brouillés",duration:3,ingredientIds:["i2","i9"],
text:"Chauffez 1 c.à.s d'huile dans un wok à feu vif. Versez les œufs battus et remuez constamment en les cassant en petits morceaux (2 min). Réservez.",
tip:"✨ Les œufs brouillés rapides restent moelleux. Trop cuits = secs et caoutchouteux."},
{id:"s2",title:"Sauter les légumes",duration:7,ingredientIds:["i5","i6","i3","i4","i9"],
text:"Dans le même wok, chauffez l'huile restante à feu très vif. Faites sauter l'oignon 1 min. Ajoutez les carottes 2 min, puis les petits pois 1 min. Tout doit rester croquant.",
tip:"✨ Feu TRÈS VIF pour les légumes — c'est le principe du wok. Les légumes doivent sauter, pas mijoter."},
{id:"s3",title:"Ajouter le riz et assaisonner",duration:5,ingredientIds:["i1","i7","i8","i2","i10"],
text:"Ajoutez le riz froid, égrénez bien avec une spatule. Cuisez 2-3 min en remuant constamment. Versez la sauce soja, mélangez. Remettez les œufs. Hors du feu, ajoutez l'huile de sésame. Garnissez d'oignons verts.",
tip:"✨ Le riz doit légèrement colorer — cette légère caramélisation donne le goût du riz sauté de restaurant."}
]},

{id:35,name:"Poêlée de légumes et œufs au plat",emoji:"🥦",category:"veggie",meat:"none",needsOven:false,prepTime:10,cookTime:15,baseServings:2,kcalPerServing:340,macros:{proteines:18,lipides:20,glucides:22,fibres:7},
description:"Un repas complet et nourrissant en moins de 25 minutes. Les légumes rôtis à la poêle transformés par les œufs.",
tips:"La poêle doit être bien chaude pour que les légumes caramélisent et ne rendent pas d'eau.",
ingredients:[
{id:"i1",name:"Pommes de terre",qty:2,unit:"pièces",tip:"Cubes de 1,5cm. Passez 3 min au micro-ondes d'abord pour accélérer la cuisson."},
{id:"i2",name:"Poivron",qty:1,unit:"pièce",tip:"Coupez en dés."},
{id:"i3",name:"Courgette",qty:1,unit:"pièce",tip:"Rondelles épaisses."},
{id:"i4",name:"Oignon",qty:1,unit:"pièce",tip:"Émincez."},
{id:"i5",name:"Ail",qty:2,unit:"gousses",tip:"Hachez."},
{id:"i6",name:"Œufs",qty:4,unit:"pièces",tip:""},
{id:"i7",name:"Paprika fumé",qty:0.5,unit:"c.à.c",tip:"Donne couleur et goût fumé."},
{id:"i8",name:"Huile d'olive",qty:2,unit:"c.à.s",tip:""},
{id:"i9",name:"Sel, poivre",qty:0,unit:"",tip:""},
{id:"i10",name:"Herbes fraîches",qty:0,unit:"",tip:"Persil ou ciboulette haché."}
],
steps:[
{id:"s1",title:"Cuire les pommes de terre",duration:10,ingredientIds:["i1","i8","i7","i9"],
text:"Chauffez l'huile dans une grande poêle à feu moyen-vif. Ajoutez les cubes de pommes de terre (ou passez-les 3 min micro-ondes d'abord). Cuisez 8-10 min en remuant régulièrement jusqu'à bien dorés. Saupoudrez de paprika.",
tip:"✨ Le micro-ondes 3 min avant les pré-cuit et réduit le temps à la poêle."},
{id:"s2",title:"Ajouter les légumes",duration:7,ingredientIds:["i4","i5","i2","i3","i9"],
text:"Ajoutez l'oignon, cuisez 2 min. Ajoutez l'ail, le poivron et la courgette. Cuisez encore 5 min en remuant. Les légumes doivent être tendres et légèrement dorés.",
tip:"✨ Ne salez pas trop tôt — le sel fait sortir l'eau et les légumes mouillent la poêle au lieu de dorer."},
{id:"s3",title:"Cuire les œufs",duration:3,ingredientIds:["i6","i10"],
text:"Faites des petits creux dans les légumes. Cassez un œuf dans chaque creux. Salez, poivrez. Couvrez et laissez cuire 2-3 min jusqu'à ce que le blanc soit pris et le jaune encore coulant. Parsemez d'herbes.",
tip:"✨ Le couvercle crée de la vapeur qui cuit le dessus du blanc sans avoir à retourner l'œuf."}
]}
// DESSERTS (10)
,{id:36,name:"Pain Perdu",emoji:"🍞",category:"dessert",meat:"none",needsOven:false,prepTime:10,cookTime:10,baseServings:4,kcalPerServing:340,macros:{proteines:12,lipides:14,glucides:42,fibres:2},
description:"La recette anti-gaspi parfaite pour finir le vieux pain. Croustillant dehors, fondant dedans.",
tips:"Un pain rassis d'1-2 jours est idéal : il absorbe mieux sans se désintégrer.",
ingredients:[
{id:"i1",name:"Pain rassis",qty:8,unit:"tranches épaisses",tip:"Baguette ou pain de mie, tranches de 2cm."},
{id:"i2",name:"Œufs",qty:3,unit:"pièces",tip:"Cassez d'abord dans un petit bol."},
{id:"i3",name:"Lait",qty:200,unit:"ml",tip:"Entier de préférence."},
{id:"i4",name:"Sucre",qty:3,unit:"c.à.s",tip:"Vanillé si possible."},
{id:"i5",name:"Extrait de vanille",qty:1,unit:"c.à.c",tip:"Optionnel."},
{id:"i6",name:"Cannelle",qty:0.5,unit:"c.à.c",tip:"Optionnel."},
{id:"i7",name:"Beurre",qty:40,unit:"g",tip:"Pour la belle couleur dorée."},
{id:"i8",name:"Sucre glace ou confiture",qty:0,unit:"pour servir",tip:""}
],
steps:[
{id:"s1",title:"Préparer l'appareil",duration:5,ingredientIds:["i2","i3","i4","i5","i6"],
text:"Dans un plat creux, battez les œufs. Ajoutez lait, sucre, vanille et cannelle. Fouettez jusqu'à obtenir un mélange homogène.",
tip:"✨ Un plat assez grand pour tremper une tranche à plat est idéal."},
{id:"s2",title:"Tremper le pain",duration:5,ingredientIds:["i1"],
text:"Plongez les tranches dans l'appareil. Attendez 1-2 min par côté. Le pain doit être bien imbibé mais tenir.",
tip:"✨ Trop trempé = se désintègre. Pas assez = cœur sec. Trouvez le juste milieu !"},
{id:"s3",title:"Cuire au beurre",duration:8,ingredientIds:["i7","i1"],
text:"Faites fondre le beurre à feu moyen. Quand il sent la noisette, déposez les tranches. Cuisez 2-3 min par côté jusqu'à belle couleur dorée.",
tip:"✨ Le beurre noisette donne une saveur extraordinaire. Entre noisette et brûlé, il n'y a que quelques secondes !"},
{id:"s4",title:"Service",duration:2,ingredientIds:["i8"],
text:"Saupoudrez de sucre glace. Accompagnez de confiture, fruits frais ou glace vanille.",
tip:"✨ Mangez immédiatement — le pain perdu perd de sa magie en refroidissant !"}
]},

{id:37,name:"Crêpes traditionnelles",emoji:"🥞",category:"dessert",meat:"none",needsOven:false,prepTime:10,cookTime:20,baseServings:4,kcalPerServing:280,macros:{proteines:9,lipides:10,glucides:38,fibres:1},
description:"La recette bretonne traditionnelle. Fines, dorées, délicieuses. La première est toujours ratée — c'est la règle.",
tips:"La pâte DOIT reposer 30 min minimum au réfrigérateur — c'est le secret des crêpes légères sans grumeaux.",
ingredients:[
{id:"i1",name:"Farine",qty:250,unit:"g",tip:"T45 ou T55. Tamisez-la pour éviter les grumeaux."},
{id:"i2",name:"Œufs",qty:3,unit:"pièces",tip:"À température ambiante."},
{id:"i3",name:"Lait",qty:500,unit:"ml",tip:"Versez progressivement."},
{id:"i4",name:"Beurre fondu",qty:50,unit:"g",tip:"Refroidissez avant d'incorporer."},
{id:"i5",name:"Sucre",qty:1,unit:"c.à.s",tip:"Omettez pour des galettes salées."},
{id:"i6",name:"Sel",qty:1,unit:"pincée",tip:"Même pour les crêpes sucrées."},
{id:"i7",name:"Extrait de vanille",qty:1,unit:"c.à.c",tip:"Optionnel."},
{id:"i8",name:"Rhum ou fleur d'oranger",qty:1,unit:"c.à.s",tip:"Optionnel."},
{id:"i9",name:"Huile pour la poêle",qty:1,unit:"c.à.s",tip:""}
],
steps:[
{id:"s1",title:"Préparer la pâte",duration:10,ingredientIds:["i1","i2","i3","i4","i5","i6","i7","i8"],
text:"Faites un puits dans la farine. Cassez les œufs dedans. Fouettez en incorporant la farine depuis les bords. Ajoutez le lait progressivement, puis le beurre fondu froid, la vanille et le rhum.",
tip:"✨ Méthode du puits = anti-grumeaux. Si grumeaux quand même : mixez 30 secondes. Résultat garanti !"},
{id:"s2",title:"Repos obligatoire",duration:30,ingredientIds:[],
text:"Couvrez et laissez reposer au réfrigérateur 30 minutes minimum (1h idéalement). Le gluten se détend.",
tip:"✨ Ce repos n'est pas optionnel ! Crêpe sans repos = plus épaisse et caoutchouteuse."},
{id:"s3",title:"Cuire les crêpes",duration:20,ingredientIds:["i9"],
text:"Chauffez une poêle huilée à feu moyen-vif. Versez une louche, inclinez en rond pour étaler finement. 1 min, retournez, 30 sec. Empilez.",
tip:"✨ La première crêpe est TOUJOURS ratée. Mangez-la secrètement — c'est le privilège du cuisinier !"}
]},

{id:38,name:"Mousse au chocolat",emoji:"🍫",category:"dessert",meat:"none",needsOven:false,prepTime:20,cookTime:0,baseServings:6,kcalPerServing:320,macros:{proteines:8,lipides:18,glucides:30,fibres:2},
description:"Une mousse légère et aérienne — la texture parfaite. Seulement 3 ingrédients pour un résultat spectaculaire.",
tips:"Les blancs en neige sont le secret de la légèreté. Incorporez-les très délicatement pour ne pas les casser.",
ingredients:[
{id:"i1",name:"Chocolat noir 70%",qty:200,unit:"g",tip:"Cassez en petits morceaux pour faciliter la fonte."},
{id:"i2",name:"Œufs",qty:6,unit:"pièces",tip:"Séparez les blancs des jaunes. Blancs à température ambiante."},
{id:"i3",name:"Sucre",qty:2,unit:"c.à.s",tip:"Optionnel — le chocolat 70% est déjà sucré."},
{id:"i4",name:"Sel",qty:1,unit:"pincée",tip:"Dans les blancs — aide à monter."}
],
steps:[
{id:"s1",title:"Faire fondre le chocolat",duration:5,ingredientIds:["i1"],
text:"Cassez le chocolat en morceaux dans un bol. Faites fondre au bain-marie (bol posé sur casserole d'eau frémissante, sans contact avec l'eau) en remuant. Ou au micro-ondes 30 sec par 30 sec en remuant entre chaque. Laissez refroidir 5 min.",
tip:"✨ Le chocolat brûle facilement au micro-ondes. Procédez toujours par courtes impulsions de 30 sec."},
{id:"s2",title:"Incorporer les jaunes",duration:3,ingredientIds:["i2","i3"],
text:"Séparez les blancs des jaunes. Ajoutez les jaunes UN PAR UN au chocolat fondu (pas encore chaud) en mélangeant bien entre chaque. Ajoutez le sucre si désiré.",
tip:"✨ Ajouter les jaunes un par un = ils s'incorporent mieux. Tous d'un coup dans le chocolat chaud = ils cuisent partiellement."},
{id:"s3",title:"Monter les blancs en neige",duration:5,ingredientIds:["i2","i4"],
text:"Dans un bol propre et sec, montez les blancs avec une pincée de sel au batteur électrique. Commencez doucement, puis augmentez la vitesse. Les blancs sont prêts quand ils forment des pics fermes qui tiennent sans retomber.",
tip:"✨ Les bols et fouets doivent être ABSOLUMENT propres et secs. La moindre trace de gras empêche les blancs de monter."},
{id:"s4",title:"Incorporer et réfrigérer",duration:10,ingredientIds:["i2"],
text:"Incorporez 1/3 des blancs en neige au chocolat vigoureusement. Ajoutez le reste des blancs en 2 fois, en pliant DÉLICATEMENT avec une maryse du bas vers le haut. Versez dans des ramequins. Réfrigérez 3h minimum.",
tip:"✨ 'Plier' = mouvement circulaire du bas vers le haut, sans écraser. C'est ce qui préserve les bulles d'air des blancs."}
]},

{id:39,name:"Tarte aux pommes facile",emoji:"🍎",category:"dessert",meat:"none",needsOven:true,prepTime:15,cookTime:35,baseServings:6,kcalPerServing:290,macros:{proteines:4,lipides:12,glucides:42,fibres:3},
description:"La tarte aux pommes est le dessert français par excellence. Avec une pâte feuilletée du commerce, elle est simple comme bonjour.",
tips:"Disposez les pommes en rosace pour un résultat visuellement impressionnant — c'est plus facile qu'il n'y paraît.",
ingredients:[
{id:"i1",name:"Pâte feuilletée du commerce",qty:1,unit:"rouleau",tip:"Sortez-la 15 min avant pour qu'elle soit malléable."},
{id:"i2",name:"Pommes",qty:4,unit:"pièces",tip:"Golden ou Granny Smith. Épluchez, évidez, tranchez finement en lamelles."},
{id:"i3",name:"Sucre",qty:3,unit:"c.à.s",tip:"Pour saupoudrer sur les pommes."},
{id:"i4",name:"Beurre",qty:30,unit:"g",tip:"En petits morceaux sur les pommes — fond et caramélise."},
{id:"i5",name:"Confiture d'abricot",qty:2,unit:"c.à.s",tip:"Pour faire briller la tarte à la sortie du four."},
{id:"i6",name:"Cannelle",qty:0.5,unit:"c.à.c",tip:"Optionnel."},
{id:"i7",name:"Sucre glace",qty:1,unit:"c.à.s",tip:"Optionnel, pour finir."}
],
steps:[
{id:"s1",title:"Préparer et préchauffer",duration:15,ingredientIds:["i1","i2"],
text:"Préchauffez le four à 200°C. Déroulez la pâte dans un moule à tarte. Piquez le fond à la fourchette partout. Épluchez les pommes, coupez-les en 4, retirez le cœur, tranchez finement en lamelles de 3mm.",
tip:"✨ Piquer la pâte à la fourchette avant de garnir = la pâte ne gonfle pas sous les pommes."},
{id:"s2",title:"Disposer les pommes",duration:5,ingredientIds:["i2","i3","i4","i6"],
text:"Disposez les tranches de pommes en rosace en partant du bord vers le centre. Chevauchement régulier. Saupoudrez de sucre et cannelle. Répartissez des petits morceaux de beurre sur les pommes.",
tip:"✨ Commencez par l'extérieur et spirallez vers le centre. C'est si joli et plus facile qu'il n'y paraît !"},
{id:"s3",title:"Cuire et lustrer",duration:35,ingredientIds:["i5","i7"],
text:"Enfournez à 200°C pendant 30-35 min. La pâte doit être bien dorée, les pommes légèrement caramélisées. Pendant les 2 dernières minutes, badigeonnez de confiture d'abricot chauffée pour faire briller.",
tip:"✨ La confiture d'abricot lustrée donne le beau brillant des tartes de pâtisserie. Réchauffez-la 30 sec au micro-ondes."}
]},

{id:40,name:"Fondant au chocolat",emoji:"💎",category:"dessert",meat:"none",needsOven:true,prepTime:15,cookTime:12,baseServings:6,kcalPerServing:380,macros:{proteines:7,lipides:22,glucides:38,fibres:2},
description:"LE dessert qui impressionne toujours. Un cœur coulant au chocolat en 12 minutes. Parfait pour les invités.",
tips:"La cuisson est ultra-précise : 10-12 min selon votre four. Faites un test avec un ramequin avant le jour J.",
ingredients:[
{id:"i1",name:"Chocolat noir 60% minimum",qty:200,unit:"g",tip:"Minimum 60% de cacao pour que ce soit intense."},
{id:"i2",name:"Beurre",qty:100,unit:"g",tip:"+ un peu pour beurrer les ramequins."},
{id:"i3",name:"Œufs",qty:4,unit:"pièces",tip:"Entiers."},
{id:"i4",name:"Sucre",qty:100,unit:"g",tip:""},
{id:"i5",name:"Farine",qty:40,unit:"g",tip:"Seulement 40g — structure légèrement sans cuire le cœur."},
{id:"i6",name:"Cacao en poudre",qty:1,unit:"c.à.s",tip:"Pour fariner les ramequins."}
],
steps:[
{id:"s1",title:"Préparer",duration:10,ingredientIds:["i1","i2","i6"],
text:"Préchauffez le four à 200°C. Beurrez et poudrez de cacao 6 ramequins (tapotez pour enlever l'excédent). Au bain-marie, faites fondre chocolat + beurre. Mélangez jusqu'à lisse. Laissez refroidir 5 min.",
tip:"✨ Beurrer + poudrer les ramequins = les fondants se démoulent parfaitement. Sans cette étape, ils collent."},
{id:"s2",title:"Préparer l'appareil",duration:5,ingredientIds:["i3","i4","i5","i1"],
text:"Battez œufs + sucre jusqu'à ce que le mélange blanchisse et double de volume (2-3 min au fouet). Versez le chocolat fondu sur ce mélange, incorporez. Ajoutez la farine tamisée et mélangez.",
tip:"✨ Blanchir les œufs avec le sucre incorpore de l'air = texture légère. Sans cette étape, le fondant sera dense."},
{id:"s3",title:"Cuire exactement",duration:12,ingredientIds:["i1"],
text:"Remplissez les ramequins aux 3/4. Vous pouvez les réfrigérer jusqu'à 24h à ce stade. Enfournez 10-12 min. Le dessus doit être mat (pas brillant) mais le centre encore tremblant. Démoulez sur assiette après 1 min de repos.",
tip:"✨ 10 min = cœur très coulant. 12 min = cœur légèrement coulant. 14 min = plus de cœur coulant. Chaque four est différent — faites un test !"}
]},

{id:41,name:"Tiramisu classique",emoji:"☕",category:"dessert",meat:"none",needsOven:false,prepTime:25,cookTime:0,baseServings:8,kcalPerServing:380,macros:{proteines:8,lipides:20,glucides:40,fibres:1},
description:"Le dessert italien préféré de tous. Crémeux, parfumé au café, irrésistible. Il se prépare la veille — pratique !",
tips:"Le tiramisu est meilleur après une nuit au réfrigérateur : les biscuits ont absorbé le café et la texture est parfaite.",
ingredients:[
{id:"i1",name:"Mascarpone",qty:500,unit:"g",tip:"Fromage crémeux italien. Sortez-le 20 min avant."},
{id:"i2",name:"Œufs",qty:4,unit:"pièces",tip:"Séparez blancs et jaunes."},
{id:"i3",name:"Sucre",qty:80,unit:"g",tip:""},
{id:"i4",name:"Biscuits à la cuillère (boudoirs)",qty:300,unit:"g",tip:"Ou ladyfingers. S'imbibent parfaitement."},
{id:"i5",name:"Café fort froid",qty:300,unit:"ml",tip:"Espresso ou café fort. FROID — pour ne pas trop ramollir les biscuits."},
{id:"i6",name:"Amaretto ou rhum",qty:2,unit:"c.à.s",tip:"Optionnel mais très bon."},
{id:"i7",name:"Cacao en poudre non sucré",qty:3,unit:"c.à.s",tip:"Pour saupoudrer le dessus."}
],
steps:[
{id:"s1",title:"Préparer la crème",duration:15,ingredientIds:["i1","i2","i3"],
text:"Séparez jaunes et blancs. Battez jaunes + sucre jusqu'à ce que le mélange blanchisse. Incorporez le mascarpone, mélangez jusqu'à lisse. Montez les blancs en neige ferme. Incorporez délicatement les blancs au mascarpone.",
tip:"✨ Les blancs en neige incorporés = tiramisu léger et aérien. Sans blancs, la crème est trop dense."},
{id:"s2",title:"Tremper les biscuits",duration:5,ingredientIds:["i4","i5","i6"],
text:"Mélangez café froid + amaretto dans un bol plat. Trempez rapidement chaque biscuit dans le café (1-2 secondes chaque côté — juste le temps qu'il soit imbibé mais pas mou).",
tip:"✨ Trempage rapide = biscuit imbibé mais encore ferme. Trop long = biscuit détrempé, le tiramisu s'effondre."},
{id:"s3",title:"Monter et réfrigérer",duration:10,ingredientIds:["i4","i1","i7"],
text:"Dans un plat rectangulaire : couche de crème, couche de biscuits imbibés, couche de crème, couche de biscuits, couche de crème. Saupoudrez généreusement de cacao. Réfrigérez minimum 4h, idéalement une nuit.",
tip:"✨ Le tiramisu a besoin de temps. Au bout de 4h, les saveurs se sont mélangées et la texture est parfaite."}
]},

{id:42,name:"Crème brûlée",emoji:"🔥",category:"dessert",meat:"none",needsOven:true,prepTime:15,cookTime:45,baseServings:6,kcalPerServing:350,macros:{proteines:6,lipides:24,glucides:28,fibres:0},
description:"L'un des desserts les plus élégants de la cuisine française. Le craquement de la croûte caramélisée est inoubliable.",
tips:"Le secret est une cuisson douce au bain-marie — la crème ne doit jamais bouillir, sinon elle fait des bulles.",
ingredients:[
{id:"i1",name:"Crème liquide entière",qty:500,unit:"ml",tip:"Entière obligatoire — pas de crème légère."},
{id:"i2",name:"Jaunes d'œufs",qty:5,unit:"pièces",tip:"Gardez les blancs pour une autre recette."},
{id:"i3",name:"Sucre",qty:80,unit:"g",tip:"Pour l'appareil."},
{id:"i4",name:"Extrait de vanille",qty:1,unit:"c.à.c",tip:"Ou une gousse de vanille fendue."},
{id:"i5",name:"Sucre roux",qty:6,unit:"c.à.s",tip:"Pour caraméliser le dessus — 1 c.à.s par ramequin."}
],
steps:[
{id:"s1",title:"Préparer l'appareil",duration:10,ingredientIds:["i1","i2","i3","i4"],
text:"Préchauffez le four à 150°C. Chauffez la crème avec la vanille jusqu'à frémissement (pas bouillir). Dans un bol, battez jaunes + sucre jusqu'à blanchiment. Versez la crème chaude progressivement sur les jaunes en fouettant.",
tip:"✨ Verser la crème chaude progressivement = les jaunes ne cuisent pas (sinon vous auriez une omelette). Allez-y lentement !"},
{id:"s2",title:"Cuisson au bain-marie",duration:40,ingredientIds:["i1"],
text:"Filtrez l'appareil à travers une passoire. Versez dans des ramequins. Posez les ramequins dans un grand plat. Versez de l'eau chaude dans le plat jusqu'à mi-hauteur des ramequins. Enfournez à 150°C pendant 35-40 min.",
tip:"✨ Le bain-marie = chaleur douce et homogène. La crème cuit sans bouillir. C'est la méthode des grands chefs."},
{id:"s3",title:"Caraméliser et servir",duration:5,ingredientIds:["i5"],
text:"Laissez refroidir puis réfrigérez minimum 3h. Juste avant de servir, saupoudrez 1 c.à.s de sucre roux sur chaque crème. Caramélisez avec un chalumeau en mouvements circulaires jusqu'à croûte dorée et dure.",
tip:"✨ Pas de chalumeau ? Passez sous le grill du four à 250°C très rapproché pendant 2-3 min."}
]},

{id:43,name:"Clafoutis aux cerises",emoji:"🍒",category:"dessert",meat:"none",needsOven:true,prepTime:10,cookTime:40,baseServings:6,kcalPerServing:260,macros:{proteines:8,lipides:10,glucides:34,fibres:2},
description:"Un dessert rustique et moelleux entre le flan et le gâteau. Aussi bon tiède avec de la glace que froid le lendemain.",

// ═══════════════════════════════════════════════════════════════════════════
// STATE & TIMERS
// ═══════════════════════════════════════════════════════════════════════════
let state = { catFilter:'all', ovenFilter:'all', meatFilter:'all', currentRecipe:null, currentStep:0, servings:4 };

const timers = {
  1:{seconds:0,running:false,interval:null},
  2:{seconds:0,running:false,interval:null}
};

function formatTime(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  const p=n=>String(n).padStart(2,'0');
  return h>0?`${p(h)}:${p(m)}:${p(sec)}`:`${p(m)}:${p(sec)}`;
}
function timerToggle(id){
  const t=timers[id],w=document.getElementById('tw'+id),d=document.getElementById('td'+id),btn=w.querySelector('.btn-timer');
  if(t.running){clearInterval(t.interval);t.running=false;w.classList.remove('running');btn.textContent='▶';}
  else{t.interval=setInterval(()=>{t.seconds++;d.textContent=formatTime(t.seconds);},1000);t.running=true;w.classList.add('running');btn.textContent='⏸';}
}
function timerReset(id){
  const t=timers[id];clearInterval(t.interval);t.running=false;t.seconds=0;
  const w=document.getElementById('tw'+id);w.classList.remove('running');
  w.querySelector('.btn-timer').textContent='▶';document.getElementById('td'+id).textContent='00:00';
}

// ═══════════════════════════════════════════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════════════════════════════════════════
function setFilter(type,value,btn){
  if(type==='cat'){state.catFilter=value;document.querySelectorAll('#filter-cat .btn-filter').forEach(b=>b.classList.remove('active'));}
  else if(type==='oven'){state.ovenFilter=value;document.querySelectorAll('#filter-oven .btn-filter').forEach(b=>b.classList.remove('active'));}
  else{state.meatFilter=value;document.querySelectorAll('#filter-meat .btn-filter').forEach(b=>b.classList.remove('active'));}
  btn.classList.add('active');
  renderGrid();
}

function getFiltered(){
  return RECIPES.filter(r=>{
    if(state.catFilter==='plat' && r.category!=='plat') return false;
    if(state.catFilter==='dessert' && r.category!=='dessert') return false;
    if(state.catFilter==='veggie' && r.category!=='veggie') return false;
    if(state.ovenFilter==='noOven' && r.needsOven) return false;
    if(state.ovenFilter==='oven' && !r.needsOven) return false;
    if(state.meatFilter!=='all' && r.meat!==state.meatFilter) return false;
    return true;
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER HOME
// ═══════════════════════════════════════════════════════════════════════════
function renderGrid(){
  const filtered=getFiltered();
  document.getElementById('recipe-count').textContent=`${filtered.length} recette${filtered.length!==1?'s':''} disponible${filtered.length!==1?'s':''}`;
  document.getElementById('recipe-grid').innerHTML=filtered.map(r=>`
    <div class="recipe-card" onclick="openRecipe(${r.id})">
      <span class="card-emoji">${r.emoji}</span>
      <div class="card-meta">${r.category==='dessert'?'🍰 Dessert':r.category==='veggie'?'🥦 Sans viande':'🍽️ Plat'} · ${r.needsOven?'🔥 Avec four':'🚫 Sans four'}</div>
      <div class="card-name">${r.name}</div>
      <div class="card-desc">${r.description}</div>
      <div class="card-tags">
        <span class="tag">⏱ ${r.prepTime+r.cookTime} min</span>
        <span class="tag">🔥 ${r.kcalPerServing} kcal</span>
        <span class="tag">👥 ${r.baseServings} pers.</span>
      </div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════════════════
// OPEN / CLOSE RECIPE
// ═══════════════════════════════════════════════════════════════════════════
function openRecipe(id){
  const r=RECIPES.find(x=>x.id===id);
  state.currentRecipe=r;state.currentStep=0;state.servings=r.baseServings;
  renderRecipe();
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-recipe').classList.add('active');
  window.scrollTo(0,0);
}
function showHome(){
  document.getElementById('page-recipe').classList.remove('active');
  document.getElementById('page-home').classList.add('active');
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER RECIPE
// ═══════════════════════════════════════════════════════════════════════════
function renderRecipe(){
  const r=state.currentRecipe;
  const catLabel=r.category==='dessert'?'🍰 Dessert':r.category==='veggie'?'🥦 Plat sans viande':'🍽️ Plat principal';
  document.getElementById('r-badge').textContent=catLabel+' · '+(r.needsOven?'🔥 Nécessite un four':'🚫 Sans four');
  document.getElementById('r-title').textContent=r.emoji+' '+r.name;
  document.getElementById('r-tagline').textContent=r.tips;
  document.getElementById('r-prep').textContent='⏱ Prép : '+r.prepTime+' min';
  document.getElementById('r-cook').textContent='🔥 Cuisson : '+r.cookTime+' min';
  document.getElementById('r-total').textContent='Total : '+(r.prepTime+r.cookTime)+' min';
  renderNutrition();
  document.getElementById('step-nav').innerHTML=r.steps.map((s,i)=>`<button class="btn-step${i===state.currentStep?' active':''}" onclick="goToStep(${i})">${i+1}. ${s.title}</button>`).join('');
  renderStep();
  renderIngredients();
}

function renderNutrition(){
  const r=state.currentRecipe,ratio=state.servings/r.baseServings;
  document.getElementById('servings-num').textContent=state.servings;
  document.getElementById('kcal-val').textContent=Math.round(r.kcalPerServing*ratio);
  const colors={proteines:'#4ecdc4',glucides:'#ffe66d',lipides:'#ff6b6b',fibres:'#a8e6cf'};
  const maxes={proteines:60,glucides:80,lipides:50,fibres:20};
  const labels={proteines:'Protéines',glucides:'Glucides',lipides:'Lipides',fibres:'Fibres'};
  document.getElementById('macros-panel').innerHTML=Object.keys(r.macros).map(k=>{
    const val=Math.round(r.macros[k]*ratio),pct=Math.min((val/maxes[k])*100,100);
    return `<div class="macro-row"><div class="macro-header"><span class="macro-name">${labels[k]}</span><span class="macro-val">${val}g</span></div><div class="macro-track"><div class="macro-fill" style="width:${pct}%;background:${colors[k]}"></div></div></div>`;
  }).join('');
}

function renderStep(){
  const r=state.currentRecipe,step=r.steps[state.currentStep];
  document.getElementById('step-card').innerHTML=`
    <div class="step-card-header">
      <div><div class="step-label">Étape ${state.currentStep+1} / ${r.steps.length}</div><div class="step-title">${step.title}</div></div>
      ${step.duration>0?`<div class="step-duration"><span class="step-duration-num">${step.duration}</span><span class="step-duration-unit">min</span></div>`:''}
    </div>
    <p class="step-text">${step.text}</p>
    ${step.tip?`<div class="step-tip"><p>${step.tip}</p></div>`:''}`;
  document.getElementById('btn-prev').disabled=state.currentStep===0;
  document.getElementById('btn-next').disabled=state.currentStep===r.steps.length-1;
  document.querySelectorAll('.btn-step').forEach((b,i)=>b.classList.toggle('active',i===state.currentStep));
  renderIngredients();
}

function renderIngredients(){
  const r=state.currentRecipe,ratio=state.servings/r.baseServings;
  const activeIds=r.steps[state.currentStep].ingredientIds;
  document.getElementById('ing-list').innerHTML=r.ingredients.map(ing=>{
    const isActive=activeIds.includes(ing.id);
    const v=ing.qty>0?ing.qty*ratio:null;
    const scaledQty=v!==null?(Number.isInteger(v)?v:Math.round(v*10)/10):null;
    return `<div class="ing-item${isActive?' active':''}">
      <div class="ing-row">
        <span class="ing-name">${isActive?'<span class="ing-active-dot">●</span>':''}${ing.name}</span>
        ${scaledQty!==null?`<span class="ing-qty">${scaledQty}${ing.unit?' '+ing.unit:''}</span>`:''}
      </div>
      ${isActive&&ing.tip?`<div class="ing-tip">${ing.tip}</div>`:''}
    </div>`;
  }).join('');
}

function goToStep(i){state.currentStep=i;renderStep();}
function changeStep(dir){
  const r=state.currentRecipe,next=state.currentStep+dir;
  if(next>=0&&next<r.steps.length){state.currentStep=next;renderStep();document.querySelector('.steps-panel').scrollIntoView({behavior:'smooth',block:'start'});}
}
function changeServings(dir){
  const next=state.servings+dir;
  if(next<1)return;
  state.servings=next;renderNutrition();renderIngredients();
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
renderGrid();
</script></body></html>
