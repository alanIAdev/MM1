<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Cuisine — Recettes pour débutants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#e59834;--bg:#0d0d1a;--bg2:#1a1a2e;--bg3:#0f2744;--text:#f0e6d3;--text-muted:#aaa;--text-dim:#888;--border:rgba(255,255,255,0.1);--teal:#4ecdc4;--red:#ff6b6b;--yellow:#ffe66d;}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 40%,var(--bg3) 100%);background-attachment:fixed;color:var(--text);font-family:'Crimson Text',Georgia,serif;font-size:16px;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:rgba(255,255,255,0.03)}::-webkit-scrollbar-thumb{background:rgba(229,152,52,0.3);border-radius:3px}
/* TIMER BAR */
#timer-bar{position:fixed;top:0;left:0;right:0;z-index:200;height:56px;background:linear-gradient(90deg,#1a1a2e,#16213e 50%,#0f3460);border-bottom:2px solid rgba(229,152,52,0.4);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.timer-left{display:flex;align-items:center;gap:12px}
.btn-home-link{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.2);color:var(--text-muted);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;font-family:inherit;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all 0.2s;white-space:nowrap}
.btn-home-link:hover{border-color:var(--gold);color:var(--gold)}
.timer-brand{display:flex;align-items:center;gap:6px}
.timer-brand span{color:var(--gold);font-family:'Playfair Display',serif;font-weight:700;font-size:17px;letter-spacing:0.5px}
.timers-wrap{display:flex;gap:10px}
.timer-widget{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:4px 10px;transition:all 0.3s}
.timer-widget.running{background:rgba(229,152,52,0.15);border-color:rgba(229,152,52,0.6)}
.timer-icon{font-size:13px;color:var(--text-muted)}.timer-widget.running .timer-icon{color:var(--gold)}
.timer-display{font-family:'Courier New',monospace;font-weight:700;font-size:16px;color:#ccc;min-width:55px;letter-spacing:2px}
.timer-widget.running .timer-display{color:var(--gold)}
.btn-timer{background:rgba(255,255,255,0.1);border:none;border-radius:6px;color:#ccc;font-weight:700;cursor:pointer;padding:3px 9px;font-size:12px;transition:all 0.2s;font-family:inherit}
.timer-widget.running .btn-timer{background:var(--gold);color:#1a1a2e}
.btn-reset{background:transparent;border:none;color:#888;cursor:pointer;padding:3px 5px;font-size:13px;font-family:inherit;transition:color 0.2s}
.btn-reset:hover{color:var(--red)}
/* LAYOUT */
#app{padding-top:56px}.page{display:none}.page.active{display:block}
/* HOME */
.home-wrapper{max-width:1200px;margin:0 auto;padding:44px 24px 60px}
.home-header{text-align:center;margin-bottom:36px}
.home-label{color:var(--gold);font-family:monospace;font-size:12px;text-transform:uppercase;letter-spacing:4px;margin-bottom:12px;display:block}
.home-title{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,54px);font-weight:900;line-height:1.1;margin-bottom:12px}
.home-sub{color:var(--text-dim);font-size:15px;max-width:460px;margin:0 auto;line-height:1.6}
/* FILTERS */
.filters-section{margin-bottom:28px}
.filter-row{display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
.filter-label{color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:2px;text-align:center;margin-bottom:6px;font-family:monospace}
.btn-filter{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:var(--text-muted);border-radius:20px;padding:6px 15px;cursor:pointer;font-size:13px;font-family:inherit;transition:all 0.2s}
.btn-filter.active{background:rgba(229,152,52,0.2);border-color:var(--gold);color:var(--gold);font-weight:600}
.filter-divider{width:100%;height:1px;background:rgba(255,255,255,0.06);margin:4px 0}
.recipe-count{color:#666;font-size:13px;text-align:center;margin-bottom:18px}
/* GRID */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.recipe-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;padding:20px;cursor:pointer;transition:all 0.25s ease}
.recipe-card:hover{background:rgba(229,152,52,0.08);border-color:rgba(229,152,52,0.4);transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.3)}
.card-emoji{font-size:38px;margin-bottom:10px;display:block}
.card-meta{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-bottom:7px;font-family:monospace}
.card-name{color:var(--text);font-family:'Playfair Display',serif;font-size:17px;font-weight:700;margin-bottom:7px;line-height:1.3}
.card-desc{color:var(--text-muted);font-size:13px;margin-bottom:12px;line-height:1.55}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,0.07);border-radius:6px;padding:3px 8px;color:#bbb;font-size:11px}
/* RECIPE PAGE */
.recipe-header{background:linear-gradient(180deg,rgba(229,152,52,0.07) 0%,transparent 100%);padding:22px 28px 18px;border-bottom:1px solid rgba(255,255,255,0.07)}
.btn-back{background:transparent;border:1px solid rgba(255,255,255,0.2);color:var(--text-muted);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;margin-bottom:16px;font-family:inherit;transition:all 0.2s;display:inline-block}
.btn-back:hover{border-color:var(--gold);color:var(--gold)}
.recipe-header-inner{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.recipe-header-left{flex:1;min-width:260px}
.recipe-category-badge{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-family:monospace;margin-bottom:7px}
.recipe-title{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,32px);font-weight:700;margin-bottom:7px;line-height:1.2}
.recipe-tagline{color:var(--text-muted);font-size:14px;margin-bottom:12px;line-height:1.6}
.recipe-times{display:flex;gap:8px;flex-wrap:wrap}
.time-badge{background:rgba(255,255,255,0.06);border-radius:8px;padding:4px 11px;color:#ccc;font-size:13px}
.time-badge.total{background:rgba(229,152,52,0.15);color:var(--gold);font-weight:600}
/* NUTRITION */
.nutrition-panel{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:200px;max-width:240px}
.nutrition-title{color:var(--gold);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:11px}
.servings-control{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.btn-serving{background:rgba(229,152,52,0.2);border:1px solid var(--gold);color:var(--gold);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;transition:background 0.2s}
.btn-serving:hover{background:rgba(229,152,52,0.35)}
.servings-num{color:var(--text);font-size:20px;font-weight:700;font-family:'Playfair Display',serif;min-width:26px;text-align:center}
.servings-label{color:var(--text-dim);font-size:12px}
.kcal-box{background:rgba(229,152,52,0.1);border-radius:8px;padding:6px 10px;margin-bottom:10px;text-align:center}
.kcal-num{color:var(--gold);font-weight:700;font-size:18px}
.kcal-label{color:var(--text-muted);font-size:11px;margin-left:4px}
.macro-row{margin-bottom:8px}
.macro-header{display:flex;justify-content:space-between;margin-bottom:3px}
.macro-name{color:var(--text-muted);font-size:11px}
.macro-val{color:var(--text);font-size:11px;font-weight:600}
.macro-track{background:rgba(255,255,255,0.08);border-radius:4px;height:5px;overflow:hidden}
.macro-fill{height:100%;border-radius:4px;transition:width 0.5s}
/* RECIPE BODY */
.recipe-body{display:flex;align-items:flex-start}
.steps-panel{flex:1;padding:22px 24px;min-width:0}
.step-nav{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}
.btn-step{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text-muted);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;font-family:inherit;transition:all 0.2s}
.btn-step.active{background:var(--gold);border-color:var(--gold);color:#1a1a2e;font-weight:700}
.step-card{background:rgba(229,152,52,0.05);border:1px solid rgba(229,152,52,0.25);border-radius:16px;padding:22px}
.step-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.step-label{color:var(--gold);font-family:monospace;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.step-title{color:var(--text);font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1.2}
.step-duration{background:rgba(229,152,52,0.15);border:1px solid rgba(229,152,52,0.3);border-radius:10px;padding:5px 12px;text-align:center;flex-shrink:0}
.step-duration-num{color:var(--gold);font-weight:700;font-size:17px;display:block}
.step-duration-unit{color:var(--text-muted);font-size:10px}
.step-text{color:#d4c5b0;font-size:15px;line-height:1.85;margin-bottom:14px}
.step-tip{background:rgba(78,205,196,0.08);border:1px solid rgba(78,205,196,0.25);border-radius:10px;padding:11px 14px}
.step-tip p{color:var(--teal);font-size:13px;line-height:1.7}
.step-footer{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.btn-nav{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;border-radius:10px;padding:9px 18px;cursor:pointer;font-size:13px;font-family:inherit;transition:all 0.2s}
.btn-nav:hover:not(:disabled){background:rgba(255,255,255,0.14)}
.btn-nav:disabled{opacity:0.35;cursor:default}
.btn-nav.next{background:rgba(229,152,52,0.2);border-color:var(--gold);color:var(--gold);font-weight:600}
.btn-nav.next:hover:not(:disabled){background:rgba(229,152,52,0.35)}
/* INGREDIENTS SIDEBAR */
.ingredients-sidebar{width:260px;flex-shrink:0;padding:22px 16px 22px 0;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto}
.ing-panel{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:16px;padding:14px}
.ing-panel-title{color:var(--gold);font-family:'Playfair Display',serif;font-size:14px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.ing-item{padding:7px 9px;border-radius:8px;margin-bottom:3px;border:1px solid transparent;transition:all 0.3s}
.ing-item.active{background:rgba(229,152,52,0.12);border-color:rgba(229,152,52,0.35)}
.ing-row{display:flex;justify-content:space-between;align-items:flex-start;gap:5px}
.ing-name{color:#888;font-size:12px;line-height:1.4;flex:1}
.ing-item.active .ing-name{color:var(--text);font-weight:600}
.ing-active-dot{color:var(--gold);margin-right:3px;font-size:9px}
.ing-qty{color:#666;font-size:11px;font-weight:600;white-space:nowrap}
.ing-item.active .ing-qty{color:var(--gold)}
.ing-tip{color:var(--teal);font-size:10px;margin-top:3px;line-height:1.5;font-style:italic}
/* RESPONSIVE */
@media(max-width:768px){
  .recipe-header{padding:14px}.recipe-header-inner{flex-direction:column}.nutrition-panel{max-width:100%;width:100%}
  .recipe-body{flex-direction:column-reverse}.ingredients-sidebar{width:100%;position:static;max-height:none;padding:0 14px}
  .steps-panel{padding:14px}.timers-wrap{gap:6px}.timer-widget{padding:3px 7px;gap:4px}.timer-display{font-size:14px;min-width:48px}
  .home-wrapper{padding:28px 14px 44px}
}
@media(max-width:480px){.timer-brand span{display:none}.btn-home-link span{display:none}}
</style>
</head>
<body>
<div id="timer-bar">
  <div class="timer-left">
    <div class="timer-brand"><span>👨‍🍳</span><span>Ma Cuisine</span></div>
    <a class="btn-home-link" href="https://alaniadev.github.io/MM1/index.html" target="_blank" rel="noopener">🏠 <span>Accueil MM1</span></a>
  </div>
  <div class="timers-wrap">
    <div class="timer-widget" id="tw1"><span class="timer-icon">⏱</span><span class="timer-display" id="td1">00:00</span><button class="btn-timer" onclick="timerToggle(1)">▶</button><button class="btn-reset" onclick="timerReset(1)" title="Reset">↺</button></div>
    <div class="timer-widget" id="tw2"><span class="timer-icon">⏱</span><span class="timer-display" id="td2">00:00</span><button class="btn-timer" onclick="timerToggle(2)">▶</button><button class="btn-reset" onclick="timerReset(2)" title="Reset">↺</button></div>
  </div>
</div>
<div id="app">
  <div id="page-home" class="page active">
    <div class="home-wrapper">
      <div class="home-header">
        <span class="home-label">Recettes pour débutants</span>
        <h1 class="home-title">Ma Cuisine 🍳</h1>
        <p class="home-sub">Toutes les recettes expliquées pas à pas, avec conseils et astuces pour apprendre à cuisiner facilement.</p>
      </div>
      <div class="filters-section">
        <div class="filter-label">Catégorie</div>
        <div class="filter-row" id="filter-cat">
          <button class="btn-filter active" onclick="setFilter('cat','all',this)">Toutes</button>
          <button class="btn-filter" onclick="setFilter('cat','plat',this)">🍽️ Plats</button>
          <button class="btn-filter" onclick="setFilter('cat','dessert',this)">🍰 Desserts</button>
          <button class="btn-filter" onclick="setFilter('cat','veggie',this)">🥦 Sans viande</button>
        </div>
        <div class="filter-divider"></div>
        <div class="filter-label">Cuisson</div>
        <div class="filter-row" id="filter-oven">
          <button class="btn-filter active" onclick="setFilter('oven','all',this)">Toutes cuissons</button>
          <button class="btn-filter" onclick="setFilter('oven','noOven',this)">🚫 Sans four</button>
          <button class="btn-filter" onclick="setFilter('oven','oven',this)">🔥 Avec four</button>
        </div>
        <div class="filter-divider"></div>
        <div class="filter-label">Type de viande</div>
        <div class="filter-row" id="filter-meat">
          <button class="btn-filter active" onclick="setFilter('meat','all',this)">Toutes</button>
          <button class="btn-filter" onclick="setFilter('meat','porc',this)">🐷 Porc</button>
          <button class="btn-filter" onclick="setFilter('meat','boeuf',this)">🐄 Bœuf</button>
          <button class="btn-filter" onclick="setFilter('meat','poulet',this)">🐔 Poulet</button>
          <button class="btn-filter" onclick="setFilter('meat','veau',this)">🐮 Veau</button>
          <button class="btn-filter" onclick="setFilter('meat','poisson',this)">🐟 Poisson</button>
          <button class="btn-filter" onclick="setFilter('meat','none',this)">🥦 Sans viande</button>
        </div>
      </div>
      <p class="recipe-count" id="recipe-count"></p>
      <div class="recipe-grid" id="recipe-grid"></div>
    </div>
  </div>
  <div id="page-recipe" class="page">
    <div class="recipe-header">
      <button class="btn-back" onclick="showHome()">← Retour aux recettes</button>
      <div class="recipe-header-inner">
        <div class="recipe-header-left">
          <div class="recipe-category-badge" id="r-badge"></div>
          <h2 class="recipe-title" id="r-title"></h2>
          <p class="recipe-tagline" id="r-tagline"></p>
          <div class="recipe-times">
            <span class="time-badge" id="r-prep"></span>
            <span class="time-badge" id="r-cook"></span>
            <span class="time-badge total" id="r-total"></span>
          </div>
        </div>
        <div class="nutrition-panel">
          <div class="nutrition-title">Portions &amp; Nutrition</div>
          <div class="servings-control">
            <button class="btn-serving" onclick="changeServings(-1)">−</button>
            <span class="servings-num" id="servings-num">4</span>
            <button class="btn-serving" onclick="changeServings(1)">+</button>
            <span class="servings-label">personnes</span>
          </div>
          <div class="kcal-box"><span class="kcal-num" id="kcal-val">—</span><span class="kcal-label">kcal total</span></div>
          <div id="macros-panel"></div>
        </div>
      </div>
    </div>
    <div class="recipe-body">
      <div class="steps-panel">
        <div class="step-nav" id="step-nav"></div>
        <div class="step-card" id="step-card"></div>
        <div class="step-footer">
          <button class="btn-nav" id="btn-prev" onclick="changeStep(-1)">← Étape précédente</button>
          <button class="btn-nav next" id="btn-next" onclick="changeStep(1)">Étape suivante →</button>
        </div>
      </div>
      <div class="ingredients-sidebar">
        <div class="ing-panel">
          <div class="ing-panel-title">🧺 Ingrédients</div>
          <div id="ing-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const RECIPES = [
{id:1,name:"Émincé de porc aux légumes façon wok",emoji:"🥢",category:"plat",meat:"porc",needsOven:false,prepTime:15,cookTime:15,baseServings:4,kcalPerServing:380,macros:{proteines:32,lipides:14,glucides:18,fibres:4},
description:"Un plat asiatique savoureux, coloré et rapide. Parfait pour un repas équilibré en semaine.",
tips:"Le secret du wok : feu très vif et ingrédients coupés en petits morceaux pour une cuisson rapide.",
ingredients:[
{id:"i1",name:"Filet de porc",qty:600,unit:"g",tip:"Coupez en fines lamelles dans le sens contraire des fibres."},
{id:"i2",name:"Poivron rouge",qty:1,unit:"pièce",tip:"Lavez, retirez les graines, tranchez en lanières."},
{id:"i3",name:"Poivron jaune",qty:1,unit:"pièce",tip:"Même technique que le rouge."},
{id:"i4",name:"Courgette",qty:1,unit:"pièce",tip:"Pas besoin d'éplucher. Rondelles de 5mm."},
{id:"i5",name:"Carotte",qty:2,unit:"pièces",tip:"Épluchez, taillez en fins bâtonnets."},
{id:"i6",name:"Oignon",qty:1,unit:"pièce",tip:"Émincez finement."},
{id:"i7",name:"Gousses d'ail",qty:3,unit:"pièces",tip:"Écrasez pour enlever la peau, hachez."},
{id:"i8",name:"Sauce soja",qty:4,unit:"c.à.s",tip:"Sauce soja claire de préférence."},
{id:"i9",name:"Huile de sésame",qty:1,unit:"c.à.s",tip:"Ajoutez hors du feu — brûle et perd son arôme."},
{id:"i10",name:"Huile neutre",qty:2,unit:"c.à.s",tip:"Pour la cuisson au wok."},
{id:"i11",name:"Gingembre frais",qty:1,unit:"cm",tip:"Épluchez avec une cuillère, râpez finement."},
{id:"i12",name:"Maïzena",qty:1,unit:"c.à.s",tip:"Pour épaissir légèrement la sauce."},
{id:"i13",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Mariner la viande",duration:10,ingredientIds:["i1","i8","i12"],
text:"Coupez le porc en fines lamelles (5mm). Mélangez avec 2 c.à.s de sauce soja et la maïzena. Laissez reposer pendant que vous préparez les légumes.",
tip:"✨ Plus les lamelles sont fines, plus elles cuisent vite et restent tendres. Mettez la viande 20 min au congélateur pour faciliter la coupe."},
{id:"s2",title:"Préparer les légumes",duration:10,ingredientIds:["i2","i3","i4","i5","i6","i7","i11"],
text:"Lavez tous les légumes. Coupez les poivrons en lanières, la courgette en demi-rondelles, les carottes en bâtonnets. Émincez l'oignon. Hachez ail et gingembre. Rangez chaque légume dans un bol séparé.",
tip:"✨ Préparez tout AVANT de cuire. Au wok, tout va très vite !"},
{id:"s3",title:"Saisir la viande",duration:5,ingredientIds:["i1","i10"],
text:"Chauffez le wok à feu très vif jusqu'à ce qu'il fume. Ajoutez l'huile. Versez les lamelles sans entasser. Ne touchez pas 1 minute, puis remuez 2-3 min. Réservez dans une assiette.",
tip:"✨ Si votre wok est trop petit, faites la viande en 2 fois. Un wok trop rempli cuit à la vapeur."},
{id:"s4",title:"Cuire les légumes",duration:8,ingredientIds:["i6","i7","i11","i5","i2","i3","i4","i10"],
text:"Dans le même wok, faites revenir oignon, ail et gingembre 1 min. Ajoutez les carottes 2 min, les poivrons 2 min, la courgette 2 min. Les légumes doivent rester légèrement croquants.",
tip:"✨ Les légumes les plus durs en premier (carotte), les plus tendres en dernier (courgette)."},
{id:"s5",title:"Finir et assaisonner",duration:3,ingredientIds:["i1","i8","i9","i13"],
text:"Remettez la viande. Versez le reste de sauce soja. Mélangez 1 minute à feu vif. Hors du feu, ajoutez l'huile de sésame. Goûtez, ajustez. Servez avec du riz blanc.",
tip:"✨ L'huile de sésame s'ajoute HORS du feu. C'est une huile aromatique, pas de cuisson !"}
]},

{id:2,name:"Côtes de porc à la moutarde",emoji:"🍖",category:"plat",meat:"porc",needsOven:false,prepTime:5,cookTime:15,baseServings:4,kcalPerServing:440,macros:{proteines:38,lipides:22,glucides:5,fibres:0},
description:"Un classique rapide et délicieux. La moutarde forme une croûte savoureuse qui garde la viande moelleuse.",
tips:"La clé : une poêle bien chaude pour saisir, puis feu moyen pour finir sans dessécher.",
ingredients:[
{id:"i1",name:"Côtes de porc",qty:4,unit:"pièces",tip:"Choisissez des côtes de 2cm d'épaisseur. Sortez-les 15 min avant de cuire."},
{id:"i2",name:"Moutarde de Dijon",qty:3,unit:"c.à.s",tip:"Forte ou à l'ancienne selon votre goût."},
{id:"i3",name:"Huile d'olive",qty:1,unit:"c.à.s",tip:""},
{id:"i4",name:"Beurre",qty:20,unit:"g",tip:"Ajoute richesse et couleur dorée."},
{id:"i5",name:"Herbes de Provence",qty:1,unit:"c.à.c",tip:"Ou thym seul."},
{id:"i6",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Enduire de moutarde",duration:5,ingredientIds:["i1","i2","i5","i6"],
text:"Salez et poivrez les côtes des deux côtés. Enduisez généreusement de moutarde sur chaque face. Saupoudrez d'herbes. La moutarde va former une croûte parfumée à la cuisson.",
tip:"✨ Cette étape peut se faire 30 min à l'avance pour une mini-marinade."},
{id:"s2",title:"Saisir les côtes",duration:6,ingredientIds:["i3","i4","i1"],
text:"Chauffez une grande poêle à feu vif avec huile + beurre. Quand le beurre mousse, déposez les côtes. Saisissez 3 min sans bouger pour former une belle croûte. Retournez et saisissez encore 3 min.",
tip:"✨ Ne bougez pas la viande ! C'est en laissant la croûte se former qu'on obtient la belle couleur caramélisée."},
{id:"s3",title:"Finir la cuisson",duration:5,ingredientIds:["i1"],
text:"Baissez le feu à moyen. Continuez 2-3 min de chaque côté. Pour vérifier : appuyez avec le doigt — souple = saignant, ferme = bien cuit. Laissez reposer 2 min avant de servir.",
tip:"✨ Laisser reposer la viande permet au jus de se redistribuer. Coupez immédiatement et vous perdrez tout le jus !"}
]},

{id:3,name:"Porc au caramel vietnamien",emoji:"🍯",category:"plat",meat:"porc",needsOven:false,prepTime:10,cookTime:35,baseServings:4,kcalPerServing:490,macros:{proteines:35,lipides:18,glucides:32,fibres:1},
description:"Un plat vietnamien fondant où le porc mijote dans un caramel salé-sucré irrésistible. Parfait avec du riz.",
tips:"Surveillez le caramel comme le lait sur le feu : entre doré et brûlé, il n'y a que quelques secondes.",
ingredients:[
{id:"i1",name:"Poitrine ou échine de porc",qty:700,unit:"g",tip:"Cubes de 3-4cm. La poitrine reste moelleuse grâce à son gras."},
{id:"i2",name:"Sucre",qty:4,unit:"c.à.s",tip:"Pour faire le caramel."},
{id:"i3",name:"Sauce de poisson (nuoc-mâm)",qty:3,unit:"c.à.s",tip:"À défaut, utilisez de la sauce soja."},
{id:"i4",name:"Gousses d'ail",qty:3,unit:"pièces",tip:"Hachez finement."},
{id:"i5",name:"Gingembre",qty:2,unit:"cm",tip:"Épluchez et hachez."},
{id:"i6",name:"Échalotes",qty:2,unit:"pièces",tip:"Émincez finement."},
{id:"i7",name:"Eau chaude",qty:200,unit:"ml",tip:""},
{id:"i8",name:"Poivre noir",qty:0,unit:"",tip:"Généreux — essentiel dans ce plat."}
],
steps:[
{id:"s1",title:"Faire le caramel",duration:8,ingredientIds:["i2"],
text:"Dans une cocotte, versez le sucre et 2 c.à.s d'eau. Chauffez à feu moyen-vif SANS remuer. Attendez une couleur ambrée foncée (5-7 min). Inclinez légèrement la casserole si inégal.",
tip:"✨ NE REMUEZ JAMAIS un caramel au sucre : ça le fait cristalliser. Contentez-vous d'incliner doucement."},
{id:"s2",title:"Saisir le porc dans le caramel",duration:5,ingredientIds:["i1","i4","i5","i6"],
text:"Hors du feu, ajoutez les morceaux de porc (ça crépite — c'est normal !). Remettez sur feu vif, enrobez. Ajoutez ail, gingembre et échalotes. Faites dorer 3-4 min.",
tip:"✨ Le caramel va durcir au contact de la viande froide, puis re-fondre. Continuez à remuer."},
{id:"s3",title:"Mijoter",duration:30,ingredientIds:["i3","i7","i8"],
text:"Versez l'eau chaude et la sauce de poisson. Poivrez généreusement. Portez à ébullition, baissez au minimum, couvrez à moitié et laissez mijoter 25-30 min. La sauce doit devenir sirupeuse.",
tip:"✨ Plus ça mijote, plus la viande s'attendrit. Si la sauce réduit trop vite, ajoutez un peu d'eau."}
]}
// BOEUF SANS FOUR
,{id:4,name:"Émincé de bœuf au poivron",emoji:"🥩",category:"plat",meat:"boeuf",needsOven:false,prepTime:10,cookTime:15,baseServings:4,kcalPerServing:420,macros:{proteines:38,lipides:18,glucides:12,fibres:3},
description:"Un classique savoureux et nourrissant. La tendresse du bœuf avec le sucré des poivrons colorés.",
tips:"La clé : une poêle très chaude pour bien saisir la viande et garder son jus.",
ingredients:[
{id:"i1",name:"Steak ou rumsteck",qty:600,unit:"g",tip:"Demandez de la viande à fondue. Sinon, 20 min au congélateur et coupez en lamelles fines."},
{id:"i2",name:"Poivron rouge",qty:2,unit:"pièces",tip:"Lavez, épépinez, coupez en lanières de 1cm."},
{id:"i3",name:"Poivron vert",qty:1,unit:"pièce",tip:"Plus amer que le rouge, apporte du caractère."},
{id:"i4",name:"Oignon",qty:2,unit:"pièces",tip:"Épluchez et coupez en demi-rondelles."},
{id:"i5",name:"Gousses d'ail",qty:3,unit:"pièces",tip:"Hachez finement."},
{id:"i6",name:"Concentré de tomate",qty:2,unit:"c.à.s",tip:"Donne profondeur et couleur à la sauce."},
{id:"i7",name:"Fond de veau",qty:200,unit:"ml",tip:"En brick au supermarché. Ou eau + cube de bouillon."},
{id:"i8",name:"Huile d'olive",qty:2,unit:"c.à.s",tip:""},
{id:"i9",name:"Thym, laurier",qty:0,unit:"",tip:"Les herbes de Provence fonctionnent aussi."},
{id:"i10",name:"Sel, poivre",qty:0,unit:"",tip:""},
{id:"i11",name:"Maïzena (optionnel)",qty:1,unit:"c.à.c",tip:"Pour épaissir la sauce si trop liquide."}
],
steps:[
{id:"s1",title:"Préparer les ingrédients",duration:10,ingredientIds:["i1","i2","i3","i4","i5"],
text:"Coupez la viande en lamelles fines. Lavez, épépinez et taillez les poivrons en lanières. Émincez les oignons. Hachez l'ail. Salez et poivrez la viande.",
tip:"✨ Sortez la viande du réfrigérateur 15 min avant de cuire. Une viande à température ambiante saisit mieux."},
{id:"s2",title:"Saisir le bœuf",duration:5,ingredientIds:["i1","i8"],
text:"Chauffez une grande poêle à feu vif avec l'huile. Quand l'huile est très chaude, ajoutez les lamelles. Ne bougez pas 1 minute, retournez et cuisez 1 min. Le but est de colorer, pas cuire à cœur. Réservez.",
tip:"✨ Si de l'eau se forme, la température est trop basse. Augmentez le feu et faites en 2 fois."},
{id:"s3",title:"Faire revenir les légumes",duration:8,ingredientIds:["i4","i5","i2","i3","i6","i9"],
text:"Dans la même poêle, faites revenir les oignons 3 min. Ajoutez ail et poivrons, cuisez 5 min. Ajoutez le concentré de tomate et les herbes, mélangez 1 min.",
tip:"✨ Un oignon est 'translucide' quand il devient transparent et doux — il a perdu son âcreté."},
{id:"s4",title:"Préparer la sauce",duration:7,ingredientIds:["i7","i11","i1","i10"],
text:"Versez le fond de veau. Grattez bien le fond de la poêle pour décoller les sucs. Laissez mijoter 5 min. Si trop liquide, délayez la maïzena dans 2 c.à.s d'eau froide et versez. Remettez la viande, goûtez.",
tip:"✨ Gratter le fond, c'est 'déglacer'. Ces petits morceaux collés sont concentrés en goût — ne les perdez jamais !"}
]},

{id:5,name:"Bœuf Stroganoff",emoji:"🍲",category:"plat",meat:"boeuf",needsOven:false,prepTime:15,cookTime:25,baseServings:4,kcalPerServing:520,macros:{proteines:35,lipides:28,glucides:15,fibres:2},
description:"Un grand classique russe crémeux et réconfortant. La crème fraîche et les champignons font toute la magie.",
tips:"Ne faites jamais bouillir la crème fraîche trop longtemps, elle risque de tourner. Feu doux en fin.",
ingredients:[
{id:"i1",name:"Bœuf (faux-filet ou rumsteck)",qty:600,unit:"g",tip:"Coupez en lamelles de 1cm de large et 5cm de long."},
{id:"i2",name:"Champignons de Paris",qty:300,unit:"g",tip:"NE PAS laver sous l'eau. Essuyez avec un papier humide. Tranchez à 5mm."},
{id:"i3",name:"Oignon",qty:2,unit:"pièces",tip:"Émincez finement."},
{id:"i4",name:"Gousses d'ail",qty:2,unit:"pièces",tip:"Hachez finement."},
{id:"i5",name:"Crème fraîche épaisse",qty:200,unit:"ml",tip:"Sortez-la 30 min avant pour qu'elle soit à température ambiante."},
{id:"i6",name:"Moutarde de Dijon",qty:1,unit:"c.à.s",tip:"Apporte du caractère et lie la sauce."},
{id:"i7",name:"Bouillon de bœuf",qty:150,unit:"ml",tip:"Un demi-cube dans 150ml d'eau chaude."},
{id:"i8",name:"Beurre",qty:30,unit:"g",tip:""},
{id:"i9",name:"Huile",qty:1,unit:"c.à.s",tip:"Mélanger beurre + huile évite que le beurre brûle."},
{id:"i10",name:"Paprika doux",qty:1,unit:"c.à.c",tip:"La signature du stroganoff !"},
{id:"i11",name:"Sel, poivre",qty:0,unit:"",tip:""},
{id:"i12",name:"Persil frais",qty:1,unit:"bouquet",tip:"Hachez les feuilles finement."}
],
steps:[
{id:"s1",title:"Assaisonner la viande",duration:10,ingredientIds:["i1","i10","i11"],
text:"Coupez le bœuf en lamelles régulières. Saupoudrez de paprika, sel et poivre. Mélangez pour bien enrober.",
tip:"✨ Le paprika brûle facilement — ajoutez-le sur la viande crue plutôt que dans la poêle chaude."},
{id:"s2",title:"Saisir la viande",duration:5,ingredientIds:["i1","i8","i9"],
text:"Chauffez huile + 15g de beurre à feu vif. Quand le beurre mousse, ajoutez les lamelles. Cuisez 2-3 min. Dorées dehors, légèrement rosées dedans. Réservez.",
tip:"✨ 'Réserver' = mettre de côté dans une assiette. La viande continuera à cuire avec sa chaleur résiduelle."},
{id:"s3",title:"Oignons et champignons",duration:10,ingredientIds:["i3","i4","i2","i8"],
text:"Dans la même poêle avec le reste de beurre, faites revenir les oignons 3-4 min. Ajoutez l'ail 1 min. Ajoutez les champignons : ils vont rejeter de l'eau (normal), attendez qu'elle s'évapore puis qu'ils dorent.",
tip:"✨ Les champignons contiennent beaucoup d'eau. Attendez patiemment qu'elle s'évapore avant de continuer."},
{id:"s4",title:"Sauce crémeuse",duration:8,ingredientIds:["i7","i5","i6","i11"],
text:"Versez le bouillon, grattez le fond. Réduisez 3 min. Baissez le feu. Incorporez la moutarde, puis la crème. NE PAS faire bouillir à gros bouillons. Frémissement doux 3-4 min.",
tip:"✨ La crème tranche (se sépare) si la chaleur est trop forte. Feu doux = sauce lisse et onctueuse."},
{id:"s5",title:"Finition",duration:3,ingredientIds:["i1","i12"],
text:"Remettez la viande, réchauffez 2-3 min à feu doux. Parsemez de persil haché. Servez avec des tagliatelles ou du riz.",
tip:"✨ Le persil frais apporte fraîcheur et couleur. Évitez le persil séché qui n'a presque aucun goût."}
]},

{id:6,name:"Steak haché sauce au poivre",emoji:"🥊",category:"plat",meat:"boeuf",needsOven:false,prepTime:5,cookTime:12,baseServings:4,kcalPerServing:390,macros:{proteines:36,lipides:20,glucides:6,fibres:1},
description:"Un steak sauce poivre maison facile, rapide et impressionnant. La sauce crémeuse transforme un steak ordinaire.",
tips:"Faites reposer la viande 2 minutes après cuisson — le jus se redistribue et chaque bouchée est meilleure.",
ingredients:[
{id:"i1",name:"Steaks hachés (15% MG)",qty:4,unit:"pièces 150g",tip:"15% de matière grasse = meilleur goût et tient mieux à la cuisson."},
{id:"i2",name:"Échalotes",qty:3,unit:"pièces",tip:"Émincez très finement — elles fondent dans la sauce."},
{id:"i3",name:"Poivre concassé",qty:1,unit:"c.à.s",tip:"Concassez des grains dans un torchon avec le fond d'une casserole. Le poivre frais est infiniment plus parfumé."},
{id:"i4",name:"Cognac ou whisky (optionnel)",qty:2,unit:"c.à.s",tip:"L'alcool s'évapore et donne un vrai goût de restaurant."},
{id:"i5",name:"Crème liquide entière",qty:150,unit:"ml",tip:"Liquide (pas épaisse) pour une sauce plus fluide."},
{id:"i6",name:"Beurre",qty:25,unit:"g",tip:""},
{id:"i7",name:"Sel",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Cuire les steaks",duration:6,ingredientIds:["i1","i6","i7"],
text:"Chauffez une poêle à feu très vif avec la moitié du beurre. Salez les steaks. Cuisez selon votre préférence : 2 min/côté = saignant, 3 min/côté = à point. Réservez, couvrez d'alu, laissez reposer 2 min.",
tip:"✨ La cuisson idéale d'un steak haché : cœur rose. Couvrir d'alu garde la chaleur pendant le repos."},
{id:"s2",title:"Sauce au poivre",duration:8,ingredientIds:["i2","i3","i4","i5","i6"],
text:"Dans la même poêle, faites fondre le reste de beurre. Faites revenir les échalotes 2 min. Ajoutez le poivre, cuisez 1 min. HORS DU FEU, versez le cognac, remettez sur feu et réduisez 30 sec. Versez la crème, laissez épaissir 2-3 min.",
tip:"✨ Verser l'alcool HORS du feu évite les flammes. Si ça flambe légèrement — ça s'éteint seul. Normal !"}
]}
// POULET SANS FOUR
,{id:7,name:"Poulet Curry",emoji:"🍛",category:"plat",meat:"poulet",needsOven:false,prepTime:15,cookTime:30,baseServings:4,kcalPerServing:460,macros:{proteines:40,lipides:20,glucides:22,fibres:5},
description:"Un curry de poulet onctueux et parfumé. Doux ou épicé selon votre goût.",
tips:"Toastez toujours vos épices en début de cuisson pour révéler leurs arômes — c'est le secret des bons currys.",
ingredients:[
{id:"i1",name:"Cuisses ou blancs de poulet",qty:800,unit:"g",tip:"Les cuisses sont plus moelleuses. Cubes de 3-4cm."},
{id:"i2",name:"Lait de coco",qty:400,unit:"ml",tip:"Agitez la boîte avant d'ouvrir."},
{id:"i3",name:"Tomates concassées",qty:400,unit:"ml",tip:"En boîte, pratique et très bon."},
{id:"i4",name:"Oignon",qty:2,unit:"pièces",tip:"Hachez finement."},
{id:"i5",name:"Gousses d'ail",qty:4,unit:"pièces",tip:"Hachez ou pressez."},
{id:"i6",name:"Gingembre frais",qty:3,unit:"cm",tip:"Épluchez avec une cuillère, râpez."},
{id:"i7",name:"Poudre de curry",qty:2,unit:"c.à.s",tip:"Commencez par 1 c.à.s si vous aimez doux."},
{id:"i8",name:"Curcuma",qty:1,unit:"c.à.c",tip:"Donne la couleur jaune. Ça tache !"},
{id:"i9",name:"Cumin",qty:1,unit:"c.à.c",tip:"Note chaude et légèrement fumée."},
{id:"i10",name:"Huile neutre",qty:2,unit:"c.à.s",tip:""},
{id:"i11",name:"Sel, poivre",qty:0,unit:"",tip:""},
{id:"i12",name:"Coriandre fraîche",qty:1,unit:"bouquet",tip:"Optionnel. Du persil frais fonctionne aussi."},
{id:"i13",name:"Citron",qty:0.5,unit:"pièce",tip:"Un filet en fin pour équilibrer."}
],
steps:[
{id:"s1",title:"Préparer le poulet",duration:10,ingredientIds:["i1","i7","i8","i11"],
text:"Coupez le poulet en cubes. Saupoudrez avec la moitié du curry et le curcuma, salez, poivrez. Mélangez.",
tip:"✨ Le curcuma tache tout ! Tablier conseillé."},
{id:"s2",title:"Toaster les épices",duration:8,ingredientIds:["i10","i4","i5","i6","i7","i9"],
text:"Chauffez l'huile à feu moyen. Faites revenir les oignons 5 min jusqu'à dorés. Ajoutez ail, gingembre et épices. Mélangez 2 min — les arômes se révèlent.",
tip:"✨ Faire revenir les épices dans la matière grasse libère leurs arômes. Ne sautez jamais cette étape !"},
{id:"s3",title:"Saisir le poulet",duration:5,ingredientIds:["i1"],
text:"Montez le feu. Ajoutez les cubes de poulet. Faites-les dorer sur toutes les faces 3-4 min.",
tip:"✨ La coloration développe des dizaines de saveurs supplémentaires (réaction de Maillard)."},
{id:"s4",title:"Mijoter",duration:25,ingredientIds:["i3","i2","i11"],
text:"Ajoutez tomates et lait de coco. Portez à légère ébullition puis baissez au minimum. Couvrez et mijotez 20-25 min.",
tip:"✨ Mijoter = petits bouillons très doux. La patience est une épice aussi !"},
{id:"s5",title:"Finition",duration:2,ingredientIds:["i12","i13"],
text:"Pressez le citron. Parsemez de coriandre fraîche. Servez avec du riz basmati.",
tip:"✨ Le citron en fin 'réveille' toutes les saveurs du plat."}
]},

{id:8,name:"Poulet à la crème et champignons",emoji:"🍄",category:"plat",meat:"poulet",needsOven:false,prepTime:10,cookTime:25,baseServings:4,kcalPerServing:480,macros:{proteines:42,lipides:24,glucides:10,fibres:2},
description:"Un plat réconfortant et élégant en 35 minutes. La sauce crémeuse aux champignons est irrésistible.",
tips:"L'astuce : faire dorer les champignons séparément pour qu'ils soient bien cuits et pas gorgés d'eau.",
ingredients:[
{id:"i1",name:"Blancs de poulet",qty:4,unit:"pièces",tip:"Aplatissez légèrement avec la paume pour une épaisseur homogène."},
{id:"i2",name:"Champignons de Paris",qty:400,unit:"g",tip:"NE PAS laver sous l'eau. Essuyez et tranchez."},
{id:"i3",name:"Échalotes",qty:2,unit:"pièces",tip:"Émincez finement."},
{id:"i4",name:"Ail",qty:2,unit:"gousses",tip:"Hachez finement."},
{id:"i5",name:"Crème fraîche liquide",qty:200,unit:"ml",tip:"Entière pour une sauce onctueuse."},
{id:"i6",name:"Bouillon de poulet",qty:100,unit:"ml",tip:"Un quart de cube dans 100ml d'eau chaude."},
{id:"i7",name:"Beurre",qty:30,unit:"g",tip:""},
{id:"i8",name:"Huile",qty:1,unit:"c.à.s",tip:""},
{id:"i9",name:"Persil frais",qty:1,unit:"bouquet",tip:"Hachez finement."},
{id:"i10",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Cuire le poulet",duration:10,ingredientIds:["i1","i8","i7","i10"],
text:"Salez et poivrez les blancs. Chauffez huile + moitié du beurre à feu moyen-vif. Cuisez 5 min côté beau, 5 min côté plat. Bien dorés. Réservez.",
tip:"✨ Pour vérifier si un blanc est cuit : pressez avec le doigt. Élastique et ferme = cuit. Très souple = encore cru."},
{id:"s2",title:"Faire revenir champignons",duration:8,ingredientIds:["i2","i3","i4","i7"],
text:"Dans la même poêle, faites fondre le reste de beurre. Faites revenir les échalotes 2 min. Ajoutez les champignons, cuisez à feu vif sans trop remuer jusqu'à ce qu'ils dorent (5-6 min). Ajoutez l'ail 1 min.",
tip:"✨ Ne remuez pas trop les champignons ! Trop agités, ils rendent leur eau et cuisent à la vapeur au lieu de dorer."},
{id:"s3",title:"Sauce et finition",duration:8,ingredientIds:["i6","i5","i1","i9","i10"],
text:"Versez le bouillon, grattez le fond, réduisez 2 min. Ajoutez la crème, mélangez. Remettez les blancs dans la sauce. Frémissez 5 min à feu doux. Parsemez de persil. Goûtez.",
tip:"✨ Les blancs vont finir de cuire dans la sauce crémeuse tout en lui apportant leur jus."}
]},

{id:9,name:"Poulet sauté citron et herbes",emoji:"🍋",category:"plat",meat:"poulet",needsOven:false,prepTime:10,cookTime:20,baseServings:4,kcalPerServing:350,macros:{proteines:44,lipides:14,glucides:4,fibres:1},
description:"Léger, frais et parfumé — un poulet méditerranéen avec des notes de citron et d'herbes fraîches.",
tips:"Le citron doit être ajouté en fin de cuisson : si on le fait trop cuire il devient amer.",
ingredients:[
{id:"i1",name:"Blancs ou cuisses de poulet",qty:800,unit:"g",tip:"En morceaux de taille similaire pour une cuisson homogène."},
{id:"i2",name:"Citron",qty:2,unit:"pièces",tip:"Zeste + jus des 2. Lavez bien la peau avant de zester."},
{id:"i3",name:"Ail",qty:4,unit:"gousses",tip:"Hachez finement."},
{id:"i4",name:"Thym frais",qty:3,unit:"branches",tip:"Effeuillez en passant les doigts à l'envers sur la tige."},
{id:"i5",name:"Romarin",qty:1,unit:"branche",tip:"Hachez finement — une branche suffit, c'est puissant."},
{id:"i6",name:"Persil frais",qty:0.5,unit:"bouquet",tip:"Pour la finition."},
{id:"i7",name:"Huile d'olive",qty:3,unit:"c.à.s",tip:"Utiliser une huile fruitée pour plus de goût."},
{id:"i8",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Marinade express",duration:10,ingredientIds:["i1","i2","i3","i4","i5","i7","i8"],
text:"Mélangez le poulet avec le zeste de 1 citron, la moitié de l'ail haché, le thym, le romarin, 2 c.à.s d'huile, sel et poivre. Laissez reposer 10 min minimum.",
tip:"✨ Le zeste de citron (la partie jaune de la peau) contient les huiles essentielles — 80% de l'arôme citronné."},
{id:"s2",title:"Saisir le poulet",duration:10,ingredientIds:["i1","i7"],
text:"Chauffez 1 c.à.s d'huile à feu vif. Faites dorer les morceaux sur toutes les faces, 3-4 min par côté. Ne bougez pas trop la viande.",
tip:"✨ Un poulet bien doré retient ses jus. Un poulet pâle = viande sèche et fade."},
{id:"s3",title:"Finir et citronner",duration:8,ingredientIds:["i3","i2","i6"],
text:"Baissez le feu à moyen. Ajoutez l'ail restant, cuisez 1 min. Pressez le jus des 2 citrons sur le poulet. Ajoutez le zeste du 2e citron. Couvrez et laissez finir 5 min. Parsemez de persil.",
tip:"✨ Vérifiez la cuisson : coupez un morceau, la chair doit être blanche partout. Du rose = pas encore cuit."}
]}
// VEAU SANS FOUR
,{id:10,name:"Escalopes milanaises",emoji:"🍽️",category:"plat",meat:"veau",needsOven:false,prepTime:15,cookTime:10,baseServings:4,kcalPerServing:480,macros:{proteines:42,lipides:22,glucides:20,fibres:1},
description:"Croustillant dehors, tendre dedans. La panure milanaise transforme des escalopes ordinaires en régal.",
tips:"La chapelure doit adhérer parfaitement : bien appuyer avec la paume à chaque étape de la panure.",
ingredients:[
{id:"i1",name:"Escalopes de veau",qty:4,unit:"pièces",tip:"Demandez des escalopes fines (5mm). Sinon aplatissez entre 2 feuilles de film avec un rouleau."},
{id:"i2",name:"Œufs",qty:2,unit:"pièces",tip:"Battez en omelette dans une assiette creuse."},
{id:"i3",name:"Chapelure",qty:150,unit:"g",tip:"Fine du commerce. Pour maison : mixez du pain de mie rassis."},
{id:"i4",name:"Farine",qty:80,unit:"g",tip:"Première étape de la panure."},
{id:"i5",name:"Parmesan râpé",qty:50,unit:"g",tip:"Mélangez à la chapelure pour la version milanaise authentique."},
{id:"i6",name:"Beurre",qty:40,unit:"g",tip:"La cuisson au beurre donne une coloration parfaite."},
{id:"i7",name:"Huile",qty:2,unit:"c.à.s",tip:"Associé au beurre pour éviter qu'il brûle."},
{id:"i8",name:"Citron",qty:1,unit:"pièce",tip:"En quartiers pour servir."},
{id:"i9",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer la panure",duration:10,ingredientIds:["i2","i3","i4","i5","i9"],
text:"3 assiettes : 1. farine, 2. œufs battus, 3. chapelure + parmesan. Salez, poivrez les escalopes. Passez chaque escalope dans farine (secouez l'excédent), puis œuf, puis chapelure. Appuyez bien à chaque étape.",
tip:"✨ La technique 'farine-œuf-chapelure' s'appelle 'à l'anglaise'. Bien appuyer = la panure tient. Secouer l'excédent = panure pas trop épaisse."},
{id:"s2",title:"Cuire les escalopes",duration:8,ingredientIds:["i6","i7","i1"],
text:"Chauffez beurre + huile à feu moyen-vif. Quand le beurre mousse, déposez les escalopes. Cuisez 3-4 min sans toucher. Retournez délicatement et cuisez 2-3 min.",
tip:"✨ Si la chapelure colore trop vite, baissez le feu. Trop chaud = brûlée dehors, crue dedans."},
{id:"s3",title:"Servir",duration:2,ingredientIds:["i8"],
text:"Posez sur du papier absorbant 30 sec pour retirer l'excès de gras. Servez immédiatement avec un quartier de citron à presser.",
tip:"✨ L'escalope milanaise se mange immédiatement — la panure ramollit en attendant."}
]},

{id:11,name:"Veau Marengo",emoji:"🫕",category:"plat",meat:"veau",needsOven:false,prepTime:15,cookTime:60,baseServings:4,kcalPerServing:420,macros:{proteines:38,lipides:16,glucides:14,fibres:3},
description:"Un grand classique de la cuisine française. Le veau mijote dans une sauce tomate aux champignons.",
tips:"Le mijotage long est le secret : plus ça cuit doucement, plus la viande s'attendrit.",
ingredients:[
{id:"i1",name:"Épaule de veau",qty:800,unit:"g",tip:"Cubes de 4cm. L'épaule est idéale pour les mijotés."},
{id:"i2",name:"Champignons de Paris",qty:250,unit:"g",tip:"Essuyez et coupez en 4."},
{id:"i3",name:"Tomates concassées",qty:400,unit:"ml",tip:"1 boîte."},
{id:"i4",name:"Oignon",qty:1,unit:"pièce",tip:"Hachez grossièrement."},
{id:"i5",name:"Carottes",qty:2,unit:"pièces",tip:"Épluchez et coupez en rondelles."},
{id:"i6",name:"Ail",qty:3,unit:"gousses",tip:"Hachez finement."},
{id:"i7",name:"Bouillon de veau",qty:300,unit:"ml",tip:"1 cube dans 300ml d'eau chaude."},
{id:"i8",name:"Vin blanc sec",qty:150,unit:"ml",tip:"Optionnel mais apporte beaucoup de complexité."},
{id:"i9",name:"Bouquet garni",qty:0,unit:"",tip:"Thym, laurier, persil attachés ensemble."},
{id:"i10",name:"Huile",qty:2,unit:"c.à.s",tip:""},
{id:"i11",name:"Farine",qty:1,unit:"c.à.s",tip:"Pour lier la sauce."},
{id:"i12",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Faire dorer le veau",duration:10,ingredientIds:["i1","i10","i11","i12"],
text:"Farinez légèrement les cubes (secouez l'excédent). Chauffez l'huile dans une cocotte à feu vif. Faites dorer les cubes par petites quantités 2-3 min par face. Réservez.",
tip:"✨ Fariner la viande avant de saisir : la farine colore et épaissira naturellement la sauce."},
{id:"s2",title:"Faire revenir les légumes",duration:8,ingredientIds:["i4","i5","i6","i2"],
text:"Dans la même cocotte, faites revenir l'oignon 3 min. Ajoutez carottes, champignons et ail, cuisez 4 min.",
tip:"✨ Les sucs dorés au fond de la cocotte vont parfumer la sauce lors du mijotage."},
{id:"s3",title:"Déglacer et mijoter",duration:55,ingredientIds:["i8","i3","i7","i9","i1","i12"],
text:"Versez le vin blanc, grattez bien le fond. Réduisez 2 min. Ajoutez tomates, bouillon, bouquet garni et les cubes de veau. Portez à ébullition, baissez au minimum. Couvrez et laissez mijoter 45-50 min.",
tip:"✨ Si la sauce est trop liquide en fin, retirez le couvercle et laissez réduire 10 min."}
]},

{id:12,name:"Émincé de veau à la zurichoise",emoji:"🇨🇭",category:"plat",meat:"veau",needsOven:false,prepTime:10,cookTime:15,baseServings:4,kcalPerServing:440,macros:{proteines:40,lipides:22,glucides:8,fibres:1},
description:"Spécialité suisse : sauce crémeuse aux champignons et vin blanc enrobe des lamelles de veau tendres.",
tips:"Ce plat se cuit et se sert rapidement — préparez tous vos ingrédients à l'avance.",
ingredients:[
{id:"i1",name:"Noix de veau ou filet",qty:600,unit:"g",tip:"Émincez en lamelles de 5mm."},
{id:"i2",name:"Champignons de Paris",qty:300,unit:"g",tip:"Essuyez et tranchez finement."},
{id:"i3",name:"Oignon",qty:1,unit:"pièce",tip:"Hachez très finement."},
{id:"i4",name:"Crème fraîche liquide",qty:200,unit:"ml",tip:""},
{id:"i5",name:"Vin blanc sec",qty:100,unit:"ml",tip:""},
{id:"i6",name:"Beurre",qty:40,unit:"g",tip:""},
{id:"i7",name:"Maïzena",qty:1,unit:"c.à.c",tip:"Pour lier légèrement."},
{id:"i8",name:"Sel, poivre, muscade",qty:0,unit:"",tip:"La muscade râpée est la touche signature."}
],
steps:[
{id:"s1",title:"Saisir le veau",duration:5,ingredientIds:["i1","i6","i8"],
text:"Chauffez 20g de beurre à feu très vif. Saisissez les lamelles de veau 1-2 min en remuant constamment. À peine dorées. Réservez immédiatement.",
tip:"✨ Le veau cuit très rapidement. Trop cuit = caoutchouteux. L'objectif : juste colorer légèrement."},
{id:"s2",title:"Champignons et sauce",duration:10,ingredientIds:["i3","i2","i5","i4","i7","i8","i6"],
text:"Dans la même poêle, faites fondre le reste de beurre. Faites revenir l'oignon 2 min. Ajoutez les champignons, dorez 4 min. Versez le vin blanc, grattez et réduisez de moitié. Délayez la maïzena dans 2 c.à.s d'eau froide, ajoutez. Versez la crème, mélangez 2 min. Muscade, sel, poivre.",
tip:"✨ La maïzena délayée dans l'eau froide avant d'être ajoutée évite les grumeaux dans la sauce."},
{id:"s3",title:"Finition",duration:2,ingredientIds:["i1"],
text:"Remettez le veau dans la sauce 1-2 min à feu doux pour réchauffer sans surcuire. Servez immédiatement avec des rösti ou des pâtes.",
tip:"✨ Ce plat ne s'attend pas — servez dès que c'est prêt pour le veau tendre et la sauce onctueuse."}
]}
// POISSON SANS FOUR
,{id:13,name:"Saumon à la poêle sauce citronnée",emoji:"🐟",category:"plat",meat:"poisson",needsOven:false,prepTime:5,cookTime:10,baseServings:4,kcalPerServing:380,macros:{proteines:40,lipides:20,glucides:3,fibres:0},
description:"Le saumon à la poêle est la base de tout cuisinier. Maîtrisez cette technique et vous aurez un plat élégant en 15 min.",
tips:"Commencez côté peau — elle protège la chair et devient délicieusement croustillante.",
ingredients:[
{id:"i1",name:"Pavés de saumon",qty:4,unit:"pièces 150g",tip:"À température ambiante. Séchez avec du papier absorbant (sinon la vapeur empêche la coloration)."},
{id:"i2",name:"Citron",qty:1,unit:"pièce",tip:"Jus + zeste."},
{id:"i3",name:"Beurre",qty:25,unit:"g",tip:"Le beurre donne une belle coloration noisette."},
{id:"i4",name:"Câpres",qty:1,unit:"c.à.s",tip:"Optionnel — acidité qui se marie parfaitement avec le saumon."},
{id:"i5",name:"Persil ou aneth frais",qty:0.5,unit:"bouquet",tip:"L'aneth est l'herbe classique du saumon."},
{id:"i6",name:"Huile",qty:1,unit:"c.à.s",tip:""},
{id:"i7",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer le saumon",duration:5,ingredientIds:["i1","i7"],
text:"Séchez les pavés avec du papier absorbant — très important pour avoir une belle croûte. Salez et poivrez des deux côtés.",
tip:"✨ Un poisson bien séché = belle croûte croustillante. Un poisson humide = colle et s'effrite."},
{id:"s2",title:"Cuire le saumon",duration:8,ingredientIds:["i1","i6","i3"],
text:"Chauffez l'huile dans une poêle antiadhésive à feu moyen-vif. Déposez les pavés CÔTÉ PEAU EN BAS. Cuisez 4-5 min sans bouger jusqu'à peau croustillante et cuisson remontant à mi-hauteur. Retournez et cuisez 1-2 min côté chair. Ajoutez le beurre, arrosez.",
tip:"✨ Commencer côté peau : elle protège la chair délicate. Quand la cuisson remonte à mi-hauteur = moment de retourner."},
{id:"s3",title:"Sauce citronnée",duration:3,ingredientIds:["i2","i4","i5"],
text:"Dans la même poêle chaude (hors feu), pressez le citron, ajoutez le zeste, les câpres et les herbes. Mélangez rapidement. Versez sur le saumon.",
tip:"✨ Le saumon est cuit quand la chair est opaque mais encore légèrement translucide au centre. Trop cuit = sec et sans goût."}
]},

{id:14,name:"Cabillaud à la provençale",emoji:"🍅",category:"plat",meat:"poisson",needsOven:false,prepTime:10,cookTime:20,baseServings:4,kcalPerServing:290,macros:{proteines:38,lipides:8,glucides:12,fibres:4},
description:"Des filets de cabillaud pochés dans une sauce tomate parfumée aux herbes méditerranéennes.",
tips:"Le cabillaud est délicat et se défait facilement. Soyez très délicat quand vous le manipulez.",
ingredients:[
{id:"i1",name:"Filets de cabillaud",qty:600,unit:"g",tip:"Séchez avec du papier absorbant. Vérifiez l'absence d'arêtes en passant les doigts."},
{id:"i2",name:"Tomates concassées",qty:400,unit:"ml",tip:"1 boîte."},
{id:"i3",name:"Oignon",qty:1,unit:"pièce",tip:"Hachez."},
{id:"i4",name:"Ail",qty:3,unit:"gousses",tip:"Hachez finement."},
{id:"i5",name:"Olives noires",qty:80,unit:"g",tip:"Dénoyautées, coupez en deux si grosses."},
{id:"i6",name:"Câpres",qty:1,unit:"c.à.s",tip:"Optionnel mais authentique."},
{id:"i7",name:"Herbes de Provence",qty:2,unit:"c.à.c",tip:""},
{id:"i8",name:"Huile d'olive",qty:3,unit:"c.à.s",tip:""},
{id:"i9",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer la sauce provençale",duration:10,ingredientIds:["i3","i4","i2","i5","i6","i7","i8","i9"],
text:"Chauffez l'huile à feu moyen. Faites revenir l'oignon 3 min. Ajoutez l'ail 1 min. Ajoutez les tomates, olives, câpres et herbes. Salez, poivrez. Laissez mijoter 8-10 min jusqu'à ce que la sauce épaississe.",
tip:"✨ La sauce doit être épaisse. Si trop liquide, le poisson sera noyé. Laissez réduire davantage si besoin."},
{id:"s2",title:"Pocher le poisson",duration:10,ingredientIds:["i1"],
text:"Faites des creux dans la sauce. Déposez délicatement les filets. Couvrez et laissez cuire 8-10 min à feu doux. Cuit quand il se détache en feuillets et n'est plus translucide.",
tip:"✨ 'Pocher' = cuire dans un liquide frémissant. Ne faites PAS bouillir — le poisson se désintègrerait."}
]},

{id:15,name:"Crevettes sautées ail et beurre",emoji:"🦐",category:"plat",meat:"poisson",needsOven:false,prepTime:5,cookTime:5,baseServings:4,kcalPerServing:260,macros:{proteines:28,lipides:14,glucides:2,fibres:0},
description:"Le plat le plus rapide : 10 minutes chrono. Des crevettes juteuses dans un beurre à l'ail parfumé.",
tips:"Les crevettes cuisent très vite — dès qu'elles sont roses et enroulées en C, elles sont cuites.",
ingredients:[
{id:"i1",name:"Grosses crevettes crues",qty:600,unit:"g",tip:"Décortiquées. Bien séchées avec du papier absorbant."},
{id:"i2",name:"Ail",qty:4,unit:"gousses",tip:"Hachez très finement ou utilisez un presse-ail."},
{id:"i3",name:"Beurre",qty:50,unit:"g",tip:"Demi-sel pour plus de goût."},
{id:"i4",name:"Persil frais",qty:0.5,unit:"bouquet",tip:"Hachez finement."},
{id:"i5",name:"Citron",qty:1,unit:"pièce",tip:"Jus + quartiers pour servir."},
{id:"i6",name:"Piment d'Espelette",qty:1,unit:"pincée",tip:"Optionnel pour une légère chaleur."},
{id:"i7",name:"Sel",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Cuire les crevettes",duration:4,ingredientIds:["i1","i3","i2","i7","i6"],
text:"Chauffez le beurre à feu vif. Quand il mousse, ajoutez les crevettes EN UNE SEULE COUCHE. Ajoutez l'ail haché. Cuisez 1-2 min jusqu'à ce qu'elles deviennent ROSES en dessous, retournez et cuisez 1 min. Elles s'enroulent en C — c'est signe qu'elles sont cuites.",
tip:"✨ Une crevette cuite = rose et enroulée en C. Trop cuite = enroulée en O et caoutchouteuse. Il n'y a que 30 secondes entre les deux !"},
{id:"s2",title:"Finition",duration:2,ingredientIds:["i4","i5"],
text:"Hors du feu, pressez le citron, parsemez de persil haché. Mélangez et servez immédiatement avec du pain ou des pâtes.",
tip:"✨ Ce plat ne s'attend pas. Les crevettes continuent de cuire avec la chaleur du beurre. Servez dès que c'est prêt !"}
]}
// FOUR — PORC
,{id:16,name:"Rôti de porc aux herbes et légumes",emoji:"🥕",category:"plat",meat:"porc",needsOven:true,prepTime:15,cookTime:75,baseServings:6,kcalPerServing:420,macros:{proteines:44,lipides:16,glucides:12,fibres:3},
description:"Un plat familial classique qui cuit seul au four pendant que vous vaquez à vos occupations.",
tips:"Arrosez le rôti avec son jus toutes les 20 minutes — c'est le secret d'une viande moelleuse et bien dorée.",
ingredients:[
{id:"i1",name:"Rôti de porc dans le filet",qty:1200,unit:"g",tip:"Rôti ficelé. Sortez-le 30 min avant."},
{id:"i2",name:"Carottes",qty:3,unit:"pièces",tip:"Épluchez et coupez en rondelles épaisses."},
{id:"i3",name:"Pommes de terre",qty:600,unit:"g",tip:"Épluchez et coupez en cubes de 3cm."},
{id:"i4",name:"Oignon",qty:2,unit:"pièces",tip:"Coupez en quartiers."},
{id:"i5",name:"Gousses d'ail",qty:5,unit:"pièces",tip:"Laissez entières avec la peau (ail en chemise)."},
{id:"i6",name:"Thym frais",qty:4,unit:"branches",tip:""},
{id:"i7",name:"Romarin",qty:2,unit:"branches",tip:""},
{id:"i8",name:"Huile d'olive",qty:3,unit:"c.à.s",tip:""},
{id:"i9",name:"Moutarde",qty:2,unit:"c.à.s",tip:"Pour badigeonner le rôti."},
{id:"i10",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préchauffer et préparer",duration:15,ingredientIds:["i1","i9","i10","i2","i3","i4","i5"],
text:"Préchauffez le four à 180°C. Badigeonnez le rôti de moutarde sur toutes les faces. Salez et poivrez. Dans un plat à four, disposez les légumes et l'ail en chemise. Arrosez d'huile, salez, poivrez. Posez le rôti sur les légumes.",
tip:"✨ Préchauffer = allumer le four À L'AVANCE pour qu'il soit à bonne température à l'enfournement. Essentiel pour une cuisson régulière."},
{id:"s2",title:"Cuisson au four",duration:75,ingredientIds:["i6","i7","i8"],
text:"Ajoutez thym et romarin autour du rôti. Versez 100ml d'eau dans le fond du plat. Enfournez 1h15 pour un rôti de 1,2kg (1h par kilo). Arrosez avec le jus de cuisson toutes les 20 min.",
tip:"✨ Règle du rôti de porc : 1 heure par kilo à 180°C. Pour vérifier : piquez le centre — le jus doit couler clair, pas rosé."},
{id:"s3",title:"Repos et découpe",duration:10,ingredientIds:["i1"],
text:"Sortez du four, couvrez de papier alu et laissez reposer 10 min. Ce repos est OBLIGATOIRE. Découpez en tranches régulières. Servez avec les légumes et le jus de cuisson.",
tip:"✨ Le repos permet aux jus de se redistribuer. Un rôti coupé immédiatement perd la moitié de son jus !"}
]},

{id:17,name:"Travers de porc caramélisés",emoji:"🍖",category:"plat",meat:"porc",needsOven:true,prepTime:10,cookTime:120,baseServings:4,kcalPerServing:580,macros:{proteines:42,lipides:32,glucides:22,fibres:1},
description:"Des ribs fondants et laqués — la viande se détache de l'os à la fourchette. Un régal !",
tips:"Le secret : cuisson longue basse température d'abord, puis la sauce pour laquer en fin de cuisson.",
ingredients:[
{id:"i1",name:"Travers de porc (ribs)",qty:1200,unit:"g",tip:"Demandez à votre boucher de les couper en portions de 2-3 os."},
{id:"i2",name:"Sauce soja",qty:4,unit:"c.à.s",tip:""},
{id:"i3",name:"Miel",qty:3,unit:"c.à.s",tip:"Le miel caramélise et laque la viande."},
{id:"i4",name:"Ketchup",qty:3,unit:"c.à.s",tip:"Base de la marinade."},
{id:"i5",name:"Vinaigre de cidre",qty:2,unit:"c.à.s",tip:"L'acidité équilibre le sucré."},
{id:"i6",name:"Ail",qty:3,unit:"gousses",tip:"Hachez finement."},
{id:"i7",name:"Paprika fumé",qty:1,unit:"c.à.c",tip:"Donne une note fumée magique."},
{id:"i8",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer la marinade",duration:10,ingredientIds:["i2","i3","i4","i5","i6","i7","i8"],
text:"Mélangez tous les ingrédients de la marinade dans un bol. Badigeonnez les ribs généreusement des deux côtés. Idéalement, laissez mariner 2h ou toute la nuit au réfrigérateur.",
tip:"✨ Plus la marinade est longue, plus les saveurs pénètrent. Mais 10 min suffisent si vous êtes pressé."},
{id:"s2",title:"Cuisson basse température",duration:100,ingredientIds:["i1"],
text:"Préchauffez le four à 150°C. Posez les ribs dans un grand plat, couvrez de papier aluminium. Enfournez 1h30. La viande commence à se détacher des os.",
tip:"✨ La cuisson basse et longue couverte rend les ribs fondants. La chaleur douce rompt le collagène du tissu conjonctif."},
{id:"s3",title:"Laquage final",duration:20,ingredientIds:["i2","i3"],
text:"Montez le four à 220°C. Retirez le papier alu. Badigeonnez les ribs avec reste de marinade + 2 c.à.s de miel. Enfournez 15-20 min sans couvrir, en surveillant, jusqu'à surface caramélisée et brillante.",
tip:"✨ Surveillez attentivement : le miel caramélise vite à haute température et peut brûler. Restez proche du four."}
]},

{id:18,name:"Gratin de pommes de terre au jambon",emoji:"🧀",category:"plat",meat:"porc",needsOven:true,prepTime:20,cookTime:60,baseServings:6,kcalPerServing:450,macros:{proteines:22,lipides:24,glucides:38,fibres:3},
description:"Un gratin réconfortant et généreux. Le jambon apporte une note fumée qui se marie parfaitement avec la crème.",
tips:"Le secret : des tranches de pommes de terre régulières pour une cuisson homogène.",
ingredients:[
{id:"i1",name:"Pommes de terre",qty:1000,unit:"g",tip:"Variété à chair ferme (Charlotte, Amandine). Tranchez très finement (3mm)."},
{id:"i2",name:"Jambon blanc",qty:200,unit:"g",tip:"En tranches épaisses, coupées en morceaux."},
{id:"i3",name:"Crème fraîche liquide",qty:300,unit:"ml",tip:"Entière pour un gratin crémeux."},
{id:"i4",name:"Gruyère râpé",qty:120,unit:"g",tip:"Ou comté, emmental."},
{id:"i5",name:"Ail",qty:2,unit:"gousses",tip:"Pour frotter le plat."},
{id:"i6",name:"Lait",qty:150,unit:"ml",tip:"Mélangé à la crème pour alléger."},
{id:"i7",name:"Beurre",qty:15,unit:"g",tip:"Pour beurrer le plat."},
{id:"i8",name:"Noix de muscade",qty:1,unit:"pincée",tip:"Râpée fraîche si possible."},
{id:"i9",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer et préchauffer",duration:20,ingredientIds:["i1","i5","i7","i3","i6","i8","i9"],
text:"Préchauffez le four à 180°C. Frottez un plat à gratin avec les gousses d'ail coupées. Beurrez le plat. Mélangez crème, lait, muscade, sel et poivre dans un bol.",
tip:"✨ Les tranches de pommes de terre doivent être aussi fines et régulières que possible. Une mandoline est idéale."},
{id:"s2",title:"Monter le gratin",duration:10,ingredientIds:["i1","i2","i3","i4"],
text:"Alternez les couches : pommes de terre, morceaux de jambon, filet de mélange crème. Répétez en terminant par une couche de pommes de terre. Versez le reste de crème. Parsemez de gruyère râpé.",
tip:"✨ Ne lésinez pas sur le fromage pour la surface — c'est ce qui formera la belle croûte dorée et croustillante !"},
{id:"s3",title:"Cuire au four",duration:60,ingredientIds:["i1"],
text:"Enfournez à 180°C pendant 55-60 min. Vérifiez en plantant un couteau : il doit s'enfoncer sans résistance. Si la surface colore trop vite, couvrez de papier alu.",
tip:"✨ Un gratin se teste avec un couteau : si ça résiste, pas encore cuit. Si ça entre comme dans du beurre, c'est parfait !"}
]}
// FOUR — BOEUF
,{id:19,name:"Bœuf bourguignon simplifié",emoji:"🍷",category:"plat",meat:"boeuf",needsOven:true,prepTime:20,cookTime:150,baseServings:6,kcalPerServing:520,macros:{proteines:42,lipides:22,glucides:18,fibres:4},
description:"Le grand classique de la cuisine française adapté aux débutants. Long mais simple — le four fait tout.",
tips:"Un plat réchauffé le lendemain est encore meilleur : les saveurs ont eu le temps de se développer.",
ingredients:[
{id:"i1",name:"Bœuf à braiser (paleron ou joue)",qty:1000,unit:"g",tip:"Cubes de 4-5cm. Le paleron s'attendrit lors de la cuisson longue."},
{id:"i2",name:"Vin rouge",qty:750,unit:"ml",tip:"Un vin que vous boiriez. Pas besoin de grand cru."},
{id:"i3",name:"Lardons fumés",qty:150,unit:"g",tip:""},
{id:"i4",name:"Champignons de Paris",qty:250,unit:"g",tip:"Essuyez, coupez en deux ou laissez entiers si petits."},
{id:"i5",name:"Carottes",qty:3,unit:"pièces",tip:"Rondelles épaisses."},
{id:"i6",name:"Oignon",qty:2,unit:"pièces",tip:"Hachez grossièrement."},
{id:"i7",name:"Ail",qty:4,unit:"gousses",tip:"Hachez."},
{id:"i8",name:"Bouillon de bœuf",qty:300,unit:"ml",tip:"2 cubes dans 300ml d'eau chaude."},
{id:"i9",name:"Concentré de tomate",qty:2,unit:"c.à.s",tip:""},
{id:"i10",name:"Farine",qty:2,unit:"c.à.s",tip:"Pour lier la sauce."},
{id:"i11",name:"Bouquet garni",qty:0,unit:"",tip:"Thym, laurier."},
{id:"i12",name:"Huile",qty:2,unit:"c.à.s",tip:""},
{id:"i13",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Faire dorer viande et lardons",duration:20,ingredientIds:["i1","i3","i10","i12","i13"],
text:"Préchauffez le four à 160°C. Chauffez l'huile dans une cocotte allant au four à feu vif. Faites dorer les lardons 3 min. Farinez les cubes de bœuf, faites-les dorer par petites quantités (2-3 min par face). Réservez.",
tip:"✨ Faites dorer la viande en PETITES QUANTITÉS — si vous entassez tout, elle cuit à la vapeur au lieu de dorer."},
{id:"s2",title:"Faire revenir les légumes",duration:8,ingredientIds:["i6","i7","i5","i9"],
text:"Dans la même cocotte, faites revenir l'oignon 3 min. Ajoutez ail, carottes et concentré de tomate, cuisez 3 min.",
tip:"✨ Ces étapes semblent longues mais sont rapides. Chaque couche de saveur compte dans ce plat."},
{id:"s3",title:"Mouiller et enfourner",duration:150,ingredientIds:["i2","i8","i1","i3","i11","i4","i13"],
text:"Remettez viande et lardons. Versez vin et bouillon — la viande doit être presque couverte. Ajoutez le bouquet garni. Portez à ébullition, couvrez et enfournez à 160°C pendant 2h30. Ajoutez les champignons à mi-cuisson.",
tip:"✨ La longue cuisson à 160°C transforme les cubes durs en viande fondante. Le vin perd son alcool et garde son goût."}
]},

{id:20,name:"Lasagnes bolognaise",emoji:"🍝",category:"plat",meat:"boeuf",needsOven:true,prepTime:30,cookTime:75,baseServings:6,kcalPerServing:560,macros:{proteines:30,lipides:24,glucides:52,fibres:4},
description:"Le plat familial par excellence. Un peu long à préparer, mais tellement bon que ça vaut chaque minute.",
tips:"La béchamel doit être bien lisse et ni trop épaisse ni trop liquide — elle se répand facilement entre les couches.",
ingredients:[
{id:"i1",name:"Feuilles de lasagnes",qty:12,unit:"à 15 feuilles",tip:"Sèches du commerce — pas besoin de les précuire si la sauce est assez liquide."},
{id:"i2",name:"Bœuf haché",qty:500,unit:"g",tip:""},
{id:"i3",name:"Tomates concassées",qty:800,unit:"ml (2 boîtes)",tip:""},
{id:"i4",name:"Oignon",qty:1,unit:"pièce",tip:"Hachez finement."},
{id:"i5",name:"Ail",qty:3,unit:"gousses",tip:"Hachez."},
{id:"i6",name:"Lait",qty:500,unit:"ml",tip:"Pour la béchamel."},
{id:"i7",name:"Beurre",qty:50,unit:"g",tip:"Pour la béchamel."},
{id:"i8",name:"Farine",qty:50,unit:"g",tip:"Pour la béchamel."},
{id:"i9",name:"Gruyère râpé",qty:150,unit:"g",tip:""},
{id:"i10",name:"Huile d'olive",qty:2,unit:"c.à.s",tip:""},
{id:"i11",name:"Herbes de Provence",qty:1,unit:"c.à.c",tip:""},
{id:"i12",name:"Sel, poivre, muscade",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Faire la bolognaise",duration:25,ingredientIds:["i2","i4","i5","i3","i11","i10","i12"],
text:"Chauffez l'huile, faites revenir l'oignon 3 min. Ajoutez l'ail 1 min. Ajoutez la viande hachée, cassez-la avec une cuillère et faites-la dorer 5 min. Ajoutez les tomates et herbes. Salez, poivrez. Laissez mijoter 15 min.",
tip:"✨ La bolognaise doit être bien réduite et épaisse. Si elle est trop liquide, les lasagnes seront détrempées."},
{id:"s2",title:"Faire la béchamel",duration:10,ingredientIds:["i7","i8","i6","i9","i12"],
text:"Faites fondre le beurre à feu moyen. Ajoutez la farine, mélangez vigoureusement 1 min (ça forme un roux). Versez le lait chaud PROGRESSIVEMENT tout en fouettant sans arrêt. Continuez à fouetter jusqu'à ce que la sauce épaississe (5 min). Salez, poivrez, muscade.",
tip:"✨ Secret d'une béchamel sans grumeaux : verser le lait progressivement tout en fouettant SANS INTERRUPTION."},
{id:"s3",title:"Monter et cuire au four",duration:60,ingredientIds:["i1","i2","i6","i9"],
text:"Préchauffez à 180°C. Dans un grand plat beurré, alternez : béchamel fine, feuilles de lasagnes, bolognaise, béchamel. Répétez 3-4 fois. Terminez par béchamel + gruyère râpé. Enfournez 45-50 min.",
tip:"✨ Couvrez de papier alu les 30 premières minutes pour que les lasagnes absorbent l'humidité. Retirez ensuite pour gratiner."}
]},

{id:21,name:"Hamburgers maison au four",emoji:"🍔",category:"plat",meat:"boeuf",needsOven:true,prepTime:20,cookTime:20,baseServings:4,kcalPerServing:650,macros:{proteines:38,lipides:32,glucides:42,fibres:3},
description:"Des burgers maison bien meilleurs que ceux du commerce. Le four assure une cuisson homogène sans fumée.",
tips:"La clé d'un bon steak de burger : ne pas trop manipuler la viande hachée pour garder une texture fondante.",
ingredients:[
{id:"i1",name:"Bœuf haché 20% MG",qty:600,unit:"g",tip:"20% de MG = burgers juteux. Moins gras = burgers secs."},
{id:"i2",name:"Buns à hamburger",qty:4,unit:"pièces",tip:"Briochés si possible."},
{id:"i3",name:"Fromage à fondre",qty:4,unit:"tranches",tip:"Cheddar, gouda, emmental..."},
{id:"i4",name:"Oignon",qty:1,unit:"pièce",tip:"Pour les oignons caramélisés optionnels."},
{id:"i5",name:"Ail",qty:1,unit:"gousse",tip:"Hachez finement, incorporez dans la viande."},
{id:"i6",name:"Sauce Worcestershire",qty:1,unit:"c.à.c",tip:"Ou sauce soja. Booste le goût."},
{id:"i7",name:"Sel, poivre",qty:0,unit:"",tip:"Salez JUSTE AVANT de cuire."},
{id:"i8",name:"Garnitures",qty:0,unit:"salade, tomate, cornichons",tip:"Lavez la salade, tranchez la tomate."}
],
steps:[
{id:"s1",title:"Préparer les steaks",duration:10,ingredientIds:["i1","i5","i6","i7"],
text:"Préchauffez le four à 200°C. Mélangez la viande hachée avec l'ail haché et la sauce Worcestershire. Formez 4 steaks de 150g en les manipulant le MOINS POSSIBLE. Faites un creux au centre avec le pouce. Salez et poivrez juste avant d'enfourner.",
tip:"✨ Le creux central empêche le burger de gonfler à la cuisson. Sans ce creux, le centre se dilate et forme une boulette."},
{id:"s2",title:"Cuire au four",duration:14,ingredientIds:["i1","i3"],
text:"Posez les steaks sur une grille au-dessus d'une plaque. Enfournez 12 min pour à point, 14 min pour bien cuit. Posez une tranche de fromage sur chaque steak 2 min avant la fin.",
tip:"✨ La grille est importante : le burger cuit dans sa vapeur si posé sur une plaque pleine. Sur grille = chaleur tout autour."},
{id:"s3",title:"Assembler le burger",duration:5,ingredientIds:["i2","i8","i4"],
text:"Toastez les buns 2 min au four. Assemblez dans l'ordre : bun bas, sauce, salade, tomate, steak avec fromage, cornichons, bun haut. Servez immédiatement.",
tip:"✨ Salade entre le pain et la tomate — elle protège le pain de l'humidité."}
]}
// FOUR — POULET
,{id:22,name:"Poulet rôti classique",emoji:"🍗",category:"plat",meat:"poulet",needsOven:true,prepTime:15,cookTime:70,baseServings:4,kcalPerServing:450,macros:{proteines:46,lipides:24,glucides:4,fibres:1},
description:"Maîtriser le poulet rôti, c'est maîtriser la base de la cuisine familiale. Simple, économique, délicieux.",
tips:"Le beurre sous la peau est le secret d'un poulet rôti inoubliable — la chair reste juteuse et parfumée.",
ingredients:[
{id:"i1",name:"Poulet entier",qty:1600,unit:"g",tip:"Un poulet fermier Label Rouge si possible. Sortez-le 30 min avant du frigo."},
{id:"i2",name:"Beurre mou",qty:60,unit:"g",tip:"Sortez-le 30 min avant pour qu'il soit malléable."},
{id:"i3",name:"Ail",qty:4,unit:"gousses",tip:"2 dans le beurre haché, 2 dans la cavité."},
{id:"i4",name:"Thym frais",qty:4,unit:"branches",tip:"Mélangé au beurre."},
{id:"i5",name:"Citron",qty:1,unit:"pièce",tip:"La moitié dans la cavité parfume de l'intérieur."},
{id:"i6",name:"Huile d'olive",qty:1,unit:"c.à.s",tip:"Pour la peau."},
{id:"i7",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer le beurre aux herbes",duration:10,ingredientIds:["i2","i3","i4","i7"],
text:"Préchauffez le four à 200°C. Mélangez le beurre mou avec 2 gousses d'ail hachées, le thym effeuillé, sel et poivre. Glissez vos doigts entre la peau et la chair du poulet pour décoller la peau sans la déchirer. Farcissez ce beurre sous la peau.",
tip:"✨ Le beurre sous la peau fond pendant la cuisson et imprègne directement la chair. La peau le protège et reste croustillante. C'est le truc des chefs !"},
{id:"s2",title:"Préparer et enfourner",duration:5,ingredientIds:["i5","i3","i6","i7"],
text:"Glissez le demi-citron et les 2 gousses d'ail dans la cavité du poulet. Badigeonnez la peau d'huile d'olive, salez généreusement. Posez le poulet sur une grille dans le plat.",
tip:"✨ Posé sur une grille, la chaleur circule tout autour du poulet — la peau croustille sur toutes les faces."},
{id:"s3",title:"Cuire au four",duration:70,ingredientIds:["i1"],
text:"Enfournez à 200°C. Retournez le poulet à mi-cuisson. Pour 1,6kg : 1h10 environ. Vérifiez en piquant la cuisse — le jus doit couler clair (pas rosé). Laissez reposer 10 min sous alu avant de découper.",
tip:"✨ Règle du poulet rôti : 20 min par 500g + 20 min. Jus clair en piquant la cuisse = cuisson parfaite."}
]},

{id:23,name:"Poulet pané au four",emoji:"🌿",category:"plat",meat:"poulet",needsOven:true,prepTime:15,cookTime:25,baseServings:4,kcalPerServing:360,macros:{proteines:44,lipides:10,glucides:22,fibres:1},
description:"Tout le croustillant du poulet pané, sans friture ! La panure dorée au four grâce au parmesan.",
tips:"Pour une panure ultra-croustillante : badigeonnez légèrement d'huile avant d'enfourner.",
ingredients:[
{id:"i1",name:"Blancs de poulet",qty:4,unit:"pièces",tip:"Coupez chaque blanc en 2-3 lanières."},
{id:"i2",name:"Œufs",qty:2,unit:"pièces",tip:"Battez en omelette."},
{id:"i3",name:"Chapelure panko",qty:120,unit:"g",tip:"La chapelure japonaise est plus croustillante que l'ordinaire."},
{id:"i4",name:"Parmesan râpé",qty:50,unit:"g",tip:"Mélangé à la chapelure, il apporte un goût intense."},
{id:"i5",name:"Ail en poudre",qty:0.5,unit:"c.à.c",tip:""},
{id:"i6",name:"Paprika",qty:0.5,unit:"c.à.c",tip:"Pour la couleur et le goût."},
{id:"i7",name:"Farine",qty:60,unit:"g",tip:"Première étape de la panure."},
{id:"i8",name:"Huile d'olive",qty:2,unit:"c.à.s",tip:"Pour badigeonner la panure."},
{id:"i9",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Préparer la panure",duration:10,ingredientIds:["i3","i4","i5","i6","i2","i7","i9"],
text:"Préchauffez le four à 200°C. Posez du papier cuisson sur une plaque. Préparez 3 assiettes : 1. farine, 2. œufs battus, 3. chapelure panko + parmesan + ail + paprika + sel + poivre. Passez chaque morceau dans cet ordre.",
tip:"✨ La farine en premier = l'œuf adhère. L'œuf = la chapelure adhère. Sans cette progression, la panure tombe à la cuisson."},
{id:"s2",title:"Cuire au four",duration:25,ingredientIds:["i1","i8"],
text:"Posez les morceaux panés sur la plaque. Badigeonnez légèrement d'huile d'olive. Enfournez 20-25 min en retournant à mi-cuisson. La panure doit être dorée et croustillante.",
tip:"✨ Badigeonner d'huile est la clé : sans huile, la panure reste sèche et pâle. Avec un peu d'huile, elle dore comme si elle était frite."}
]},

{id:24,name:"Cuisses de poulet confites aux olives",emoji:"🫒",category:"plat",meat:"poulet",needsOven:true,prepTime:10,cookTime:60,baseServings:4,kcalPerServing:480,macros:{proteines:42,lipides:28,glucides:8,fibres:3},
description:"Un plat méditerranéen fondant où le poulet cuit doucement dans un bain d'olives, tomates et herbes.",
tips:"Les cuisses sont meilleures que les blancs pour ce plat — elles restent tendres et juteuses après une longue cuisson.",
ingredients:[
{id:"i1",name:"Cuisses de poulet",qty:4,unit:"pièces",tip:"Avec os et peau — gardez la peau, elle protège la chair."},
{id:"i2",name:"Olives vertes et noires",qty:200,unit:"g",tip:"Mélangées pour plus de goût."},
{id:"i3",name:"Tomates cerises",qty:250,unit:"g",tip:"Ou 2 tomates normales coupées en quartiers."},
{id:"i4",name:"Oignon rouge",qty:2,unit:"pièces",tip:"Émincez en demi-rondelles."},
{id:"i5",name:"Ail",qty:4,unit:"gousses",tip:"Entières (en chemise) — fondent et parfument."},
{id:"i6",name:"Herbes de Provence",qty:2,unit:"c.à.c",tip:""},
{id:"i7",name:"Huile d'olive",qty:3,unit:"c.à.s",tip:""},
{id:"i8",name:"Vin blanc ou bouillon",qty:100,unit:"ml",tip:"Empêche de dessécher et fait la sauce."},
{id:"i9",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Saisir le poulet",duration:10,ingredientIds:["i1","i7","i9"],
text:"Préchauffez le four à 180°C. Salez et poivrez les cuisses des deux côtés. Chauffez l'huile dans une poêle allant au four. Faites dorer les cuisses CÔTÉ PEAU EN BAS 5 min sans bouger jusqu'à peau bien dorée. Retournez 2 min.",
tip:"✨ Dorer la peau avant d'enfourner = peau croustillante + saveur caramélisée qui parfume tout le plat."},
{id:"s2",title:"Ajouter les légumes et enfourner",duration:60,ingredientIds:["i2","i3","i4","i5","i6","i8"],
text:"Ajoutez autour des cuisses : oignons, tomates cerises, olives, ail. Saupoudrez d'herbes de Provence. Versez le vin blanc. Enfournez à 180°C pendant 50-55 min.",
tip:"✨ Vérifiez à mi-cuisson : si le fond du plat est sec, ajoutez un peu d'eau ou de bouillon pour protéger les légumes."}
]}
// FOUR — VEAU
,{id:25,name:"Blanquette de veau au four",emoji:"🥛",category:"plat",meat:"veau",needsOven:true,prepTime:20,cookTime:90,baseServings:4,kcalPerServing:480,macros:{proteines:42,lipides:22,glucides:16,fibres:3},
description:"La blanquette est l'un des plats les plus emblématiques de la cuisine française. Douce, crémeuse, réconfortante.",
tips:"La blanquette ne se fait PAS dorer — la viande reste blanche. C'est la différence avec le bœuf bourguignon.",
ingredients:[
{id:"i1",name:"Épaule de veau",qty:800,unit:"g",tip:"Cubes de 4cm."},
{id:"i2",name:"Carottes",qty:3,unit:"pièces",tip:"Rondelles."},
{id:"i3",name:"Champignons de Paris",qty:200,unit:"g",tip:"Entiers si petits, coupés en 4 si grands."},
{id:"i4",name:"Oignon",qty:1,unit:"pièce",tip:"Laissez entier, piquez-le de 2 clous de girofle."},
{id:"i5",name:"Crème fraîche",qty:200,unit:"ml",tip:""},
{id:"i6",name:"Bouillon de veau",qty:800,unit:"ml",tip:"3 cubes dans 800ml d'eau chaude."},
{id:"i7",name:"Farine",qty:2,unit:"c.à.s",tip:"Pour lier la sauce."},
{id:"i8",name:"Beurre",qty:30,unit:"g",tip:""},
{id:"i9",name:"Citron",qty:0.5,unit:"pièce",tip:"Un filet pour la finition."},
{id:"i10",name:"Bouquet garni",qty:0,unit:"",tip:"Thym, laurier."},
{id:"i11",name:"Sel, poivre",qty:0,unit:"",tip:""}
],
steps:[
{id:"s1",title:"Blanchir la viande",duration:10,ingredientIds:["i1"],
text:"Préchauffez le four à 160°C. Mettez les cubes de veau dans une casserole, couvrez d'eau froide. Portez à ébullition, laissez bouillir 2 min. De l'écume (impuretés) remonte. Égouttez et rincez la viande.",
tip:"✨ Blanchir = plonger dans l'eau froide et porter à ébullition. Les impuretés remontent en écume. On jette cette eau. Résultat : une sauce blanche impeccable."},
{id:"s2",title:"Cuire avec les légumes",duration:80,ingredientIds:["i2","i4","i3","i6","i10","i1","i11"],
text:"Dans une cocotte, mettez le veau blanchi, les carottes, l'oignon piqué de clous de girofle, les champignons, le bouquet garni. Couvrez de bouillon. Portez à ébullition, couvrez et enfournez à 160°C pendant 1h20.",
tip:"✨ La cuisson au four est plus douce et homogène que sur la plaque. La viande cuit entourée de chaleur."},
{id:"s3",title:"Sauce et finition",duration:10,ingredientIds:["i7","i8","i5","i9","i11"],
text:"Prélevez 400ml de bouillon de cuisson. Faites fondre le beurre, ajoutez la farine, mélangez 1 min. Versez le bouillon progressivement en fouettant. Portez à ébullition. Incorporez la crème. Versez sur la viande, ajoutez le citron.",
tip:"✨ Cette sauce s'appelle un 'velouté' — une béchamel faite avec du bouillon au lieu du lait."}
]},

{id:26,name:"Osso Buco à la milanaise",emoji:"🇮🇹",category:"plat",meat:"veau",needsOven:true,prepTime:15,cookTime:90,baseServings:4,kcalPerServing:520,macros:{proteines:44,lipides:20,glucides:18,fibres:3},
description:"Un grand classique italien fondant. La gremolata finale (ail, citron, persil) transforme complètement ce plat.",
tips:"L'osso buco se reconnaît au cylindre d'os avec de la moelle à l'intérieur — un délice à récupérer à la cuillère !",
ingredients:[
{id:"i1",name:"Jarret de veau tranché (osso buco)",qty:4,unit:"tranches épaisses",tip:"Liez chaque tranche avec de la ficelle alimentaire pour qu'elle garde sa forme."},
{id:"i2",name:"Tomates concassées",qty:400,unit:"ml",tip:""},
{id:"i3",name:"Vin blanc sec",qty:200,unit:"ml",tip:""},
{id:"i4",name:"Bouillon de veau",qty:200,unit:"ml",tip:""},
{id:"i5",name:"Oignon",qty:1,unit:"pièce",tip:"Hachez."},

{id:"i7",name:"Céleri",qty:2,unit:"branches",tip:"Petits dés."},
{id:"i8",name:"Ail",qty:2,unit:"gousses",tip:"Hachez."},
{id:"i9",name:"Farine",qty:2,unit:"c.à.s",tip:"Pour fariner les tranches."},
{id:"i10",name:"Huile d'olive",qty:2,unit:"c.à.s",tip:""},
{id:"i11",name:"Persil frais",qty:0.5,unit:"bouquet",tip:"Pour la gremolata."},
{id:"i12",name:"Citron",qty:1,unit:"pièce",tip:"Zeste pour la gremolata."},
