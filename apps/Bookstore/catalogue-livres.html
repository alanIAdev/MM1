<!DOCTYPE html>
<!--
  ============================================================================
  CATALOGUE DE LIVRES — Template autonome (1 seul fichier HTML)
  ============================================================================

  CE QUE FAIT CE FICHIER
  -----------------------
  - Il affiche une page "Catalogue" avec une carte par livre.
  - Quand on clique sur une carte, on arrive sur une "Fiche détail" du livre :
    une page unique et continue, avec un sommaire cliquable sur le côté qui
    ancre vers la vue d'ensemble et vers chaque chapitre. Pas de limite au
    nombre de chapitres : ajoutez-en autant que le livre en compte.
  - Chaque bloc de texte a un bouton "📋 Copier" pour le copier-coller
    facilement ailleurs (notes, gestionnaire de tâches, etc.)
  - Un bouton en haut à droite bascule entre un thème sombre (par défaut)
    et un thème clair "papier". Ce choix n'est PAS mémorisé d'une visite à
    l'autre (pas de stockage local) : au rechargement, on repart du thème
    sombre.

  COMMENT UTILISER CE FICHIER
  ----------------------------
  1. Ouvrez-le simplement en double-cliquant dessus (aucun serveur requis).
  2. Pour ajouter / modifier un livre : allez à la section
     "1. DONNÉES — VOS LIVRES" plus bas dans le <script>, et suivez le
     "GUIDE RAPIDE" qui s'y trouve. Un livre peut avoir autant de chapitres
     que nécessaire (1, 3, 8, 15... il n'y a aucune limite technique).
  3. Vous n'avez normalement RIEN à toucher dans le CSS ou dans les
     fonctions JavaScript : tout le contenu vient des données que vous
     remplissez.

  STRUCTURE DU FICHIER (dans l'ordre)
  ------------------------------------
  - <head>  : polices + feuille de style (CSS), très commentée par section.
  - <body>  : le squelette HTML minimal (deux "pages" : liste / détail).
  - <script>:
      1. Les données (vos livres)
      2. Des fonctions utilitaires (ex: copier dans le presse-papiers,
         gestion du thème clair/sombre)
      3. Le code qui construit la page "liste"
      4. Le code qui construit la page "détail" (sommaire + sections)
      5. Le "routeur" qui décide quelle page afficher selon l'URL
         (ex: #/livre/b1 affiche le détail du livre "b1")
  ============================================================================
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue de livres — Résumés &amp; actions</title>

<!-- ==========================================================================
     POLICES
     - "Fraunces"   : police à fort caractère pour les titres (façon livre).
     - "Public Sans": police humaniste, très lisible à l'écran, pour tout
                      le texte de lecture (résumés, idées, actions).
     - "IBM Plex Mono": police "machine à écrire" pour les infos techniques
                        (numéro de catalogue, étiquettes, boutons copier).
     ========================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ==========================================================================
     0. VARIABLES DE DESIGN (le "vocabulaire" de couleurs / polices du site)
     Modifier une valeur ici change TOUT le site d'un coup.

     Il y a DEUX jeux de couleurs :
     - :root                    → thème sombre (par défaut à l'ouverture)
     - [data-theme="light"]     → thème clair "papier", activé par le
                                   bouton en haut à droite de la page
     ========================================================================== */
  :root{
    /* -- Fond général et surfaces (cartes, fiche détail) -- */
    --color-bg:            #14171A;
    --color-surface:       #1E2225;
    --color-surface-soft:  #262B2E;

    /* -- Texte -- */
    --color-text:          #EDEAE3;
    --color-text-muted:    #A6A29A;

    /* -- Accent (laiton) -- */
    --color-accent:        #C9A15A;
    --color-accent-strong: #E4C079;

    /* -- Bordures / séparateurs -- */
    --color-border:        rgba(255,255,255,0.10);

    /* -- Ombre des cartes -- */
    --shadow-card: 0 1px 0 rgba(0,0,0,0.4), 0 10px 24px rgba(0,0,0,0.35);

    /* -- Typographie -- */
    --font-display: 'Fraunces', serif;
    --font-body:    'Public Sans', system-ui, sans-serif;
    --font-mono:    'IBM Plex Mono', monospace;

    /* -- Rayon d'arrondi commun -- */
    --radius: 6px;
  }

  /* -- Thème clair "papier", activé quand <html data-theme="light"> -- */
  [data-theme="light"]{
    --color-bg:            #F4EEDD;
    --color-surface:       #FFFDF6;
    --color-surface-soft:  #FBF4E1;
    --color-text:          #2B2419;
    --color-text-muted:    #6b5f45;
    --color-accent:        #A8712E;
    --color-accent-strong: #7A4F1E;
    --color-border:        rgba(43,36,25,0.14);
    --shadow-card: 0 1px 0 rgba(0,0,0,0.06), 0 8px 18px rgba(43,36,25,0.14);
  }

  /* ==========================================================================
     1. RESET DE BASE
     Remet à zéro quelques comportements par défaut du navigateur.
     ========================================================================== */
  *, *::before, *::after{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    line-height: 1.55;
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }
  h1, h2, h3, h4{ font-family: var(--font-display); margin: 0; }
  p{ margin: 0 0 0.8em 0; }
  ul, ol{ margin: 0; padding-left: 1.2em; }
  a{ color: inherit; text-decoration: none; }
  button{ font-family: var(--font-mono); cursor: pointer; }

  /* Accessibilité : contour visible au clavier */
  :focus-visible{
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  /* Respecter les préférences "moins d'animations" */
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
    html{ scroll-behavior: auto; }
  }

  /* ==========================================================================
     2. STRUCTURE GÉNÉRALE / EN-TÊTE / BOUTON DE THÈME
     ========================================================================== */
  #app{ max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; position: relative; }

  .page[hidden]{ display: none; }

  .theme-toggle{
    position: fixed;
    top: 18px; right: 18px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    box-shadow: var(--shadow-card);
  }
  .theme-toggle:hover{ border-color: var(--color-accent); }
  .theme-toggle .icon{ font-size: 0.9rem; }

  .site-header{ margin-bottom: 36px; padding-right: 120px; }
  .site-header .eyebrow{
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
  }
  .site-header h1{
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 600;
    margin-top: 6px;
  }
  .site-header p.subtitle{
    color: var(--color-text-muted);
    max-width: 560px;
    margin-top: 8px;
    font-size: 1.02rem;
  }

  /* ==========================================================================
     3. GRILLE + CARTES DE LA PAGE "CATALOGUE"
     Chaque carte imite une fiche de bibliothèque perforée :
     - un petit "trou" en haut (perforation)
     - un numéro de catalogue façon machine à écrire
     - une barre de couleur ("tranche du livre") qui code la catégorie
     ========================================================================== */
  .book-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }

  .book-card{
    position: relative;
    display: block;
    background: var(--color-surface);
    color: var(--color-text);
    border-radius: var(--radius);
    padding: 26px 20px 18px;
    border-left: 6px solid var(--spine-color, var(--color-accent));
    box-shadow: var(--shadow-card);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .book-card:hover, .book-card:focus-visible{
    transform: translateY(-3px);
    box-shadow: var(--shadow-card), 0 0 0 1px var(--color-border);
  }

  /* La "perforation" : un petit cercle qui semble découpé dans le papier */
  .punch-hole{
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--color-bg);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }

  .catalog-number{
    position: absolute;
    top: 12px; right: 16px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--color-text-muted);
  }

  .tag{
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    padding: 3px 8px;
    border-radius: 2px;
    margin-bottom: 12px;
  }

  .book-title{
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .book-author{
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 12px;
  }
  .book-teaser{
    font-size: 0.92rem;
    color: var(--color-text-muted);
  }

  .card-footer{
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--color-text-muted);
    border-top: 1px dashed var(--color-border);
    padding-top: 10px;
    margin-top: 8px;
  }

  /* ==========================================================================
     4. PAGE "FICHE DÉTAIL"
     ========================================================================== */
  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--color-accent);
    margin-bottom: 26px;
  }
  .back-link:hover{ text-decoration: underline; }

  .detail-header{ padding-right: 120px; }
  .detail-header h1{
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    font-weight: 600;
  }
  .detail-header p{
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--color-accent);
    margin-top: 8px;
  }

  /* -- Mise en page à deux colonnes : sommaire (gauche) + contenu (droite) -- */
  .detail-layout{
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 48px;
    align-items: start;
    margin-top: 32px;
  }

  .detail-toc{
    position: sticky;
    top: 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 2px solid var(--color-border);
    padding-left: 16px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }
  .detail-toc .toc-label{
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    margin-bottom: 8px;
  }
  .toc-link{
    font-family: var(--font-mono);
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--color-text-muted);
    padding: 6px 0 6px 14px;
    margin-left: -16px;
    border-left: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .toc-link:hover{ color: var(--color-text); }
  .toc-link.active{
    color: var(--color-accent);
    border-left-color: var(--color-accent);
    font-weight: 600;
  }

  .detail-content{ min-width: 0; }

  /* -- Une section de contenu : la vue d'ensemble, ou un chapitre -- */
  .content-section{
    margin-bottom: 56px;
    scroll-margin-top: 24px; /* pour que l'ancrage ne colle pas en haut de l'écran */
  }
  .content-section:last-child{ margin-bottom: 0; }

  .content-section h2{
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 22px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }

  .chapter-number{
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--color-accent);
    flex-shrink: 0;
  }

  /* -- Un bloc de contenu générique (grandes idées, actions...) -- */
  .content-block{ margin-bottom: 26px; }
  .content-block:last-child{ margin-bottom: 0; }

  .block-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .block-header h3, .block-header h4{
    font-size: 0.82rem;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-muted);
    font-weight: 500;
  }

  .copy-btn{
    background: transparent;
    border: 1px solid var(--color-accent);
    color: var(--color-accent);
    font-size: 0.7rem;
    padding: 5px 10px;
    border-radius: 20px;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .copy-btn:hover{ background: var(--color-accent); color: var(--color-bg); }
  .copy-btn.copied{ background: #4b7a5b; border-color: #4b7a5b; color: #fff; }

  /* -- Texte "de lecture" : largeur de ligne et interligne pensés pour lire
        confortablement des paragraphes (≈65-70 caractères par ligne) -- */
  .prose{
    max-width: 68ch;
    font-size: 1.08rem;
    line-height: 1.7;
    color: var(--color-text);
  }

  .action-list{ font-size: 1rem; max-width: 68ch; line-height: 1.6; }
  .action-list li{ margin-bottom: 8px; }
  .action-list li:last-child{ margin-bottom: 0; }

  /* ==========================================================================
     5. RESPONSIVE (petits écrans)
     ========================================================================== */
  @media (max-width: 900px){
    .detail-layout{ grid-template-columns: 1fr; gap: 8px; }
    .detail-toc{
      position: static;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px 16px;
      border-left: none;
      padding-left: 0;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 16px;
      margin-bottom: 8px;
      max-height: none;
      overflow: visible;
    }
    .detail-toc .toc-label{ width: 100%; margin-bottom: 2px; }
    .toc-link{
      margin-left: 0;
      padding: 4px 0;
      border-left: none;
      border-bottom: 2px solid transparent;
    }
    .toc-link.active{ border-left: none; border-bottom-color: var(--color-accent); }
  }

  @media (max-width: 640px){
    #app{ padding: 22px 16px 60px; }
    .site-header, .detail-header{ padding-right: 0; }
    .theme-toggle{ padding: 8px 10px; }
    .theme-toggle .label{ display: none; }
  }
</style>
</head>

<body>

  <div id="app">

    <!-- Bouton de bascule thème sombre / thème clair. Le texte et l'icône
         sont mis à jour par JavaScript (fonction applyTheme). -->
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Changer de thème">
      <span class="icon" id="theme-toggle-icon">☀️</span>
      <span class="label" id="theme-toggle-label">Mode clair</span>
    </button>

    <!-- ======================================================================
         PAGE 1 : LE CATALOGUE (liste des cartes)
         ====================================================================== -->
    <section id="page-list" class="page">
      <header class="site-header">
        <div class="eyebrow">Ma bibliothèque de résumés</div>
        <h1>Catalogue de livres</h1>
        <p class="subtitle">Cliquez sur une fiche pour ouvrir les grandes idées,
          le résumé chapitre par chapitre, et les actions à mettre en œuvre.</p>
      </header>

      <!-- Les cartes sont générées automatiquement par JavaScript
           à partir des données du tableau "books" (voir <script> plus bas).
           Vous n'avez pas besoin d'écrire de HTML ici. -->
      <div id="book-grid" class="book-grid"></div>
    </section>

    <!-- ======================================================================
         PAGE 2 : LA FICHE DÉTAIL D'UN LIVRE
         Page unique et continue : vue d'ensemble + tous les chapitres,
         avec un sommaire ancré sur le côté (rempli par JavaScript).
         ====================================================================== -->
    <section id="page-detail" class="page" hidden>

      <a href="#/" class="back-link">← Retour au catalogue</a>

      <header class="detail-header">
        <h1 id="detail-title">Titre du livre</h1>
        <p id="detail-author">Auteur</p>
      </header>

      <div class="detail-layout">
        <nav class="detail-toc" id="detail-toc" aria-label="Sommaire du livre">
          <!-- Rempli par JavaScript : un lien vers la vue d'ensemble,
               puis un lien par chapitre. -->
        </nav>
        <div class="detail-content" id="detail-content">
          <!-- Rempli par JavaScript : la section "vue d'ensemble",
               puis une section par chapitre. -->
        </div>
      </div>

    </section>

  </div>


<script>
/* ============================================================================
   1. DONNÉES — VOS LIVRES
   ============================================================================
   C'est LA seule section que vous avez vraiment besoin de modifier.

   GUIDE RAPIDE POUR AJOUTER UN LIVRE
   -----------------------------------
   1. Copiez un bloc "{ ... }" existant ci-dessous (par exemple celui de
      "b1"), collez-le juste avant le "];" qui ferme le tableau "books".
   2. Changez "id" pour une valeur unique (ex: "b6", "b7"...).
   3. Remplissez chaque champ avec le contenu de votre livre.
   4. Enregistrez le fichier et rafraîchissez la page dans le navigateur :
      la nouvelle carte apparaît automatiquement dans le catalogue.

   RAPPEL DES RÈGLES DE CONTENU
   -----------------------------
   - summary.topActions   → exactement 3 actions (les plus importantes du livre)
   - chapters[].actions    → autant d'actions que pertinent (1 à 5 conseillé)
   - chapters              → AUCUNE limite de nombre : mettez autant de
     chapitres que le livre en compte réellement (1 seul comme 20).
   - "category" sert uniquement à choisir une couleur (voir CATEGORY_COLORS
     un peu plus bas). Vous pouvez réutiliser une catégorie existante ou
     en inventer une nouvelle.
   ============================================================================ */

  const books = [

    // ------------------------------------------------------------------------
    // LIVRE 1
    // ------------------------------------------------------------------------
    {
      id: "b1",                                   // identifiant unique (sans espace)
      title: "Le Pouvoir des habitudes",           // titre
      author: "James Clear",                       // auteur
      year: 2018,                                  // année (facultatif)
      category: "Développement personnel",         // sert à colorer la carte
      teaser: "Comment des ajustements minuscules, répétés, finissent par transformer des résultats entiers.",

      summary: {
        // Le paragraphe des "grandes idées" : une vue d'ensemble du livre.
        ideas: "L'idée centrale du livre est que les résultats qu'on obtient dans la vie sont surtout la conséquence de petites habitudes répétées, bien plus que de décisions ponctuelles spectaculaires. L'auteur propose de raisonner en systèmes plutôt qu'en objectifs : au lieu de se fixer un but, il vaut mieux construire un environnement et des routines qui rendent le bon comportement facile et automatique. Chaque habitude est décrite comme une boucle en quatre temps (signal, envie, réponse, récompense), et changer une habitude consiste à agir sur l'un de ces quatre maillons.",

        // Exactement 3 actions : les plus importantes à retenir du livre entier.
        topActions: [
          "Rendre visible le signal déclencheur de la bonne habitude (ex : préparer ses affaires de sport la veille).",
          "Réduire au minimum les frictions pour démarrer la bonne habitude (règle des deux minutes).",
          "Suivre visuellement sa régularité (ex : cocher un calendrier) pour renforcer la motivation."
        ]
      },

      // Un résumé + des actions PAR CHAPITRE (autant de chapitres que nécessaire).
      chapters: [
        {
          title: "La surprenante puissance des petites habitudes",
          summary: "Ce chapitre pose l'idée que des progrès de 1% par jour, cumulés, produisent des changements considérables sur le long terme. L'auteur insiste sur le fait que les résultats sont souvent invisibles au début, ce qui décourage beaucoup de gens avant que les effets ne deviennent visibles.",
          actions: [
            "Choisir UNE habitude à améliorer plutôt que plusieurs en même temps.",
            "Accepter que les premiers résultats seront invisibles pendant plusieurs semaines."
          ]
        },
        {
          title: "Comment vos habitudes façonnent votre identité",
          summary: "L'auteur distingue les changements de résultats, de processus et d'identité. Il défend l'idée que les habitudes les plus durables sont celles qui s'appuient sur l'image qu'on a de soi-même, et non uniquement sur un objectif extérieur.",
          actions: [
            "Reformuler ses objectifs en termes d'identité (« je suis quelqu'un qui... » plutôt que « je veux... »).",
            "Choisir de petites preuves quotidiennes de cette identité (ex : une page lue = « je suis un lecteur »)."
          ]
        },
        {
          title: "Comment se former une bonne habitude en quatre étapes simples",
          summary: "Ce chapitre détaille la boucle signal → envie → réponse → récompense, et explique comment agir sur chacune de ces étapes pour installer une nouvelle habitude durablement.",
          actions: [
            "Rendre le signal évident (ex : poser le livre sur l'oreiller).",
            "Rendre l'action attirante en l'associant à quelque chose d'agréable.",
            "Rendre la récompense immédiate, même petite, pour renforcer la boucle."
          ]
        }
      ]
    },

    // ------------------------------------------------------------------------
    // LIVRE 2
    // ------------------------------------------------------------------------
    {
      id: "b2",
      title: "Sapiens",
      author: "Yuval Noah Harari",
      year: 2015,
      category: "Histoire",
      teaser: "Une traversée de l'histoire de l'espèce humaine, des origines à aujourd'hui, à travers trois grandes révolutions.",

      summary: {
        ideas: "Le livre retrace l'histoire de l'humanité à travers trois grandes révolutions : cognitive, agricole et scientifique. L'auteur défend l'idée que la spécificité de notre espèce n'est pas seulement l'intelligence individuelle, mais la capacité à croire collectivement à des « fictions » partagées (monnaie, nations, religions, entreprises), ce qui permet une coopération à très grande échelle entre inconnus. Cette capacité explique, selon lui, la domination de l'espèce humaine sur les autres espèces et sur son environnement.",

   ============================================================================ */

  /**
   * Copie un texte dans le presse-papiers, et affiche un petit retour visuel
   * sur le bouton cliqué ("✓ Copié").
   * Utilise l'API moderne du navigateur si disponible (nécessite https ou
   * localhost), sinon bascule automatiquement sur une méthode de secours
   * qui fonctionne aussi quand le fichier est ouvert directement (file://).
   */
  function copyToClipboard(text, btnEl){
    function showFeedback(success){
      const original = btnEl.textContent;
      btnEl.textContent = success ? "✓ Copié" : "Échec de la copie";
      btnEl.classList.toggle("copied", success);
      setTimeout(() => {
        btnEl.textContent = original;
        btnEl.classList.remove("copied");
      }, 1500);
    }

    function fallbackCopy(){
      // Méthode de secours : on crée un champ de texte invisible,
      // on sélectionne son contenu, puis on utilise la commande
      // "copier" historique du navigateur.
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try{
        document.execCommand("copy");
        showFeedback(true);
      }catch(err){
        showFeedback(false);
      }
      document.body.removeChild(textarea);
    }

    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(
        () => showFeedback(true),
        () => fallbackCopy()
      );
    } else {
      fallbackCopy();
    }
  }

  /**
   * Gestion du thème clair / sombre.
   * Le choix vit uniquement en mémoire JavaScript (pas de stockage local) :
   * à chaque ouverture du fichier, on repart du thème sombre par défaut.
   */
  let currentTheme = "dark";

  function applyTheme(theme){
    currentTheme = theme;
    if (theme === "light"){
      document.documentElement.setAttribute("data-theme", "light");
      document.getElementById("theme-toggle-icon").textContent = "🌙";
      document.getElementById("theme-toggle-label").textContent = "Mode sombre";
    } else {
      document.documentElement.removeAttribute("data-theme");
      document.getElementById("theme-toggle-icon").textContent = "☀️";
      document.getElementById("theme-toggle-label").textContent = "Mode clair";
    }
  }

  document.getElementById("theme-toggle").addEventListener("click", () => {
    applyTheme(currentTheme === "dark" ? "light" : "dark");
  });


/* ============================================================================
   3. RENDU DE LA PAGE "CATALOGUE" (liste de cartes)
   ============================================================================ */

  function renderBookList(){
    const grid = document.getElementById("book-grid");
    grid.innerHTML = ""; // on repart d'une grille vide

    books.forEach((book, index) => {
      const spineColor = CATEGORY_COLORS[book.category] || CATEGORY_COLORS.default;

      // On construit la carte comme un lien <a> : cliquer dessus change
      // simplement l'URL (le "#/livre/xxx"), ce qui déclenche le routeur.
      const card = document.createElement("a");
      card.href = `#/livre/${book.id}`;
      card.className = "book-card";
      card.style.setProperty("--spine-color", spineColor);

      // Numéro de catalogue façon "N° 001", basé sur la position dans la liste.
      const catalogNumber = String(index + 1).padStart(3, "0");

      card.innerHTML = `
        <span class="punch-hole" aria-hidden="true"></span>
        <span class="catalog-number">N° ${catalogNumber}</span>
        <span class="tag" style="background:${spineColor}">${book.category}</span>
        <h2 class="book-title">${book.title}</h2>
        <p class="book-author">${book.author}${book.year ? " · " + book.year : ""}</p>
        <p class="book-teaser">${book.teaser}</p>
        <div class="card-footer">
          <span>${book.chapters.length} chapitre${book.chapters.length > 1 ? "s" : ""}</span>
          <span>🎯 ${book.summary.topActions.length} actions clés</span>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  function renderDetailContent(book){
    const container = document.getElementById("detail-content");

    const overviewHtml = `
      <section class="content-section" id="section-overview">
        <h2>💡 Vue d'ensemble</h2>

        <div class="content-block">
          <div class="block-header">
            <h3>Les grandes idées</h3>
            <button type="button" class="copy-btn" data-action="copy-ideas">📋 Copier</button>
          </div>
          <p class="prose ideas-text">${book.summary.ideas}</p>
        </div>

        <div class="content-block">
          <div class="block-header">
            <h3>🎯 Top 3 actions à mettre en œuvre</h3>
            <button type="button" class="copy-btn" data-action="copy-top-actions">📋 Copier la liste</button>
          </div>
          <ol class="action-list">
            ${book.summary.topActions.map(action => `<li>${action}</li>`).join("")}
          </ol>
        </div>
      </section>
    `;

    const chaptersHtml = book.chapters.map((chapter, index) => `
      <section class="content-section chapter-section" id="section-chapter-${index}">
        <h2><span class="chapter-number">Chap. ${index + 1}</span> ${chapter.title}</h2>

        <div class="content-block">
          <div class="block-header">
            <h4>Résumé</h4>
            <button type="button" class="copy-btn" data-copy-summary="${index}">📋 Copier</button>
          </div>
          <p class="prose">${chapter.summary}</p>
        </div>

        <div class="content-block">
          <div class="block-header">
            <h4>Actions</h4>
            <button type="button" class="copy-btn" data-copy-actions="${index}">📋 Copier</button>
          </div>
          <ul class="action-list">
            ${chapter.actions.map(action => `<li>${action}</li>`).join("")}
          </ul>
        </div>
      </section>
    `).join("");

    container.innerHTML = overviewHtml + chaptersHtml;

    // -- Boutons "copier" de la vue d'ensemble --
    container.querySelector('[data-action="copy-ideas"]').addEventListener("click", (event) => {
      copyToClipboard(book.summary.ideas, event.currentTarget);
    });
    container.querySelector('[data-action="copy-top-actions"]').addEventListener("click", (event) => {
      const text = book.summary.topActions
        .map((action, i) => `${i + 1}. ${action}`)
        .join("\n");
      copyToClipboard(text, event.currentTarget);
    });

    // -- Boutons "copier" de chaque chapitre --
    book.chapters.forEach((chapter, index) => {
      container.querySelector(`[data-copy-summary="${index}"]`).addEventListener("click", (event) => {
        copyToClipboard(chapter.summary, event.currentTarget);
      });
      container.querySelector(`[data-copy-actions="${index}"]`).addEventListener("click", (event) => {
        const text = chapter.actions.map((action, i) => `${i + 1}. ${action}`).join("\n");
        copyToClipboard(text, event.currentTarget);
      });
    });
  }

  /** Construit le sommaire cliquable (vue d'ensemble + un lien par chapitre). */
  function renderDetailToc(book){
    const toc = document.getElementById("detail-toc");

    const overviewLink = `<a href="#section-overview" class="toc-link" data-target="section-overview">Vue d'ensemble</a>`;
    const chapterLinks = book.chapters.map((chapter, index) =>
      `<a href="#section-chapter-${index}" class="toc-link" data-target="section-chapter-${index}">${index + 1}. ${chapter.title}</a>`
    ).join("");

    toc.innerHTML = `<span class="toc-label">Sommaire</span>${overviewLink}${chapterLinks}`;

    // On intercepte le clic pour faire défiler la page vers la section
    // SANS modifier le hash de l'URL (qui sert au routeur pour savoir
    // quel livre afficher : on ne veut pas le perturber).
    toc.querySelectorAll(".toc-link").forEach(link => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        const target = document.getElementById(link.dataset.target);
        if (target){
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    });
  }

  /**
   * Met en surbrillance, dans le sommaire, le lien correspondant à la
   * section actuellement visible à l'écran pendant que l'utilisateur lit.
   */
  function setupScrollSpy(){
    if (sectionObserver){
      sectionObserver.disconnect();
    }

    const sections = document.querySelectorAll("#detail-content .content-section");
    const tocLinks = document.querySelectorAll("#detail-toc .toc-link");

    if (!sections.length) return;

    sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting){
          tocLinks.forEach(link => {
            link.classList.toggle("active", link.dataset.target === entry.target.id);
          });
        }
      });
    }, { rootMargin: "-15% 0px -70% 0px", threshold: 0 });

    sections.forEach(section => sectionObserver.observe(section));
  }


/* ============================================================================
   5. ROUTAGE — décide quelle "page" afficher selon l'URL (#...)
   ============================================================================
   On utilise le "hash" de l'URL (la partie après le #) pour savoir si on
   doit afficher le catalogue ou la fiche d'un livre précis.
   Exemple : ouvrir "...#/livre/b2" affiche directement la fiche de "b2".
   Cela permet aussi d'utiliser le bouton "Précédent" du navigateur.
   Important : les liens du sommaire (#section-overview, #section-chapitre-N)
   n'utilisent PAS ce mécanisme — voir renderDetailToc plus haut.
   ============================================================================ */

  function showPage(pageName){
    document.getElementById("page-list").hidden   = pageName !== "list";
    document.getElementById("page-detail").hidden = pageName !== "detail";
    window.scrollTo(0, 0);
  }

  function router(){
    const hash = window.location.hash; // ex : "#/livre/b1"
    const match = hash.match(/^#\/livre\/(.+)$/);

    if (match){
      const bookId = decodeURIComponent(match[1]);
      const book = books.find(b => b.id === bookId);
      if (book){
        showPage("detail");
        renderBookDetail(book);
        return;
      }
    }

    // Par défaut (ou si le livre demandé n'existe pas) : on affiche la liste.
    showPage("list");
  }

  // On réagit à chaque changement d'URL (clic sur une carte, bouton retour...)
  window.addEventListener("hashchange", router);

  // Au premier chargement de la page : on construit la liste, puis on
  // regarde l'URL actuelle pour savoir quelle page afficher.
  window.addEventListener("DOMContentLoaded", () => {
    renderBookList();
    router();
  });

</script>
