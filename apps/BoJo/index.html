<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon Bullet Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ivory:#F9F6F0;--ivory-dark:#EDE8DF;--ink:#2C2416;--ink-light:#6B5E4A;--ocre:#C4873A;--ocre-light:#E8C490;--sage:#7A9E7E;--slate:#5B7FA6;--brick:#B85C4A;--paper:#FDFAF5;}
body{font-family:'Inter',sans-serif;background:#D6CFC3;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px;background-image:radial-gradient(ellipse at top left,#C9C2B5 0%,transparent 50%),radial-gradient(ellipse at bottom right,#BFB8AA 0%,transparent 50%);}
#root{width:100%;max-width:1140px;}
.journal{display:flex;background:var(--ink);border-radius:4px 14px 14px 4px;box-shadow:-4px 0 0 #1a140d,10px 10px 40px rgba(0,0,0,.45);min-height:720px;}
.spine{width:34px;background:linear-gradient(180deg,#1a140d,#2C2416 50%,#1a140d);border-radius:4px 0 0 4px;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:16px;flex-shrink:0;}
.ring{width:18px;height:18px;border-radius:50%;border:3px solid #8B7355;background:#2C2416;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
.sidebar{width:196px;background:linear-gradient(180deg,#3D3020,#2C2416);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-brand{font-family:'Playfair Display',serif;font-style:italic;color:var(--ocre-light);font-size:18px;padding:20px 18px 16px;border-bottom:1px solid rgba(196,135,58,.2);line-height:1.3;}
.sidebar-brand small{display:block;font-size:10px;font-style:normal;font-family:'Inter',sans-serif;color:var(--ink-light);margin-top:3px;letter-spacing:.1em;text-transform:uppercase;}
.sec-label{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#5A4D3A;padding:12px 18px 4px;font-weight:600;}
.nav-btn{display:flex;align-items:center;gap:9px;padding:8px 18px;background:none;border:none;border-left:3px solid transparent;cursor:pointer;color:#A89880;font-family:'Inter',sans-serif;font-size:13px;text-align:left;transition:all .15s;width:100%;}
.nav-btn:hover{background:rgba(196,135,58,.1);color:var(--ocre-light);}
.nav-btn.active{background:rgba(196,135,58,.18);color:var(--ocre-light);border-left-color:var(--ocre);font-weight:500;}
.nav-btn .ni{font-size:14px;width:17px;text-align:center;flex-shrink:0;}
.sidebar-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(196,135,58,.15);font-size:10px;color:#5A4D3A;font-family:'JetBrains Mono',monospace;}
.page{flex:1;background:var(--paper);border-radius:0 14px 14px 0;display:flex;flex-direction:column;background-image:repeating-linear-gradient(transparent,transparent 27px,#E8E0D4 27px,#E8E0D4 28px);background-position:0 54px;overflow:hidden;}
.page-head{background:var(--paper);padding:18px 30px 14px;border-bottom:2px solid var(--ocre);background-image:none;flex-shrink:0;}
.page-head h1{font-family:'Playfair Display',serif;font-size:24px;color:var(--ink);}
.page-head p{font-size:11px;color:var(--ink-light);margin-top:2px;letter-spacing:.04em;}
.page-body{flex:1;overflow-y:auto;padding:22px 30px 32px;}
.page-body::-webkit-scrollbar{width:5px;}
.page-body::-webkit-scrollbar-thumb{background:var(--ivory-dark);border-radius:3px;}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
.b-page{background:rgba(44,36,22,.1);color:var(--ink-light);font-family:'JetBrains Mono',monospace;}
.bullet-list{list-style:none;}
.bi{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.04);font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);}
.bi.done .bi-text{text-decoration:line-through;color:var(--ink-light);}
.bi-sym{font-size:14px;line-height:1.5;min-width:18px;text-align:center;cursor:pointer;user-select:none;}
.bi-text{flex:1;cursor:pointer;line-height:1.55;}
.bi-del{opacity:0;background:none;border:none;cursor:pointer;color:var(--brick);font-size:17px;padding:0 3px;transition:opacity .15s;}
.bi:hover .bi-del{opacity:1;}
.add-row{display:flex;gap:8px;margin-top:14px;align-items:center;background:rgba(255,255,255,.5);border:1px dashed var(--ivory-dark);border-radius:6px;padding:7px 10px;}
.add-row select{font-family:'JetBrains Mono',monospace;font-size:14px;background:none;border:none;color:var(--ink-light);cursor:pointer;outline:none;}
.add-row input{flex:1;background:none;border:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);}
.add-row input::placeholder{color:#BBA98A;}
.add-row button{background:var(--ocre);color:#fff;border:none;border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;}
.add-row button:hover{background:#B07830;}
.st{font-family:'Playfair Display',serif;font-size:16px;color:var(--ink);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.st::after{content:'';flex:1;height:1px;background:var(--ivory-dark);}
.idx-table{width:100%;border-collapse:collapse;margin-top:8px;}
.idx-table th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);padding:6px 10px;border-bottom:2px solid var(--ink);}
.idx-table td{padding:8px 10px;border-bottom:1px solid var(--ivory-dark);font-size:13px;color:var(--ink);transition:all .15s;}
.idx-table tr{cursor:pointer;}
.idx-table tr:hover td{background:rgba(196,135,58,.07);color:var(--ocre);}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px;}
.month-card{background:#fff;border-radius:8px;padding:14px;border:1px solid var(--ivory-dark);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.month-card h3{font-family:'Playfair Display',serif;font-size:14px;color:var(--ink);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--ivory-dark);}
.m-evt{font-size:12px;font-family:'JetBrains Mono',monospace;padding:3px 0;color:var(--ink-light);border-bottom:1px dotted #EDE8DF;display:flex;gap:5px;align-items:center;}
.m-evt-del{background:none;border:none;cursor:pointer;color:var(--brick);opacity:.4;font-size:13px;margin-left:auto;}
.m-evt-del:hover{opacity:1;}
.m-add{margin-top:6px;width:100%;background:none;border:1px dashed #DDD;border-radius:4px;padding:4px 8px;font-size:11px;color:var(--ink-light);cursor:pointer;font-family:'Inter',sans-serif;text-align:left;transition:all .15s;}
.m-add:hover{border-color:var(--ocre);color:var(--ocre);}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.cal-nav span{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink);flex:1;text-align:center;}
.cal-btn{background:none;border:1px solid var(--ivory-dark);border-radius:5px;padding:4px 11px;cursor:pointer;font-size:15px;color:var(--ink-light);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;}
.cal-dh{text-align:center;font-size:9px;font-weight:600;color:var(--ink-light);letter-spacing:.05em;text-transform:uppercase;padding:4px 0;}
.cal-cell{background:#fff;border:1.5px solid var(--ivory-dark);border-radius:6px;min-height:68px;padding:5px;cursor:pointer;transition:all .15s;}
.cal-cell:hover{border-color:var(--ocre);box-shadow:0 0 0 2px rgba(196,135,58,.1);}
.cal-cell.today{border-color:var(--ocre);background:rgba(196,135,58,.05);}
.cal-cell.empty{background:var(--ivory);opacity:.35;pointer-events:none;}
.cal-dn{font-size:10px;font-weight:600;color:var(--ink-light);margin-bottom:3px;}
.cal-ev{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--slate);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sport-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 16px;}
.sport-day{text-align:center;padding:8px 3px;border-radius:8px;border:1.5px solid var(--ivory-dark);cursor:pointer;transition:all .15s;background:#fff;}
.sport-day.on{background:var(--sage);border-color:var(--sage);}
.sport-day .sd-l{font-size:9px;color:var(--ink-light);text-transform:uppercase;letter-spacing:.04em;}
.sport-day.on .sd-l,.sport-day.on .sd-v{color:#fff;}
.sport-day .sd-i{font-size:20px;margin:4px 0;}
.sport-day .sd-v{font-size:9px;color:var(--ink-light);font-family:'JetBrains Mono',monospace;}
.prog-bar{height:11px;background:var(--ivory-dark);border-radius:6px;overflow:hidden;margin-top:8px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sage),#5A8C5E);border-radius:6px;transition:width .4s;}
.glasses{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.glass{font-size:26px;cursor:pointer;opacity:.22;filter:grayscale(100%);transition:all .2s;user-select:none;}
.glass.on{opacity:1;filter:grayscale(0%);}
.glass:hover{transform:scale(1.1);}
.sleep-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
.sleep-lbl{font-size:11px;color:var(--ink-light);width:26px;font-family:'JetBrains Mono',monospace;}
.sleep-bg{flex:1;height:14px;background:var(--ivory-dark);border-radius:7px;overflow:hidden;cursor:pointer;}
.sleep-fill{height:100%;background:linear-gradient(90deg,var(--slate),#7AADD4);border-radius:7px;transition:width .25s;}
.sleep-val{font-size:11px;color:var(--ink-light);width:28px;text-align:right;font-family:'JetBrains Mono',monospace;}
.exp-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted var(--ivory-dark);font-size:12px;}
.exp-cat{font-size:15px;width:20px;text-align:center;}
.exp-desc{flex:1;color:var(--ink);}
.exp-amt{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--brick);}
.exp-del{background:none;border:none;cursor:pointer;color:var(--brick);opacity:.4;font-size:14px;margin-left:6px;}
.exp-del:hover{opacity:1;}
.add-exp{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.add-exp input,.add-exp select{flex:1;min-width:60px;padding:5px 8px;border:1px solid var(--ivory-dark);border-radius:5px;font-size:12px;font-family:'Inter',sans-serif;outline:none;color:var(--ink);background:#fff;}
.add-exp button{background:var(--brick);color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer;}
.habit-row{margin-bottom:14px;}
.habit-hd{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;color:var(--ink);font-weight:500;}
.habit-hd span{font-size:11px;color:var(--ink-light);font-family:'JetBrains Mono',monospace;font-weight:400;}
.habit-days{display:flex;gap:4px;flex-wrap:wrap;}
.hd{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--ivory-dark);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;background:#fff;user-select:none;}
.hd.on{background:var(--sage);border-color:var(--sage);color:#fff;}
.hd:hover:not(.on){border-color:var(--sage);background:rgba(122,158,126,.1);}
.hap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.hap-dh{text-align:center;font-size:9px;font-weight:600;color:var(--ink-light);letter-spacing:.05em;text-transform:uppercase;padding:3px 0;}
.hap-cell{background:#fff;border:1.5px solid var(--ivory-dark);border-radius:7px;padding:5px 3px;text-align:center;min-height:72px;}
.hap-cell.today-h{border-color:var(--ocre);}
.hap-dn{font-size:9px;color:var(--ink-light);margin-bottom:3px;font-weight:500;}
.hap-dn.td{color:var(--ocre);font-weight:700;}
.mood-btn{font-size:12px;cursor:pointer;opacity:.2;transition:all .15s;display:block;line-height:1.3;user-select:none;}
.mood-btn.sel{opacity:1;transform:scale(1.15);}
.mood-btn:hover{opacity:.7;}
.j-area{width:100%;min-height:320px;border:none;outline:none;background:transparent;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:28px;color:var(--ink);resize:none;padding:0;}
.j-wc{font-size:11px;color:var(--ink-light);text-align:right;margin-top:6px;font-family:'JetBrains Mono',monospace;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:var(--paper);border-radius:12px;padding:24px;min-width:310px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:14px;color:var(--ink);}
.modal input{width:100%;padding:8px 12px;border:1px solid var(--ivory-dark);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);outline:none;background:#fff;}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.modal-acts button{padding:7px 18px;border-radius:6px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;}
.btn-cancel{background:var(--ivory-dark);color:var(--ink-light);}
.btn-save{background:var(--ocre);color:#fff;}
.info-box{margin-top:18px;padding:12px 16px;background:rgba(196,135,58,.07);border-radius:8px;border-left:3px solid var(--ocre);font-size:12px;color:var(--ink-light);line-height:1.7;}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
const h = React.createElement;
const {useState} = React;

const MONTHS=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];
const MONTHS_FR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MOODS=['😞','😕','😐','🙂','😄'];
const HABIT_LIST=[{id:'lecture',label:'📚 Lecture'},{id:'meditation',label:'🧘 Méditation'},{id:'sport',label:'🏃 Sport'},{id:'journal',label:'✍️ Journal'},{id:'gratitude',label:'🙏 Gratitude'}];
const EXPENSE_CATS=['🍽️','🚗','🏠','🛍️','💊','🎭','📚','✈️','💡','❓'];
const NAV=[
  {id:'index',label:'Index',icon:'📋',sec:'Structure'},
  {id:'future',label:'Future Log',icon:'🗓️',sec:'Structure'},
  {id:'monthly',label:'Monthly Log',icon:'📅',sec:'Logs'},
  {id:'daily',label:'Daily Log',icon:'✏️',sec:'Logs'},
  {id:'journal',label:'Journal',icon:'📖',sec:'Logs'},
  {id:'sport',label:'Sport',icon:'🏃',sec:'Trackers'},
  {id:'water',label:'Hydratation',icon:'💧',sec:'Trackers'},
  {id:'sleep',label:'Sommeil',icon:'🌙',sec:'Trackers'},
  {id:'expenses',label:'Dépenses',icon:'💶',sec:'Trackers'},
  {id:'habits',label:'Habitudes',icon:'🌱',sec:'Trackers'},
  {id:'happiness',label:'Bonheur',icon:'☀️',sec:'Trackers'},
];
const PAGE_NUM={index:'—',future:'1',monthly:'8',daily:'12',journal:'15',sport:'20',water:'21',sleep:'22',expenses:'23',habits:'24',happiness:'25'};
const now=new Date();
const TODAY=now.getDate(), T_MONTH=now.getMonth(), T_YEAR=now.getFullYear();

function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function firstDayOfMonth(y,m){let d=new Date(y,m,1).getDay();return d===0?6:d-1;}

const initDaily=[
  {id:1,sym:'•',text:'Acheter des croquettes pour le chat',done:false},
  {id:2,sym:'○',text:'Rendez-vous chez le dentiste à 14h',done:false},
  {id:3,sym:'–',text:'Nouveau restaurant à tester : Le Zinc',done:false},
];
const initMonthGoals=[
  {id:1,sym:'•',text:'Terminer le livre sur le stoïcisme',done:false},
  {id:2,sym:'•',text:'Courir 3 fois par semaine',done:false},
  {id:3,sym:'–',text:'Mois de la créativité',done:false},
];
const initFuture={};
MONTHS.forEach(function(_,i){initFuture[i]=i===0?['Vacances à Lyon']:i===1?['Anniversaire Maman']:[];});
const initHabits={};
HABIT_LIST.forEach(function(hab){initHabits[hab.id]=Array(31).fill(false);});
const initMoods={};
for(var i=1;i<=31;i++)initMoods[i]=null;

// Modal
function Modal(props){
  var title=props.title, placeholder=props.placeholder, onSave=props.onSave, onClose=props.onClose;
  var _s=useState(''); var val=_s[0]; var setVal=_s[1];
  return h('div',{className:'overlay',onClick:function(ev){if(ev.target===ev.currentTarget)onClose();}},
    h('div',{className:'modal'},
      h('h3',null,title),
      h('input',{autoFocus:true,value:val,placeholder:placeholder||'Saisir…',
        onChange:function(ev){setVal(ev.target.value);},
        onKeyDown:function(ev){if(ev.key==='Enter'){onSave(val);onClose();}if(ev.key==='Escape')onClose();}}),
      h('div',{className:'modal-acts'},
        h('button',{className:'btn-cancel',onClick:onClose},'Annuler'),
        h('button',{className:'btn-save',onClick:function(){onSave(val);onClose();}},'Ajouter'))));
}

// BulletList
function BulletList(props){
  var entries=props.entries, onToggle=props.onToggle, onDelete=props.onDelete, onAdd=props.onAdd;
  var _t=useState(''); var txt=_t[0]; var setTxt=_t[1];
  var _s=useState('•'); var sym=_s[0]; var setSym=_s[1];
  function add(){if(!txt.trim())return;onAdd({sym:sym,text:txt.trim()});setTxt('');}
  return h('div',null,
    h('ul',{className:'bullet-list'},
      entries.map(function(en){
        return h('li',{key:en.id,className:'bi'+(en.done?' done':'')},
          h('span',{className:'bi-sym',onClick:function(){onToggle(en.id);}},en.done?'✕':en.sym),
          h('span',{className:'bi-text',onClick:function(){onToggle(en.id);}},en.text),
          h('button',{className:'bi-del',onClick:function(){onDelete(en.id);}},'×'));
      })),
    h('div',{className:'add-row'},
      h('select',{value:sym,onChange:function(ev){setSym(ev.target.value);}},
        h('option',{value:'•'},'• Tâche'),
        h('option',{value:'○'},'○ Événement'),
        h('option',{value:'–'},'– Note')),
      h('input',{value:txt,placeholder:'Nouvelle entrée…',onChange:function(ev){setTxt(ev.target.value);},
        onKeyDown:function(ev){if(ev.key==='Enter')add();}}),
      h('button',{onClick:add},'+ Ajouter')));
}

// INDEX
function IndexPage(props){
  var onNav=props.onNav;
  var descs={future:'Événements sur 12 mois',monthly:'Rendez-vous et objectifs',daily:'Tâches, événements, notes',journal:'Pensées et réflexions libres',sport:'Sessions hebdomadaires',water:'Hydratation quotidienne',sleep:'Heures de sommeil',expenses:'Budget et dépenses',habits:'Habitudes quotidiennes',happiness:'Humeur et bonheur'};
  return h('div',null,
    h('p',{style:{color:'var(--ink-light)',fontSize:13,marginBottom:16,fontStyle:'italic'}},'Table des matières — cliquez pour naviguer.'),
    h('table',{className:'idx-table'},
      h('thead',null,h('tr',null,h('th',null,'Section'),h('th',null,'Description'),h('th',null,'Page'))),
      h('tbody',null,NAV.filter(function(n){return n.id!=='index';}).map(function(n){
        return h('tr',{key:n.id,onClick:function(){onNav(n.id);}},
          h('td',null,n.icon+' '+n.label),
          h('td',{style:{color:'var(--ink-light)',fontSize:12}},descs[n.id]||''),
          h('td',null,h('span',{className:'badge b-page'},PAGE_NUM[n.id])));
      }))),
    h('div',{className:'info-box'},
      h('div',{style:{fontFamily:"'Playfair Display',serif",fontSize:13,color:'var(--ink)',marginBottom:6}},'Légende des symboles'),
      h('div',null,'• Tâche'),h('div',null,'○ Événement'),h('div',null,'– Note'),h('div',null,'✕ Terminée')));
}

// FUTURE LOG
function FuturePage(props){
  var data=props.data, setData=props.setData;
  var _m=useState(null); var modal=_m[0]; var setModal=_m[1];
  var months=Array.from({length:12},function(_,i){return (T_MONTH+i)%12;});
  function addEvt(m,txt){if(!txt.trim())return;setData(function(p){var n=Object.assign({},p);n[m]=(p[m]||[]).concat([txt]);return n;});}
  function delEvt(m,i){setData(function(p){var n=Object.assign({},p);n[m]=p[m].filter(function(_,j){return j!==i;});return n;});}
  return h('div',null,
    h('p',{style:{color:'var(--ink-light)',fontSize:13,marginBottom:14,fontStyle:'italic'}},'Vue 12 mois — notez vos grands événements.'),
    h('div',{className:'month-grid'},
      months.map(function(m){
        return h('div',{key:m,className:'month-card'},
          h('h3',null,MONTHS_FR[m]),
          (data[m]||[]).map(function(ev,i){

// MONTHLY LOG
function MonthlyPage(props){
  var goals=props.goals, setGoals=props.setGoals, calEvts=props.calEvts, setCalEvts=props.setCalEvts;
  var _vm=useState(T_MONTH); var vm=_vm[0]; var setVm=_vm[1];
  var _vy=useState(T_YEAR); var vy=_vy[0]; var setVy=_vy[1];
  var _mo=useState(null); var modal=_mo[0]; var setModal=_mo[1];
  var dim=daysInMonth(vy,vm);
  var fd=firstDayOfMonth(vy,vm);
  var cells=Array(fd).fill(null).concat(Array.from({length:dim},function(_,i){return i+1;}));
  while(cells.length%7!==0)cells.push(null);
  function prevM(){if(vm===0){setVm(11);setVy(function(y){return y-1;});}else setVm(function(m){return m-1;});}
  function nextM(){if(vm===11){setVm(0);setVy(function(y){return y+1;});}else setVm(function(m){return m+1;});}
  function addCalEvt(day,txt){if(!txt.trim())return;var k=vy+'-'+vm+'-'+day;setCalEvts(function(p){var n=Object.assign({},p);n[k]=(p[k]||[]).concat([txt]);return n;});}
  return h('div',null,
    h('div',{className:'cal-nav'},
      h('button',{className:'cal-btn',onClick:prevM},'‹'),
      h('span',null,MONTHS_FR[vm]+' '+vy),
      h('button',{className:'cal-btn',onClick:nextM},'›')),
    h('div',{className:'cal-grid'},
      DAYS.map(function(d){return h('div',{key:d,className:'cal-dh'},d);}),
      cells.map(function(day,i){
        var k=vy+'-'+vm+'-'+day;
        var evs=calEvts[k]||[];
        var isToday=day===TODAY&&vm===T_MONTH&&vy===T_YEAR;
        var cls='cal-cell'+(isToday?' today':'')+(day===null?' empty':'');
        return h('div',{key:i,className:cls,onClick:day?function(){setModal({day:day,k:k});}:undefined},
          day&&h('div',{className:'cal-dn'},day),
          evs.slice(0,2).map(function(ev,j){return h('div',{key:j,className:'cal-ev'},'○ '+ev);}),
          evs.length>2&&h('div',{className:'cal-ev',style:{color:'var(--ocre)'}},'+'+( evs.length-2)));
      })),
    h('div',{className:'st'},'Objectifs du mois'),
    h(BulletList,{entries:goals,
      onToggle:function(id){setGoals(function(p){return p.map(function(g){return g.id===id?Object.assign({},g,{done:!g.done}):g;});});},
      onDelete:function(id){setGoals(function(p){return p.filter(function(g){return g.id!==id;});});},
      onAdd:function(o){setGoals(function(p){return p.concat([{id:Date.now(),sym:o.sym,text:o.text,done:false}]);});}}),
    modal&&h(Modal,{title:modal.day+' '+MONTHS_FR[vm],placeholder:'Événement ou note…',onSave:function(txt){addCalEvt(modal.day,txt);},onClose:function(){setModal(null);}}));
}

// SLEEP
function SleepPage(props){
  var sleep=props.sleep, setSleep=props.setSleep;
  var MAX=10;
  var labels=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  var avg=(sleep.reduce(function(a,b){return a+b;},0)/sleep.length).toFixed(1);
  function click(i,ev){
    var rect=ev.currentTarget.getBoundingClientRect();
    var ratio=(ev.clientX-rect.left)/rect.width;
    var hrs=Math.round(ratio*MAX*2)/2;
    setSleep(function(p){return p.map(function(v,j){return j===i?Math.max(0,Math.min(MAX,hrs)):v;});});
  }
  return h('div',null,
    h('p',{style:{color:'var(--ink-light)',fontSize:13,marginBottom:12,fontStyle:'italic'}},'Moyenne : '+avg+'h — Objectif : 8h — Cliquez sur les barres pour ajuster'),
    sleep.map(function(hrs,i){
      return h('div',{key:i,className:'sleep-row'},
        h('span',{className:'sleep-lbl'},labels[i]),
        h('div',{className:'sleep-bg',onClick:function(ev){click(i,ev);}},h('div',{className:'sleep-fill',style:{width:(hrs/MAX*100)+'%'}})),
        h('span',{className:'sleep-val'},hrs+'h'));
    }));
}

// HABITS
function HabitsPage(props){

// HAPPINESS
function HappinessPage(props){
  var moods=props.moods, setMoods=props.setMoods;
  var dim=daysInMonth(T_YEAR,T_MONTH);
  var days=Array.from({length:dim},function(_,i){return i+1;});
  var fd=firstDayOfMonth(T_YEAR,T_MONTH);
  var filled=days.filter(function(d){return moods[d]!==null&&moods[d]!==undefined;});
  var avg=filled.length?(filled.reduce(function(s,d){return s+moods[d];},0)/filled.length).toFixed(1):null;
  function setM(day,idx){setMoods(function(p){var n=Object.assign({},p);n[day]=p[day]===idx?null:idx;return n;});}
  return h('div',null,
    h('p',{style:{color:'var(--ink-light)',fontSize:13,marginBottom:8,fontStyle:'italic'}},
      MONTHS_FR[T_MONTH]+' '+T_YEAR+(avg!==null?' — Humeur moyenne : '+MOODS[Math.round(Number(avg))]+' ('+avg+'/4)':'')),
    h('div',{className:'hap-grid'},
      DAYS.map(function(d){return h('div',{key:d,className:'hap-dh'},d);}),
      Array.from({length:fd}).map(function(_,i){return h('div',{key:'e'+i});}),
      days.map(function(day){
        var mval=moods[day];
        var hasMood=mval!==null&&mval!==undefined;
        return h('div',{key:day,className:'hap-cell'+(day===TODAY?' today-h':''),
          style:{background:hasMood?'rgba(196,135,58,'+(0.08+mval*0.18)+')':'#fff'}},
          h('div',{className:'hap-dn'+(day===TODAY?' td':'')},day),
          MOODS.map(function(m,idx){
            return h('span',{key:idx,className:'mood-btn'+(moods[day]===idx?' sel':''),onClick:function(){setM(day,idx);},title:m},m);
          }));
      })));
}

// APP
function App(){
  var _p=useState('index'); var page=_p[0]; var setPage=_p[1];
  var _de=useState(initDaily); var dailyEntries=_de[0]; var setDailyEntries=_de[1];
  var _mg=useState(initMonthGoals); var monthGoals=_mg[0]; var setMonthGoals=_mg[1];
  var _ce=useState({}); var calEvts=_ce[0]; var setCalEvts=_ce[1];
  var _fd=useState(initFuture); var futureData=_fd[0]; var setFutureData=_fd[1];
  var _jt=useState(''); var journalText=_jt[0]; var setJournalText=_jt[1];
  var _sp=useState([false,true,false,true,false,true,false]); var sport=_sp[0]; var setSport=_sp[1];
  var _wa=useState(4); var water=_wa[0]; var setWater=_wa[1];
  var _sl=useState([7,6.5,8,7.5,6,7,8]); var sleep=_sl[0]; var setSleep=_sl[1];
  var _ex=useState([{id:1,cat:'🍽️',desc:'Déjeuner boulangerie',amount:8.50},{id:2,cat:'🚗',desc:'Essence',amount:55},{id:3,cat:'📚',desc:'Atomic Habits',amount:18}]); var expenses=_ex[0]; var setExpenses=_ex[1];
  var _ha=useState(initHabits); var habits=_ha[0]; var setHabits=_ha[1];
  var _mo=useState(initMoods); var moods=_mo[0]; var setMoods=_mo[1];

  var TITLES={index:'Index',future:'Future Log',monthly:'Monthly Log',daily:'Daily Log',journal:'Journal Personnel',sport:'Tracker Sport',water:'Tracker Hydratation',sleep:'Tracker Sommeil',expenses:'Tracker Dépenses',habits:'Tracker Habitudes',happiness:'Tracker Bonheur'};
  var nav=NAV.find(function(n){return n.id===page;});
  var sections=['Structure','Logs','Trackers'];

  function renderPage(){
    switch(page){
      case 'index': return h(IndexPage,{onNav:setPage});
      case 'future': return h(FuturePage,{data:futureData,setData:setFutureData});
      case 'monthly': return h(MonthlyPage,{goals:monthGoals,setGoals:setMonthGoals,calEvts:calEvts,setCalEvts:setCalEvts});
      case 'daily': return h(DailyPage,{entries:dailyEntries,setEntries:setDailyEntries});
      case 'journal': return h(JournalPage,{text:journalText,setText:setJournalText});
      case 'sport': return h(SportPage,{sport:sport,setSport:setSport});
      case 'water': return h(WaterPage,{water:water,setWater:setWater});
      case 'sleep': return h(SleepPage,{sleep:sleep,setSleep:setSleep});
      case 'expenses': return h(ExpensesPage,{expenses:expenses,setExpenses:setExpenses});
      case 'habits': return h(HabitsPage,{habits:habits,setHabits:setHabits});
      case 'happiness': return h(HappinessPage,{moods:moods,setMoods:setMoods});
    }
  }

  return h('div',{className:'journal'},
    h('div',{className:'spine'},Array.from({length:14}).map(function(_,i){return h('div',{key:i,className:'ring'});})),
    h('div',{className:'sidebar'},
      h('div',{className:'sidebar-brand'},'Mon Carnet',h('small',null,'Bullet Journal')),
      sections.map(function(sec){
        return h('div',{key:sec},
          h('div',{className:'sec-label'},sec),
          NAV.filter(function(n){return n.sec===sec;}).map(function(n){
            return h('button',{key:n.id,className:'nav-btn'+(page===n.id?' active':''),onClick:function(){setPage(n.id);}},
              h('span',{className:'ni'},n.icon),n.label);
          }));
      }),
      h('div',{className:'sidebar-foot'},
        now.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}),
        h('br',null),'p. '+PAGE_NUM[page])),
    h('div',{className:'page'},
      h('div',{className:'page-head'},
        h('h1',null,TITLES[page]),
        h('p',null,(nav?nav.icon+' ':'')+(nav?nav.sec:''))),
      h('div',{className:'page-body'},renderPage())));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
})();
