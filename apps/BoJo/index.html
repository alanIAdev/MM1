<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon Bullet Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ivory: #F9F6F0;
    --ivory-dark: #EDE8DF;
    --ink: #2C2416;
    --ink-light: #6B5E4A;
    --ocre: #C4873A;
    --ocre-light: #E8C490;
    --sage: #7A9E7E;
    --slate: #5B7FA6;
    --brick: #B85C4A;
    --paper: #FDFAF5;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #D6CFC3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(ellipse at top left, #C9C2B5 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, #BFB8AA 0%, transparent 50%);
  }

  #root { width: 100%; max-width: 1100px; }

  /* JOURNAL WRAPPER */
  .journal {
    display: flex;
    background: var(--ink);
    border-radius: 4px 12px 12px 4px;
    box-shadow: 
      -4px 0 0 #1a140d,
      8px 8px 30px rgba(0,0,0,0.4),
      20px 20px 60px rgba(0,0,0,0.2);
    min-height: 700px;
    position: relative;
  }

  /* SPINE */
  .spine {
    width: 36px;
    background: linear-gradient(180deg, #1a140d 0%, #2C2416 50%, #1a140d 100%);
    border-radius: 4px 0 0 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    gap: 18px;
    flex-shrink: 0;
  }

  .spine-ring {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid #8B7355;
    background: #2C2416;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.05);
  }

  /* SIDEBAR */
  .sidebar {
    width: 200px;
    background: linear-gradient(180deg, #3D3020 0%, #2C2416 100%);
    padding: 24px 0 24px 0;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--ocre-light);
    font-size: 18px;
    padding: 0 20px 20px;
    border-bottom: 1px solid rgba(196,135,58,0.2);
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .sidebar-title span { display: block; font-size: 11px; font-style: normal; font-family: 'Inter', sans-serif; color: var(--ink-light); margin-top: 2px; letter-spacing: 0.08em; text-transform: uppercase; }

  .nav-section-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #6B5E4A;
    padding: 12px 20px 4px;
    font-weight: 600;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    background: none;
    border: none;
    cursor: pointer;
    color: #A89880;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    text-align: left;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    width: 100%;
  }

  .nav-btn:hover { background: rgba(196,135,58,0.1); color: var(--ocre-light); }
  .nav-btn.active { background: rgba(196,135,58,0.15); color: var(--ocre-light); border-left-color: var(--ocre); font-weight: 500; }
  .nav-btn .icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

  /* PAGE */
  .page {
    flex: 1;
    background: var(--paper);
    border-radius: 0 12px 12px 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background-image: 
      repeating-linear-gradient(transparent, transparent 27px, #E8E0D4 27px, #E8E0D4 28px);
    background-position: 0 52px;
  }

  .page-header {
    background: var(--paper);
    padding: 20px 32px 16px;
    border-bottom: 2px solid var(--ocre);
    background-image: none;
    position: relative;
  }

  .page-header::after {
    content: '';
    position: absolute;
    left: 60px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(184,92,74,0.3);
  }

  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--ink);
    font-weight: 700;
  }

  .page-subtitle {
    font-size: 12px;
    color: var(--ink-light);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .page-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px 32px;
  }

  .page-body::-webkit-scrollbar { width: 6px; }
  .page-body::-webkit-scrollbar-track { background: transparent; }
  .page-body::-webkit-scrollbar-thumb { background: var(--ivory-dark); border-radius: 3px; }

  /* BULLETS */
  .bullet-list { list-style: none; }

  .bullet-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    group: true;
  }

  .bullet-item.done { text-decoration: line-through; color: var(--ink-light); }
  .bullet-item.migrated { color: var(--slate); }

  .bullet-symbol {
    font-size: 15px;
    line-height: 1.4;
    min-width: 20px;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }

  .bullet-text { flex: 1; cursor: pointer; line-height: 1.5; }

  .bullet-delete {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--brick);
    font-size: 16px;
    line-height: 1;
    padding: 0 4px;
    transition: opacity 0.15s;
  }

  .bullet-item:hover .bullet-delete { opacity: 1; }

  /* ADD ENTRY */
  .add-entry {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    align-items: center;
    background: rgba(255,255,255,0.5);
    border: 1px dashed var(--ivory-dark);
    border-radius: 6px;
    padding: 8px 12px;
  }

  .add-entry select {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    background: none;
    border: none;
    color: var(--ink-light);
    cursor: pointer;
    outline: none;
    padding: 2px;
  }

  .add-entry input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
  }

  .add-entry input::placeholder { color: #BBA98A; }

  .add-entry button {
    background: var(--ocre);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    transition: background 0.15s;
  }
  .add-entry button:hover { background: #B07830; }

  /* CARDS & SECTIONS */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--ink);
    margin: 24px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--ivory-dark);
  }

  /* FUTURE LOG */
  .month-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }

  .month-card {
    background: white;
    border-radius: 8px;
    padding: 14px;
    border: 1px solid var(--ivory-dark);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .month-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--ivory-dark);
  }

  .month-card .event-item {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 0;
    color: var(--ink-light);
    border-bottom: 1px dotted #EDE8DF;
    display: flex;
    gap: 6px;
    cursor: pointer;
  }

  .month-card .event-item:hover { color: var(--ink); }
  .month-card .add-month-event { 
    margin-top: 6px;
    width: 100%;
    background: none;
    border: 1px dashed #DDD;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--ink-light);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: left;
    transition: all 0.15s;
  }
  .month-card .add-month-event:hover { border-color: var(--ocre); color: var(--ocre); }

  /* MONTHLY LOG */
  .weekly-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin: 8px 0 16px;
  }

  .day-header {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-light);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 4px 0;
  }

  .day-cell {
    background: white;
    border: 1px solid var(--ivory-dark);
    border-radius: 6px;
    min-height: 70px;
    padding: 6px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .day-cell:hover { border-color: var(--ocre); box-shadow: 0 0 0 2px rgba(196,135,58,0.1); }
  .day-cell.today { border-color: var(--ocre); background: rgba(196,135,58,0.05); }
  .day-cell.empty { background: var(--ivory); opacity: 0.4; pointer-events: none; }

  .day-number {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-light);
    margin-bottom: 4px;
  }

  .day-cell.today .day-number {
    background: var(--ocre);
    color: white;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    margin-bottom: 4px;
  }

  .day-event {
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--slate);
    line-height: 1.3;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* INDEX */
  .index-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .index-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    padding: 6px 10px;
    border-bottom: 2px solid var(--ink);
  }
  .index-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--ivory-dark);
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
  }
  .index-table tr:hover td { background: rgba(196,135,58,0.07); color: var(--ocre); }
  .index-table td:last-child { color: var(--ink-light); font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  /* TRACKERS */
  .tracker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .tracker-card {
    background: white;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--ivory-dark);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .tracker-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* HABIT GRID */
  .habit-days {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .habit-day {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 1.5px solid var(--ivory-dark);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: transparent;
    background: white;
  }

  .habit-day.checked { background: var(--sage); border-color: var(--sage); color: white; }
  .habit-day:hover:not(.checked) { border-color: var(--sage); background: rgba(122,158,126,0.1); }

  /* MOOD / HAPPINESS */
  .mood-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin: 4px 0;
    font-size: 12px;
    color: var(--ink-light);
  }

  .mood-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    background: var(--ivory);
  }
  .mood-dot:hover { transform: scale(1.15); }
  .mood-dot.selected { border-color: var(--ocre); box-shadow: 0 0 0 3px rgba(196,135,58,0.2); }

  /* WATER TRACKER */
  .water-glasses {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .glass {
    font-size: 22px;
    cursor: pointer;
    opacity: 0.25;
    transition: all 0.15s;
    filter: grayscale(100%);
  }

  .glass.filled { opacity: 1; filter: grayscale(0%); }
  .glass:hover { transform: scale(1.1); }

  /* SLEEP */
  .sleep-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }

  .sleep-day-label { font-size: 11px; color: var(--ink-light); width: 28px; font-family: 'JetBrains Mono', monospace; }

  .sleep-bar-bg {
    flex: 1;
    height: 14px;
    background: var(--ivory-dark);
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }

  .sleep-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--slate), #7AADD4);
    border-radius: 7px;
    transition: width 0.3s;
  }

  .sleep-hours { font-size: 11px; color: var(--ink-light); width: 32px; text-align: right; font-family: 'JetBrains Mono', monospace; }

  /* EXPENSE */
  .expense-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dotted var(--ivory-dark);
    font-size: 12px;
  }
  .expense-cat {
    font-size: 14px;
    width: 20px;
    text-align: center;
  }
  .expense-desc { flex: 1; color: var(--ink); }
  .expense-amount { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--brick); }

  .add-expense {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .add-expense input, .add-expense select {
    flex: 1;
    min-width: 60px;
    padding: 5px 8px;
    border: 1px solid var(--ivory-dark);
    border-radius: 5px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    outline: none;
    color: var(--ink);
    background: white;
  }
  .add-expense button {
    background: var(--brick);
    color: white;
    border: none;
    border-radius: 5px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }

  /* JOURNAL */
  .journal-textarea {
    width: 100%;
    min-height: 300px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 28px;
    color: var(--ink);
    resize: none;
    padding: 0;
  }

  /* SPORT TRACKER */
  .sport-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .sport-day-cell {
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1.5px solid var(--ivory-dark);
    cursor: pointer;
    transition: all 0.15s;
    background: white;
  }
  .sport-day-cell.active { background: var(--sage); border-color: var(--sage); }
  .sport-day-cell .sday-label { font-size: 9px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }
  .sport-day-cell.active .sday-label { color: white; }
  .sport-day-cell .sday-icon { font-size: 18px; margin: 4px 0; }
  .sport-day-cell .sday-num { font-size: 9px; color: var(--ink-light); font-family: 'JetBrains Mono', monospace; }
  .sport-day-cell.active .sday-num { color: rgba(255,255,255,0.8); }

  /* TAGS / BADGES */
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tag-task { background: rgba(196,135,58,0.15); color: var(--ocre); }
  .tag-event { background: rgba(91,127,166,0.15); color: var(--slate); }
  .tag-note { background: rgba(122,158,126,0.15); color: var(--sage); }
  .tag-page { background: rgba(44,36,22,0.1); color: var(--ink-light); font-family: 'JetBrains Mono', monospace; }

  /* MODAL INPUT */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-box {
    background: var(--paper);
    border-radius: 12px;
    padding: 24px;
    min-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-box h3 { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 16px; color: var(--ink); }
  .modal-box input, .modal-box textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--ivory-dark);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    margin-bottom: 12px;
    background: white;
  }
  .modal-box textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 7px 18px; border-radius: 6px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
  .btn-cancel { background: var(--ivory-dark); color: var(--ink-light); }
  .btn-save { background: var(--ocre); color: white; }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    .journal { flex-direction: column; }
    .spine { width: 100%; height: 24px; flex-direction: row; padding: 0 16px; border-radius: 4px 4px 0 0; }
    .spine-ring { width: 14px; height: 14px; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 8px 0; }
    .nav-section-label { display: none; }
    .month-grid { grid-template-columns: 1fr; }
    .tracker-grid { grid-template-columns: 1fr; }
    .weekly-grid { grid-template-columns: repeat(7, 1fr); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS_FR = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const SPORT_DAYS = ['L','M','M','J','V','S','D'];
const BULLET_TYPES = [
  { symbol: '•', label: 'Tâche', type: 'task' },
  { symbol: '○', label: 'Événement', type: 'event' },
  { symbol: '–', label: 'Note', type: 'note' },
];

const HABIT_LIST = [
  { id: 'lecture', label: '📚 Lecture' },
  { id: 'meditation', label: '🧘 Méditation' },
  { id: 'sport', label: '🏃 Sport' },
  { id: 'journal', label: '✍️ Journal' },
  { id: 'gratitude', label: '🙏 Gratitude' },
];

const EXPENSE_CATS = ['🍽️','🚗','🏠','🛍️','💊','🎭','📚','✈️','💡','❓'];

const now = new Date();
const TODAY_DAY = now.getDate();
const TODAY_MONTH = now.getMonth();
const TODAY_YEAR = now.getFullYear();

// Helper: days in month
function getDaysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}
function getFirstDayOfMonth(year, month) {
  let d = new Date(year, month, 1).getDay();
  return d === 0 ? 6 : d - 1; // Monday=0
}

// --- NAV ITEMS ---
const NAV = [
  { id: 'index', label: 'Index', icon: '📋', section: 'Structure' },
  { id: 'future', label: 'Future Log', icon: '🗓️', section: 'Structure' },
  { id: 'monthly', label: 'Monthly Log', icon: '📅', section: 'Logs' },
  { id: 'daily', label: 'Daily Log', icon: '✏️', section: 'Logs' },

// ---- MODAL ----
function Modal({ title, onSave, onClose, placeholder = 'Saisir...' }) {
  const [val, setVal] = useState('');
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        <h3>{title}</h3>
        <input
          autoFocus
          value={val}
          onChange={e => setVal(e.target.value)}
          placeholder={placeholder}
          onKeyDown={e => { if (e.key === 'Enter') { onSave(val); onClose(); } if (e.key === 'Escape') onClose(); }}
        />
        <div className="modal-actions">
          <button className="btn-cancel" onClick={onClose}>Annuler</button>
          <button className="btn-save" onClick={() => { onSave(val); onClose(); }}>Ajouter</button>
        </div>
      </div>
    </div>
  );
}

// ---- BULLET LIST COMPONENT ----
function BulletList({ entries, onToggle, onDelete, onAdd }) {
  const [newText, setNewText] = useState('');
  const [newType, setNewType] = useState('•');

  const handleAdd = () => {
    if (!newText.trim()) return;
    onAdd({ symbol: newType, text: newText.trim() });
    setNewText('');
  };

  return (
    <div>
      <ul className="bullet-list">
        {entries.map(e => (
          <li key={e.id} className={`bullet-item ${e.done ? 'done' : ''}`}>
            <span className="bullet-symbol" onClick={() => onToggle(e.id)}>
              {e.done ? '✕' : e.symbol}
            </span>
            <span className="bullet-text" onClick={() => onToggle(e.id)}>{e.text}</span>
            <button className="bullet-delete" onClick={() => onDelete(e.id)}>×</button>
          </li>
        ))}
      </ul>
      <div className="add-entry">
        <select value={newType} onChange={e => setNewType(e.target.value)}>
          {BULLET_TYPES.map(b => <option key={b.type} value={b.symbol}>{b.symbol} {b.label}</option>)}
        </select>
        <input
          placeholder="Nouvelle entrée…"
          value={newText}
          onChange={e => setNewText(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && handleAdd()}
        />
        <button onClick={handleAdd}>+ Ajouter</button>
      </div>
    </div>
  );
}

function MonthlyLogPage({ monthlyGoals, setMonthlyGoals, monthlyEvents, setMonthlyEvents }) {
  const [viewMonth, setViewMonth] = useState(TODAY_MONTH);
  const [viewYear, setViewYear] = useState(TODAY_YEAR);
  const [modal, setModal] = useState(null);

  const daysCount = getDaysInMonth(viewYear, viewMonth);
  const firstDay = getFirstDayOfMonth(viewYear, viewMonth);
  const cells = [...Array(firstDay).fill(null), ...Array.from({ length: daysCount }, (_, i) => i + 1)];
  while (cells.length % 7 !== 0) cells.push(null);

  const addGoal = entry => {
    if (!entry.text) return;
    setMonthlyGoals(prev => [...prev, { id: Date.now(), ...entry, done: false }]);
  };

  const toggleGoal = id => setMonthlyGoals(prev => prev.map(g => g.id === id ? { ...g, done: !g.done } : g));
  const deleteGoal = id => setMonthlyGoals(prev => prev.filter(g => g.id !== id));

  const addEvent = (day, text) => {
    if (!text.trim()) return;
    const key = `${viewYear}-${viewMonth}-${day}`;
    setMonthlyEvents(prev => ({ ...prev, [key]: [...(prev[key] || []), text] }));
  };

  const prevMonth = () => { if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); } else setViewMonth(m => m - 1); };
  const nextMonth = () => { if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); } else setViewMonth(m => m + 1); };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button onClick={prevMonth} style={{ background: 'none', border: '1px solid var(--ivory-dark)', borderRadius: 5, padding: '4px 10px', cursor: 'pointer', fontSize: 14, color: 'var(--ink-light)' }}>‹</button>
        <span style={{ fontFamily: 'Playfair Display, serif', fontSize: 18, color: 'var(--ink)', flex: 1, textAlign: 'center' }}>{MONTHS_FR[viewMonth]} {viewYear}</span>
        <button onClick={nextMonth} style={{ background: 'none', border: '1px solid var(--ivory-dark)', borderRadius: 5, padding: '4px 10px', cursor: 'pointer', fontSize: 14, color: 'var(--ink-light)' }}>›</button>
      </div>

      <div className="weekly-grid">
        {DAYS_FR.map(d => <div key={d} className="day-header">{d}</div>)}
        {cells.map((day, i) => {
          const key = `${viewYear}-${viewMonth}-${day}`;
          const evts = monthlyEvents[key] || [];
          const isToday = day === TODAY_DAY && viewMonth === TODAY_MONTH && viewYear === TODAY_YEAR;
          return (
            <div
              key={i}
              className={`day-cell ${isToday ? 'today' : ''} ${day === null ? 'empty' : ''}`}
              onClick={day ? () => setModal({ day, key }) : undefined}
            >
              {day && (
                <>
                  <div className="day-number">{isToday ? <span>{day}</span> : day}</div>
                  {evts.slice(0, 2).map((e, ei) => <div key={ei} className="day-event">○ {e}</div>)}
                  {evts.length > 2 && <div className="day-event" style={{ color: 'var(--ocre)' }}>+{evts.length - 2}</div>}
                </>
              )}
            </div>
          );
        })}
      </div>

      <div className="section-title">Objectifs du mois</div>
      <BulletList entries={monthlyGoals} onToggle={toggleGoal} onDelete={deleteGoal} onAdd={addGoal} />

      {modal && (
        <Modal
          title={`${modal.day} ${MONTHS_FR[viewMonth]}`}
          placeholder="Événement ou note…"
          onSave={text => addEvent(modal.day, text)}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

function SleepPage({ sleep, setSleep }) {
  const days = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const max = 10;

  const handleClick = (i, e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const hours = Math.round(ratio * max * 2) / 2;
    setSleep(prev => prev.map((v, idx) => idx === i ? Math.max(0, Math.min(max, hours)) : v));
  };

  const avg = (sleep.reduce((a, b) => a + b, 0) / sleep.length).toFixed(1);

  return (
    <div>
      <p style={{ color: 'var(--ink-light)', fontSize: 13, marginBottom: 16, fontStyle: 'italic' }}>

function HappinessPage({ moods, setMoods }) {
  const daysCount = getDaysInMonth(TODAY_YEAR, TODAY_MONTH);
  const days = Array.from({ length: daysCount }, (_, i) => i + 1);

  const setMood = (day, idx) => setMoods(prev => ({ ...prev, [day]: prev[day] === idx ? null : idx }));
  const avgMood = (() => {
    const filled = days.filter(d => moods[d] !== null && moods[d] !== undefined);
    if (!filled.length) return null;
    return (filled.reduce((s, d) => s + moods[d], 0) / filled.length).toFixed(1);
  })();

  return (
    <div>
      <p style={{ color: 'var(--ink-light)', fontSize: 13, marginBottom: 8, fontStyle: 'italic' }}>
        {MONTHS_FR[TODAY_MONTH]} {TODAY_YEAR}
        {avgMood !== null && <span style={{ marginLeft: 12 }}>Humeur moyenne : {MOODS[Math.round(avgMood)]} {avgMood}/4</span>}
      </p>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, marginTop: 8 }}>
        {DAYS_FR.map(d => <div key={d} style={{ textAlign: 'center', fontSize: 10, color: 'var(--ink-light)', fontWeight: 600, padding: '4px 0', letterSpacing: '0.05em', textTransform: 'uppercase' }}>{d}</div>)}
        {Array.from({ length: (new Date(TODAY_YEAR, TODAY_MONTH, 1).getDay() + 6) % 7 }).map((_, i) => <div key={`e${i}`} />)}
        {days.map(day => {
          const mood = moods[day];
          return (
            <div key={day} style={{
              background: mood !== null && mood !== undefined ? `rgba(196,135,58,${0.1 + mood * 0.2})` : 'white',
              border: `1.5px solid ${day === TODAY_DAY ? 'var(--ocre)' : 'var(--ivory-dark)'}`,
              borderRadius: 8,
              padding: '6px 4px',
              textAlign: 'center',
              minHeight: 70,
            }}>
              <div style={{ fontSize: 10, color: day === TODAY_DAY ? 'var(--ocre)' : 'var(--ink-light)', fontWeight: day === TODAY_DAY ? 700 : 400, marginBottom: 4 }}>{day}</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2, alignItems: 'center' }}>
                {MOODS.map((m, idx) => (
                  <span
                    key={idx}
                    onClick={() => setMood(day, idx)}
                    style={{
                      fontSize: 13,
                      cursor: 'pointer',
                      opacity: mood === idx ? 1 : 0.25,
                      transition: 'all 0.15s',
                      transform: mood === idx ? 'scale(1.15)' : 'scale(1)',
                    }}
                    title={m}
                  >
                    {m}
                  </span>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- MAIN APP ----
function App() {
  const [page, setPage] = useState('index');
  const [dailyEntries, setDailyEntries] = useState(initDailyEntries);
  const [monthlyGoals, setMonthlyGoals] = useState(initMonthlyGoals);
  const [monthlyEvents, setMonthlyEvents] = useState({});
  const [futureLog, setFutureLog] = useState(initFutureLog);
  const [journalText, setJournalText] = useState('');
  const [sport, setSport] = useState(initSport);
  const [water, setWater] = useState(initWater);
  const [sleep, setSleep] = useState(initSleep);
  const [expenses, setExpenses] = useState(initExpenses);
  const [habits, setHabits] = useState(initHabits);
  const [moods, setMoods] = useState(initMoods);

  const currentNav = NAV.find(n => n.id === page);

  const PAGE_TITLES = {
    index: 'Index', future: 'Future Log', monthly: 'Monthly Log',
    daily: 'Daily Log', journal: 'Journal Personnel',
    sport: 'Tracker Sport', water: 'Tracker Hydratation',
    sleep: 'Tracker Sommeil', expenses: 'Tracker Dépenses',
    habits: 'Tracker Habitudes', happiness: 'Tracker Bonheur',
  };

  const sections = [...new Set(NAV.map(n => n.section))];

  const renderPage = () => {
    switch (page) {
      case 'index': return <IndexPage onNavigate={setPage} />;
      case 'future': return <FutureLogPage futureLog={futureLog} setFutureLog={setFutureLog} />;
      case 'monthly': return <MonthlyLogPage monthlyGoals={monthlyGoals} setMonthlyGoals={setMonthlyGoals} monthlyEvents={monthlyEvents} setMonthlyEvents={setMonthlyEvents} />;
      case 'daily': return <DailyLogPage dailyEntries={dailyEntries} setDailyEntries={setDailyEntries} />;
      case 'journal': return <JournalPage journalText={journalText} setJournalText={setJournalText} />;
      case 'sport': return <SportPage sport={sport} setSport={setSport} />;
      case 'water': return <WaterPage water={water} setWater={setWater} />;
      case 'sleep': return <SleepPage sleep={sleep} setSleep={setSleep} />;
      case 'expenses': return <ExpensesPage expenses={expenses} setExpenses={setExpenses} />;
      case 'habits': return <HabitsPage habits={habits} setHabits={setHabits} />;
      case 'happiness': return <HappinessPage moods={moods} setMoods={setMoods} />;
      default: return null;
    }
  };

  return (
    <div className="journal">
      <div className="spine">
        {Array.from({ length: 14 }).map((_, i) => <div key={i} className="spine-ring" />)}
      </div>

      <div className="sidebar">
        <div className="sidebar-title">
          Mon Carnet
          <span>Bullet Journal</span>
        </div>

        {sections.map(section => (
          <div key={section}>
            <div className="nav-section-label">{section}</div>
            {NAV.filter(n => n.section === section).map(n => (
              <button
                key={n.id}
                className={`nav-btn ${page === n.id ? 'active' : ''}`}
                onClick={() => setPage(n.id)}
              >
                <span className="icon">{n.icon}</span>
                {n.label}
              </button>
            ))}
          </div>
        ))}

        <div style={{ flex: 1 }} />
        <div style={{ padding: '16px 20px', borderTop: '1px solid rgba(196,135,58,0.15)' }}>
          <div style={{ fontSize: 10, color: '#6B5E4A', letterSpacing: '0.05em' }}>
            {now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })}
          </div>
          <div style={{ fontSize: 10, color: '#4A3F30', marginTop: 2, fontFamily: 'JetBrains Mono, monospace' }}>
            p. {PAGE_NUMBERS[page]}
          </div>
        </div>
      </div>

      <div className="page">
        <div className="page-header">
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
            <h1 className="page-title">{PAGE_TITLES[page]}</h1>
            <span className="tag tag-page">p. {PAGE_NUMBERS[page]}</span>
          </div>
          <div className="page-subtitle">{currentNav?.icon} {currentNav?.section}</div>
        </div>
        <div className="page-body">
          {renderPage()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
