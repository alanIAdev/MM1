<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respiration — Mini Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090d;
      --bg2: #0d0f17;
      --border: #1e2030;
      --text: #dde0ee;
      --muted: #555870;
      --accent: #7abfe8;
      --accent2: #a78bfa;
      --accent3: #7ae8c0;
      --card-bg: #0f1118;
      --shadow: rgba(0,0,0,0.7);
      --phase-inhale: #7abfe8;
      --phase-hold: #a78bfa;
      --phase-exhale: #7ae8c0;
    }
    :root[data-theme="light"] {
      --bg: #eef0f8; --bg2: #e4e7f5; --border: #c8cce0;
      --text: #1a1c2e; --muted: #7880a0; --accent: #1a70b0;
      --card-bg: #f5f6fc; --shadow: rgba(0,0,0,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background 0.5s, color 0.5s; overflow-x: hidden;
    }
    body::after {
      content: ''; position: fixed; top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(122,191,232,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0; transition: background 4s ease;
    }
    body.phase-hold::after  { background: radial-gradient(circle, rgba(167,139,250,0.05) 0%, transparent 70%); }
    body.phase-exhale::after{ background: radial-gradient(circle, rgba(122,232,192,0.04) 0%, transparent 70%); }

    /* ── IMMERSIVE ── */
    .immersive {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; background: var(--bg);
      opacity: 0; pointer-events: none; transition: opacity 0.6s;
    }
    .immersive.active { opacity: 1; pointer-events: all; }

    .imm-cycle-label {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 2rem;
    }
    .imm-infinite-badge {
      display: inline-block; margin-left: 0.5rem;
      font-size: 0.8rem; color: var(--accent2);
    }

    .imm-circle-wrap {
      position: relative;
      width: min(60vw, 280px); height: min(60vw, 280px);
      margin-bottom: 1.5rem;
    }
    .imm-circle {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, rgba(122,191,232,0.18), rgba(122,191,232,0.04) 60%, transparent);
      border: 1px solid rgba(122,191,232,0.2);
      transition: transform 0s, border-color 0.8s, background 0.8s;
    }
    .imm-circle.hold {
      background: radial-gradient(circle at 40% 40%, rgba(167,139,250,0.18), rgba(167,139,250,0.04) 60%, transparent);
      border-color: rgba(167,139,250,0.25);
    }
    .imm-circle.exhale {
      background: radial-gradient(circle at 40% 40%, rgba(122,232,192,0.18), rgba(122,232,192,0.04) 60%, transparent);
      border-color: rgba(122,232,192,0.2);
    }
    .ripple {
      position: absolute; inset: -20px; border-radius: 50%;
      border: 1px solid rgba(122,191,232,0.1);
      animation: rippleOut 4s infinite; pointer-events: none;
    }
    .ripple:nth-child(2) { animation-delay: 1.3s; }
    .ripple:nth-child(3) { animation-delay: 2.6s; }
    @keyframes rippleOut {
      0%   { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .imm-countdown {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(2.8rem, 8vw, 4rem);
      font-weight: 500; letter-spacing: -0.04em; color: var(--text); line-height: 1;
    }

    /* ── Progress bar under circle ── */
    .imm-progress-wrap {
      width: min(60vw, 280px);
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.8rem;
    }
    .imm-progress-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transform-origin: left;
      transform: scaleX(1);
      transition: background 0.6s;
    }

    .imm-phase-name {
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-family: 'Fraunces', serif; font-style: italic; font-weight: 300;
      color: var(--accent); margin-bottom: 0.4rem;
      transition: color 0.8s; text-align: center;
    }
    .imm-phase-info {
      font-size: 0.65rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 2rem; text-align: center;
    }
    .imm-dots { display: flex; gap: 0.5rem; margin-bottom: 2.5rem; }
    .imm-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); transition: background 0.4s, transform 0.3s;
    }
    .imm-dot.active-dot { background: var(--accent); transform: scale(1.3); }
    .imm-dot.done-dot   { background: var(--muted); }

    .imm-exit {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.6rem 1.6rem;
      background: transparent; border: 1px solid var(--border);
      border-radius: 3px; color: var(--muted);
      cursor: pointer; transition: all 0.2s;
    }
    .imm-exit:hover { border-color: var(--accent); color: var(--accent); }

    /* ── NORMAL LAYOUT ── */
    .layout {
      position: relative; z-index: 1;
      max-width: 640px; margin: 0 auto;
      padding: 2.5rem 2rem 5rem; width: 100%;
    }
    nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3rem; }
    .back-link {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .toggle-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .toggle-icon { font-size: 0.85rem; }
    .toggle {
      position: relative; width: 40px; height: 22px;
      background: var(--border); border-radius: 11px;
      border: 1px solid var(--border); cursor: pointer; transition: background 0.3s;
    }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; background: var(--accent); border-radius: 50%;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    [data-theme="light"] .toggle::after { transform: translateX(18px); }

    .page-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem;
    }
    .page-title span { font-style: italic; font-weight: 300; }
    .page-sub {
      font-size: 0.7rem; color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2rem;
    }

    /* ── Preset tabs ── */
    .preset-tabs {
      display: flex; gap: 0; margin-bottom: 2rem;
      border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    }
    .preset-tab {
      flex: 1; padding: 0.7rem 0.5rem; text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; transition: background 0.2s, color 0.2s;
      border-right: 1px solid var(--border); line-height: 1.5;
    }
    .preset-tab:last-child { border-right: none; }
    .preset-tab.active { background: rgba(122,191,232,0.1); color: var(--accent); }
    .preset-tab:hover:not(.active) { background: rgba(122,191,232,0.05); }
    .preset-tab strong { display: block; font-size: 0.75rem; }

    /* Preview */
    .preview-wrap { display: flex; justify-content: center; margin-bottom: 2rem; }
    .preview-circle {
      width: 110px; height: 110px; border-radius: 50%;
      border: 1px solid rgba(122,191,232,0.3);
      background: radial-gradient(circle at 40% 40%, rgba(122,191,232,0.1), transparent 70%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif; font-size: 0.85rem; font-style: italic; font-weight: 300;
      color: var(--accent); transition: all 0.5s; text-align: center; padding: 0.5rem;
    }

    .start-big {
      display: block; width: 100%;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 1.1rem;
      background: linear-gradient(135deg, rgba(122,191,232,0.15), rgba(167,139,250,0.1));
      border: 1px solid rgba(122,191,232,0.3);
      border-radius: 4px; color: var(--accent);
      cursor: pointer; transition: all 0.25s; margin-bottom: 2rem;
    }
    .start-big:hover {
      background: linear-gradient(135deg, rgba(122,191,232,0.25), rgba(167,139,250,0.18));
      transform: translateY(-2px); box-shadow: 0 8px 30px rgba(122,191,232,0.1);
    }

    /* Config card */
    .config-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem;
    }
    .config-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .config-title { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .config-chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.3s; }
    .config-card.open .config-chevron { transform: rotate(180deg); }
    .config-body { display: none; flex-direction: column; }
    .config-card.open .config-body { display: flex; }

    /* Global settings */
    .global-settings {
      padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 1rem;
    }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .setting-label { font-size: 0.72rem; color: var(--muted); }
    .setting-label strong { color: var(--text); display: block; font-weight: 500; }
    .setting-control { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }

    input[type="number"] {
      width: 56px; text-align: center;
      font-family: 'DM Mono', monospace; font-size: 0.85rem;
      padding: 0.4rem 0.5rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text); transition: border-color 0.2s;
    }
    input[type="number"]:focus { outline: none; border-color: var(--accent); }
    .unit { font-size: 0.65rem; color: var(--muted); }

    /* Checkbox row */
    .checkbox-row {
      display: flex; align-items: center; gap: 0.6rem; cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer;
    }
    .checkbox-row span { font-size: 0.72rem; color: var(--text); }

    /* Phases */
    .phases-grid { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; }
    .phases-label {
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem;
    }
    .phase-row {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.85rem 0; border-bottom: 1px solid var(--border);
    }
    .phase-row:last-child { border-bottom: none; }
    .phase-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .phase-name-input {
      flex: 1; font-family: 'DM Mono', monospace; font-size: 0.75rem;
      background: transparent; border: none; border-bottom: 1px solid var(--border);
      color: var(--text); padding: 0.2rem 0; transition: border-color 0.2s; min-width: 0;
    }
    .phase-name-input:focus { outline: none; border-color: var(--accent); }
    .phase-toggle { display: flex; align-items: center; gap: 0.3rem; }
    .phase-toggle-label { font-size: 0.6rem; color: var(--muted); }

    .pill {
      width: 32px; height: 18px; background: var(--border); border-radius: 9px;
      cursor: pointer; transition: background 0.25s; position: relative; border: none; flex-shrink: 0;
    }
    .pill::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; background: var(--bg); border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pill.on { background: var(--accent); }
    .pill.on::after { transform: translateX(14px); }

    /* Cycles table */
    .cycles-section { padding: 1.25rem 1.5rem; }
    .cycles-label {
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem;
    }
    .cycles-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
    .cycles-table th {
      text-align: left; color: var(--muted); padding: 0.3rem 0.5rem 0.6rem;
      font-weight: 400; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .cycles-table td { padding: 0.5rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .cycles-table tr:last-child td { border-bottom: none; }
    .cycles-table input[type="number"] { width: 48px; font-size: 0.75rem; }
    .cycle-num { color: var(--muted); font-size: 0.65rem; width: 24px; }

    /* Disabled state for custom config when preset active */
    .phases-grid.locked, .cycles-section.locked { opacity: 0.45; pointer-events: none; }

    @media (max-width: 500px) {
      .layout { padding: 1.5rem 1rem 4rem; }
      .preset-tab { font-size: 0.58rem; padding: 0.6rem 0.3rem; }
    }
  </style>
</head>
<body>

<!-- IMMERSIVE OVERLAY -->
<div class="immersive" id="immersive">
  <div class="imm-cycle-label" id="immCycleLabel">Cycle 1 / 4</div>

  <div class="imm-circle-wrap">
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="imm-circle" id="immCircle"></div>
    <div class="imm-countdown" id="immCountdown">–</div>
  </div>

  <!-- Progress bar under the circle -->
  <div class="imm-progress-wrap">
    <div class="imm-progress-bar" id="immProgressBar"></div>
  </div>

  <div class="imm-phase-name" id="immPhaseName">Inspiration</div>
  <div class="imm-phase-info" id="immPhaseInfo">Inspirez lentement</div>

  <div class="imm-dots" id="immDots"></div>

  <button class="imm-exit" id="immExit">✕ Quitter</button>
</div>

<!-- NORMAL LAYOUT -->
<div class="layout">
  <nav>
    <a class="back-link" href="../../index.html">← Accueil</a>
    <div class="toggle-wrap">
      <span class="toggle-icon">🌙</span>
      <div class="toggle" id="themeToggle" role="button" tabindex="0"></div>
      <span class="toggle-icon">☀️</span>
    </div>
  </nav>

  <h1 class="page-title">Respi<span>ration</span></h1>
  <p class="page-sub">Cohérence cardiaque & pleine conscience</p>

  <!-- PRESET TABS -->
  <div class="preset-tabs">
    <button class="preset-tab active" data-preset="478">
      <strong>4-7-8</strong>relaxation
    </button>
    <button class="preset-tab" data-preset="box">
      <strong>4-4-4-4</strong>cohérence
    </button>
    <button class="preset-tab" data-preset="custom">
      <strong>⚙</strong>personnalisé
    </button>
  </div>

  <div class="preview-wrap">
    <div class="preview-circle" id="previewCircle">4 · 7 · 8</div>
  </div>

  <button class="start-big" id="startBtn">▶ Démarrer la session</button>

  <!-- CONFIG -->
  <div class="config-card open" id="configCard">
    <div class="config-header" id="configHeader">
      <span class="config-title">⚙ Configuration</span>
      <span class="config-chevron">▾</span>
    </div>
    <div class="config-body">

      <!-- Global — infinite loop FIRST, then cycles -->
      <div class="global-settings">
        <label class="checkbox-row">
          <input type="checkbox" id="infiniteLoop" />
          <span>∞ Boucle infinie (cycler sans fin)</span>
        </label>
        <div class="setting-row" id="cycleCountRow">
          <div class="setting-label"><strong>Nombre de cycles</strong></div>
          <div class="setting-control">
            <input type="number" id="totalCycles" value="4" min="1" max="10" />
            <span class="unit">cycles</span>
          </div>
        </div>
      </div>

      <!-- Phases (locked when preset) -->
      <div class="phases-grid locked" id="phasesGrid">
        <div class="phases-label">Phases de chaque cycle</div>
        <div class="phase-row">
          <div class="phase-color" style="background: var(--phase-inhale);"></div>
          <input class="phase-name-input" id="p1name" value="Inspiration" type="text" />
          <div class="setting-control">
            <input type="number" id="p1dur" value="4" min="1" max="60" />
            <span class="unit">s</span>
          </div>
          <div class="phase-toggle">
            <span class="phase-toggle-label">actif</span>
            <button class="pill on" id="p1on"></button>
          </div>
        </div>
        <div class="phase-row">
          <div class="phase-color" style="background: var(--phase-hold);"></div>
          <input class="phase-name-input" id="p2name" value="Rétention" type="text" />
          <div class="setting-control">
            <input type="number" id="p2dur" value="7" min="1" max="60" />
            <span class="unit">s</span>
          </div>
          <div class="phase-toggle">
            <span class="phase-toggle-label">actif</span>
            <button class="pill on" id="p2on"></button>
          </div>
        </div>
        <div class="phase-row">
          <div class="phase-color" style="background: var(--phase-exhale);"></div>
          <input class="phase-name-input" id="p3name" value="Expiration" type="text" />
          <div class="setting-control">
            <input type="number" id="p3dur" value="8" min="1" max="60" />
            <span class="unit">s</span>
          </div>
          <div class="phase-toggle">
            <span class="phase-toggle-label">actif</span>
            <button class="pill on" id="p3on"></button>
          </div>
        </div>
      </div>

      <!-- Cycles table (locked when preset) -->
      <div class="cycles-section locked" id="cyclesSection">
        <div class="cycles-label">Durées par cycle (personnalisation fine)</div>
        <table class="cycles-table" id="cyclesTable">
          <thead>
            <tr><th>#</th><th>Inspiration</th><th>Rétention</th><th>Expiration</th></tr>
          </thead>
          <tbody id="cyclesBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script>
  // ── Theme ───────────────────────────────────────────────────────────────────
  const html = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  html.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  themeToggle.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next); localStorage.setItem('theme', next);
  });
  document.getElementById('configHeader').addEventListener('click', () => {
    document.getElementById('configCard').classList.toggle('open');
  });

  // ── Presets ─────────────────────────────────────────────────────────────────
  const PRESETS = {
    '478': { phases: ['Inspiration','Rétention','Expiration'], durs: [4,7,8], active: [true,true,true] },
    'box':  { phases: ['Inspiration','Rétention haute','Expiration','Rétention basse'], durs: [4,4,4,4], active: [true,true,true,true] },
  };
  // Note: box has 4 phases but our UI only supports 3 — we'll handle box as a special flat array
  // For box, we'll override the session directly.

  let currentPreset = '478'; // '478' | 'box' | 'custom'

  function applyPreset(id) {
    const locked = id !== 'custom';
    document.getElementById('phasesGrid').classList.toggle('locked', locked);
    document.getElementById('cyclesSection').classList.toggle('locked', locked);

    if (id === '478') {
      document.getElementById('p1dur').value = 4;
      document.getElementById('p2dur').value = 7;
      document.getElementById('p3dur').value = 8;
      document.getElementById('p1name').value = 'Inspiration';
      document.getElementById('p2name').value = 'Rétention';
      document.getElementById('p3name').value = 'Expiration';
      document.getElementById('p1on').classList.add('on');
      document.getElementById('p2on').classList.add('on');
      document.getElementById('p3on').classList.add('on');
    } else if (id === 'box') {
      document.getElementById('p1dur').value = 4;
      document.getElementById('p2dur').value = 4;
      document.getElementById('p3dur').value = 4;
      document.getElementById('p1name').value = 'Inspiration';
      document.getElementById('p2name').value = 'Rétention';
      document.getElementById('p3name').value = 'Expiration';
      document.getElementById('p1on').classList.add('on');
      document.getElementById('p2on').classList.add('on');
      document.getElementById('p3on').classList.add('on');
    }
    rebuildTable();
    updatePreview();
  }

  document.querySelectorAll('.preset-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.preset-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentPreset = tab.dataset.preset;
      applyPreset(currentPreset);
    });
  });

  // ── Phase pills ─────────────────────────────────────────────────────────────
  [1,2,3].forEach(i => {
    document.getElementById(`p${i}on`).addEventListener('click', () => {
      document.getElementById(`p${i}on`).classList.toggle('on');
      rebuildTable(); updatePreview();
    });
  });

  // ── Infinite loop checkbox ───────────────────────────────────────────────────
  const infiniteCheck = document.getElementById('infiniteLoop');
  const cycleCountRow = document.getElementById('cycleCountRow');
  infiniteCheck.addEventListener('change', () => {
    cycleCountRow.style.opacity = infiniteCheck.checked ? '0.35' : '1';
    cycleCountRow.style.pointerEvents = infiniteCheck.checked ? 'none' : '';
    updatePreview();
  });

  // ── Colors / hints ──────────────────────────────────────────────────────────
  const PHASE_COLORS = ['#7abfe8','#a78bfa','#7ae8c0'];
  const PHASE_HINTS  = ['Inspirez lentement','Retenez le souffle','Expirez doucement'];

  // ── Cycles table ─────────────────────────────────────────────────────────────
  function rebuildTable() {
    // For box preset, show 4-phase description
    const n = parseInt(document.getElementById('totalCycles').value) || 4;
    const body = document.getElementById('cyclesBody');
    const existing = {};
    body.querySelectorAll('tr').forEach((tr, idx) => {
      existing[idx] = Array.from(tr.querySelectorAll('input')).map(i => i.value);
    });
    body.innerHTML = '';
    const ons = [1,2,3].map(i => document.getElementById(`p${i}on`).classList.contains('on'));

    for (let c = 0; c < n; c++) {
      const tr = document.createElement('tr');
      const prev = existing[c] || [];
      let col = 0;
      const td0 = document.createElement('td');
      td0.className = 'cycle-num'; td0.textContent = c + 1;
      tr.appendChild(td0);
      [1,2,3].forEach((i, idx) => {
        const td = document.createElement('td');
        if (ons[idx]) {
          const inp = document.createElement('input');
          inp.type = 'number'; inp.min = 1; inp.max = 60;
          inp.value = prev[col] !== undefined ? prev[col] : document.getElementById(`p${i}dur`).value;
          td.appendChild(inp);
          const sp = document.createElement('span'); sp.className = 'unit'; sp.textContent = ' s';
          td.appendChild(sp); col++;
        } else { td.textContent = '—'; td.style.color = 'var(--muted)'; }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    }
    // thead labels
    const ths = document.querySelectorAll('#cyclesTable thead th');
    [1,2,3].forEach((i,idx) => {
      ths[idx+1].textContent = document.getElementById(`p${i}name`).value || `Phase ${i}`;
    });
  }

  document.getElementById('totalCycles').addEventListener('input', () => { rebuildTable(); updatePreview(); });
  [1,2,3].forEach(i => {
    document.getElementById(`p${i}dur`).addEventListener('input', () => { rebuildTable(); updatePreview(); });
    document.getElementById(`p${i}name`).addEventListener('input', rebuildTable);
  });

  rebuildTable();

  // ── Audio ────────────────────────────────────────────────────────────────────
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // Richer, louder chime using multiple oscillators + subtle reverb-like decay
  function chime(freq = 440, dur = 0.8, vol = 0.5) {
    const ctx = getAudio();
    // Main tone
    [freq, freq * 2, freq * 3].forEach((f, hi) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = hi === 0 ? 'sine' : 'sine';
      osc.frequency.setValueAtTime(f, ctx.currentTime);
      const v = vol / (hi + 1);
      gain.gain.setValueAtTime(v, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur * (1 - hi * 0.2));
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + dur);
    });
  }

  function chimeSequence(freqs, gap = 0.15) {
    freqs.forEach((f, i) => setTimeout(() => chime(f, 0.7, 0.45), i * gap * 1000));
  }

  // ── Build session ─────────────────────────────────────────────────────────────
  function buildSession() {
    const infinite = document.getElementById('infiniteLoop').checked;
    const totalCycles = parseInt(document.getElementById('totalCycles').value) || 4;

    // Box breathing: 4 phases (add a 4th virtual phase)
    let phases;
    if (currentPreset === 'box') {
      phases = [
        { name: 'Inspiration',     dur: 4, color: PHASE_COLORS[0], hint: 'Inspirez lentement' },
        { name: 'Rétention haute', dur: 4, color: PHASE_COLORS[1], hint: 'Retenez le souffle' },
        { name: 'Expiration',      dur: 4, color: PHASE_COLORS[2], hint: 'Expirez doucement' },
        { name: 'Rétention basse', dur: 4, color: '#e8c97a',       hint: 'Poumons vides' },
      ];
    } else {
      phases = [1,2,3]
        .filter(i => document.getElementById(`p${i}on`).classList.contains('on'))
        .map((i, idx) => ({
          name:  document.getElementById(`p${i}name`).value || `Phase ${i}`,
          dur:   parseInt(document.getElementById(`p${i}dur`).value) || 4,
          color: PHASE_COLORS[i-1],
          hint:  PHASE_HINTS[i-1],
        }));
    }
    if (phases.length === 0) return null;

    // Per-cycle durations from table (only for custom, others use flat dur)
    const rows = document.querySelectorAll('#cyclesBody tr');
    const cycles = [];
    for (let c = 0; c < totalCycles; c++) {
      if (currentPreset !== 'custom') {
        cycles.push(phases.map(p => p.dur));
      } else {
        const row = rows[c];
        const inputs = row ? row.querySelectorAll('input') : [];
        cycles.push(phases.map((p, pi) => {
          const inp = inputs[pi];
          return inp ? (parseInt(inp.value) || p.dur) : p.dur;
        }));
      }
    }

    return { phases, cycles, totalCycles, infinite };
  }

  // ── Immersive runner ──────────────────────────────────────────────────────────
  const immersive     = document.getElementById('immersive');
  const immCircle     = document.getElementById('immCircle');
  const immCountdown  = document.getElementById('immCountdown');
  const immPhaseName  = document.getElementById('immPhaseName');
  const immPhaseInfo  = document.getElementById('immPhaseInfo');
  const immCycleLabel = document.getElementById('immCycleLabel');
  const immDots       = document.getElementById('immDots');
  const immProgressBar= document.getElementById('immProgressBar');

  let runnerState = null;
  let runnerInterval = null;
  let progressRaf = null;
  let phaseStartTime = null;
  let phaseTotalDur = 1;

  function buildDots(total, current, infinite) {
    if (infinite) {
      immDots.innerHTML = '<span style="font-size:1.2rem;color:var(--accent2)">∞</span>';
      return;
    }
    immDots.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const d = document.createElement('div');
      d.className = 'imm-dot' +
        (i < current ? ' done-dot' : '') +
        (i === current ? ' active-dot' : '');
      immDots.appendChild(d);
    }
  }

  function applyPhaseStyle(phase, dur) {
    immCircle.className = 'imm-circle';
    immPhaseName.textContent = phase.name;
    immPhaseInfo.textContent = phase.hint;
    immPhaseName.style.color = phase.color;
    immProgressBar.style.background = phase.color;

    const name = phase.name.toLowerCase();
    const isInhale  = name.includes('inspi') || name.includes('inhale');
    const isExhale  = name.includes('expir') || name.includes('exhale') || name.includes('basse');
    const isHold    = !isInhale && !isExhale;

    if (isInhale) {
      immCircle.style.transition = 'none';
      immCircle.style.transform = 'scale(1)';
      void immCircle.offsetWidth;
      immCircle.style.transition = `transform ${dur}s cubic-bezier(0.4,0,0.2,1), border-color 0.8s, background 0.8s`;
      immCircle.style.transform = 'scale(1.28)';
    } else if (isExhale) {
      immCircle.classList.add('exhale');
      immCircle.style.transition = `transform ${dur}s cubic-bezier(0.4,0,0.2,1), border-color 0.8s, background 0.8s`;
      immCircle.style.transform = 'scale(0.78)';
    } else {
      immCircle.classList.add('hold');
      immCircle.style.transition = 'transform 0.6s, border-color 0.8s, background 0.8s';
    }
  }

  function animateProgress() {
    if (!phaseStartTime) return;
    const elapsed = (Date.now() - phaseStartTime) / 1000;
    const ratio = Math.min(elapsed / phaseTotalDur, 1);
    immProgressBar.style.transform = `scaleX(${1 - ratio})`;
    if (ratio < 1) progressRaf = requestAnimationFrame(animateProgress);
  }

  function startPhase(phase, dur) {
    applyPhaseStyle(phase, dur);
    phaseStartTime = Date.now();
    phaseTotalDur = dur;
    cancelAnimationFrame(progressRaf);
    immProgressBar.style.transition = 'none';
    immProgressBar.style.transform = 'scaleX(1)';
    void immProgressBar.offsetWidth;
    progressRaf = requestAnimationFrame(animateProgress);
  }

  function runTick() {
    if (!runnerState) return;
    const { sess } = runnerState;
    let { cycleIdx, phaseIdx, secondsLeft } = runnerState;

    immCountdown.textContent = secondsLeft;
    secondsLeft--;
    runnerState.secondsLeft = secondsLeft;

    if (secondsLeft < 0) {
      let nextPhase = phaseIdx + 1;
      let nextCycle = cycleIdx;

      if (nextPhase >= sess.phases.length) {
        nextPhase = 0;
        nextCycle++;
      }

      if (!sess.infinite && nextCycle >= sess.totalCycles) {
        endSession(true); return;
      }

      // Wrap cycle in infinite mode
      if (sess.infinite && nextCycle >= sess.totalCycles) nextCycle = 0;

      // Chime: different pitch per phase for clear differentiation
      const phaseChimes = [523, 659, 440, 392];
      chime(phaseChimes[nextPhase % phaseChimes.length], 0.7, 0.5);

      runnerState.phaseIdx = nextPhase;
      runnerState.cycleIdx = nextCycle;
      const phase = sess.phases[nextPhase];
      const cycleData = sess.cycles[Math.min(nextCycle, sess.cycles.length - 1)];
      const dur = cycleData[nextPhase] || phase.dur;
      runnerState.secondsLeft = dur;

      buildDots(sess.totalCycles, nextCycle, sess.infinite);
      const label = sess.infinite
        ? `Cycle ${nextCycle + 1} ∞`
        : `Cycle ${nextCycle + 1} / ${sess.totalCycles}`;
      immCycleLabel.textContent = label;

      startPhase(phase, dur);
    }
  }

  function startSession() {
    const sess = buildSession();
    if (!sess) return;

    const phase = sess.phases[0];
    const dur = sess.cycles[0][0];

    runnerState = { sess, cycleIdx: 0, phaseIdx: 0, secondsLeft: dur };
    buildDots(sess.totalCycles, 0, sess.infinite);
    immCycleLabel.textContent = sess.infinite ? 'Cycle 1 ∞' : `Cycle 1 / ${sess.totalCycles}`;

    chimeSequence([523, 659], 0.18);
    immersive.classList.add('active');
    startPhase(phase, dur);
    runnerInterval = setInterval(runTick, 1000);
  }

  function endSession(completed = false) {
    clearInterval(runnerInterval); runnerInterval = null;
    cancelAnimationFrame(progressRaf);
    runnerState = null;

    if (completed) {
      chimeSequence([784, 880, 1047], 0.2);
      immPhaseName.textContent = 'Terminé 🌿';
      immPhaseInfo.textContent = 'Belle session !';
      immCircle.style.transform = 'scale(1)';
      immProgressBar.style.transform = 'scaleX(0)';
      setTimeout(() => immersive.classList.remove('active'), 2800);
    } else {
      immersive.classList.remove('active');
    }
  }

  document.getElementById('startBtn').addEventListener('click', startSession);
  document.getElementById('immExit').addEventListener('click', () => endSession(false));

  // ── Preview circle ────────────────────────────────────────────────────────────
  function updatePreview() {
    if (currentPreset === '478') {
      document.getElementById('previewCircle').textContent = '4 · 7 · 8';
    } else if (currentPreset === 'box') {
      document.getElementById('previewCircle').textContent = '4 · 4 · 4 · 4';
    } else {
      const ons = [1,2,3].filter(i => document.getElementById(`p${i}on`).classList.contains('on'));
      const parts = ons.map(i => `${document.getElementById(`p${i}dur`).value}s`);
      document.getElementById('previewCircle').textContent = parts.join(' · ') || '—';
    }
    const inf = document.getElementById('infiniteLoop').checked;
    const n = document.getElementById('totalCycles').value;
    document.getElementById('previewCircle').title = inf ? '∞ boucle infinie' : `${n} cycles`;
  }

  [1,2,3].forEach(i => {
    document.getElementById(`p${i}dur`).addEventListener('input', updatePreview);
    document.getElementById(`p${i}on`).addEventListener('click', updatePreview);
  });
  document.getElementById('infiniteLoop').addEventListener('change', updatePreview);

  // ── Init ──────────────────────────────────────────────────────────────────────
  applyPreset('478');
  updatePreview();
</script>
</body>
</html>
