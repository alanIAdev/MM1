<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro — Mini Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet" />
  <style>
    :root[data-theme="dark"] {
      --bg: #0e0e10;
      --surface: #17171a;
      --border: #2a2a30;
      --text: #e8e6e0;
      --muted: #6b6b72;
      --accent: #e8c97a;
      --accent-dim: rgba(232,201,122,0.12);
      --accent-dimmer: rgba(232,201,122,0.06);
      --danger: #e87a7a;
      --success: #7ae8b0;
      --card-bg: #131316;
      --shadow: rgba(0,0,0,0.5);
      --toggle-bg: #2a2a30;
    }
    :root[data-theme="light"] {
      --bg: #f5f2eb;
      --surface: #fff;
      --border: #ddd9ce;
      --text: #1a1a1c;
      --muted: #888880;
      --accent: #c8900a;
      --accent-dim: rgba(200,144,10,0.1);
      --accent-dimmer: rgba(200,144,10,0.05);
      --danger: #c02020;
      --success: #1a9050;
      --card-bg: #fefcf7;
      --shadow: rgba(0,0,0,0.1);
      --toggle-bg: #e8e4dc;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.4s, color 0.4s;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .layout {
      position: relative; z-index: 1;
      max-width: 640px; margin: 0 auto;
      padding: 2.5rem 2rem 5rem;
      width: 100%;
    }

    /* Nav */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 3.5rem;
    }

    .back-link {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      display: flex; align-items: center; gap: 0.4rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    .toggle-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .toggle-icon { font-size: 0.85rem; }
    .toggle {
      position: relative; width: 40px; height: 22px;
      background: var(--toggle-bg); border-radius: 11px;
      border: 1px solid var(--border); cursor: pointer;
      transition: background 0.3s;
    }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: var(--accent); border-radius: 50%;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    [data-theme="light"] .toggle::after { transform: translateX(18px); }

    /* Title */
    .page-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .page-title span { font-style: italic; font-weight: 300; }
    .page-sub {
      font-size: 0.7rem; color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 3rem;
    }

    /* Mode tabs */
    .mode-tabs {
      display: flex; gap: 0; margin-bottom: 2.5rem;
      border: 1px solid var(--border); border-radius: 4px;
      overflow: hidden;
    }
    .tab {
      flex: 1; padding: 0.65rem 1rem; text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; transition: background 0.2s, color 0.2s;
      border-right: 1px solid var(--border);
    }
    .tab:last-child { border-right: none; }
    .tab.active { background: var(--accent-dim); color: var(--accent); }
    .tab:hover:not(.active) { background: var(--accent-dimmer); }

    /* Timer face */
    .timer-face {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* SVG ring */
    .ring-wrap {
      position: relative;
      width: 200px; height: 200px;
      margin: 0 auto 1.5rem;
    }

    .ring-svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--border);
      stroke-width: 3;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.5s;
    }

    .ring-progress.break { stroke: #7abfe8; }
    .ring-progress.long-break { stroke: #7ae8b0; }

    .timer-display {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.2rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .phase-label {
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.5rem;
    }

    .cycle-dots {
      display: flex; justify-content: center; gap: 0.4rem; margin-top: 1rem;
    }

    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border); transition: background 0.3s;
    }
    .dot.done { background: var(--accent); }

    /* Controls */
    .controls {
      display: flex; justify-content: center; gap: 1rem;
      margin-bottom: 2rem;
    }

    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.75rem 2rem;
      border-radius: 3px; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      cursor: pointer; transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent); color: #111;
      border-color: var(--accent); font-weight: 500;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:hover:not(.btn-primary) { border-color: var(--accent); color: var(--accent); }

    /* Settings panel */
    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .settings-title {
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
    }

    .settings-chevron {
      color: var(--muted); font-size: 0.8rem;
      transition: transform 0.3s;
    }
    .settings-panel.open .settings-chevron { transform: rotate(180deg); }

    .settings-body {
      display: none;
      padding: 1.5rem;
      gap: 1.25rem;
      flex-direction: column;
    }
    .settings-panel.open .settings-body { display: flex; }

    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem;
    }

    .setting-label {
      font-size: 0.72rem; color: var(--muted);
      flex-shrink: 0;
    }

    .setting-label strong { color: var(--text); display: block; font-weight: 500; }

    .setting-control {
      display: flex; align-items: center; gap: 0.5rem;
    }

    input[type="number"] {
      width: 56px; text-align: center;
      font-family: 'DM Mono', monospace; font-size: 0.85rem;
      padding: 0.4rem 0.5rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text);
      transition: border-color 0.2s;
    }
    input[type="number"]:focus { outline: none; border-color: var(--accent); }

    .unit { font-size: 0.65rem; color: var(--muted); }

    /* Sound toggles */
    .sound-row {
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }

    .sound-label {
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.9rem;
    }

    .sound-options { display: flex; flex-direction: column; gap: 0.6rem; }

    .sound-item {
      display: flex; align-items: center; justify-content: space-between;
    }

    .sound-item-label { font-size: 0.72rem; color: var(--text); }

    /* Pill toggle */
    .pill {
      width: 36px; height: 20px;
      background: var(--border); border-radius: 10px;
      cursor: pointer; transition: background 0.25s;
      position: relative; border: none;
      flex-shrink: 0;
    }
    .pill::after {
      content: ''; position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: var(--surface); border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pill.on { background: var(--accent); }
    .pill.on::after { transform: translateX(16px); }

    @media (max-width: 500px) {
      .layout { padding: 1.5rem 1rem 4rem; }
      .timer-display { font-size: 2.4rem; }
    }
  </style>
</head>
<body>
<div class="layout">

  <nav>
    <a class="back-link" href="../../index.html">← Accueil</a>
    <div class="toggle-wrap">
      <span class="toggle-icon">🌙</span>
      <div class="toggle" id="themeToggle" role="button" tabindex="0"></div>
      <span class="toggle-icon">☀️</span>
    </div>
  </nav>

  <h1 class="page-title">Pomo<span>doro</span></h1>
  <p class="page-sub">Technique de focus par intervalles</p>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="tab active" data-mode="work">Travail</button>
    <button class="tab" data-mode="break">Pause courte</button>
    <button class="tab" data-mode="long">Pause longue</button>
  </div>

  <!-- Timer face -->
  <div class="timer-face">
    <div class="phase-label" id="phaseLabel">Travail · cycle 1/4</div>
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="88"/>
        <circle class="ring-progress" id="ring" cx="100" cy="100" r="88"/>
      </svg>
      <div class="timer-display" id="timerDisplay">25:00</div>
    </div>
    <div class="cycle-dots" id="cycleDots"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn" id="resetBtn">↺ Reset</button>
    <button class="btn btn-primary" id="startBtn">▶ Démarrer</button>
  </div>

  <!-- Settings -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header" id="settingsHeader">
      <span class="settings-title">⚙ Paramètres</span>
      <span class="settings-chevron">▾</span>
    </div>
    <div class="settings-body">
      <div class="setting-row">
        <div class="setting-label"><strong>Travail</strong></div>
        <div class="setting-control">
          <input type="number" id="workMin" value="25" min="1" max="99" />
          <span class="unit">min</span>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label"><strong>Pause courte</strong></div>
        <div class="setting-control">
          <input type="number" id="breakMin" value="5" min="1" max="60" />
          <span class="unit">min</span>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label"><strong>Pause longue</strong></div>
        <div class="setting-control">
          <input type="number" id="longMin" value="15" min="1" max="60" />
          <span class="unit">min</span>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label"><strong>Cycles avant pause longue</strong></div>
        <div class="setting-control">
          <input type="number" id="cycleCount" value="4" min="1" max="8" />
        </div>
      </div>

      <div class="sound-row">
        <div class="sound-label">Sons</div>
        <div class="sound-options">
          <div class="sound-item">
            <span class="sound-item-label">🔕 Muet par défaut (mode silencieux)</span>
          </div>
          <div class="sound-item">
            <span class="sound-item-label">Tic à chaque seconde</span>
            <button class="pill" id="tickToggle" aria-label="toggle tick"></button>
          </div>
          <div class="sound-item">
            <span class="sound-item-label">Sonnerie de fin de cycle</span>
            <button class="pill" id="bellToggle" aria-label="toggle bell"></button>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
  // ── Theme ──────────────────────────────────────────────────────────────────
  const html = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  html.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  themeToggle.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  // ── Settings panel toggle ─────────────────────────────────────────────────
  document.getElementById('settingsHeader').addEventListener('click', () => {
    document.getElementById('settingsPanel').classList.toggle('open');
  });

  // ── Audio (Web Audio API) ──────────────────────────────────────────────────
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTick() {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.04);
  }

  function playBell() {
    const ctx = getAudioCtx();
    const freqs = [523, 659, 784, 1047];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.18);
      gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 1.2);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 1.2);
    });
  }

  // ── Sound pill toggles ─────────────────────────────────────────────────────
  let tickOn = false;
  let bellOn = false;

  const tickToggle = document.getElementById('tickToggle');
  const bellToggle = document.getElementById('bellToggle');

  tickToggle.addEventListener('click', () => {
    tickOn = !tickOn;
    tickToggle.classList.toggle('on', tickOn);
  });
  bellToggle.addEventListener('click', () => {
    bellOn = !bellOn;
    bellToggle.classList.toggle('on', bellOn);
  });

  // ── State ──────────────────────────────────────────────────────────────────
  let mode = 'work';         // 'work' | 'break' | 'long'
  let running = false;
  let intervalId = null;
  let secondsLeft = 0;
  let totalSeconds = 0;
  let cyclesDone = 0;

  const CIRCUMFERENCE = 2 * Math.PI * 88;

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const display   = document.getElementById('timerDisplay');
  const ring      = document.getElementById('ring');
  const phaseLabel = document.getElementById('phaseLabel');
  const cycleDots = document.getElementById('cycleDots');
  const startBtn  = document.getElementById('startBtn');
  const resetBtn  = document.getElementById('resetBtn');
  const tabs      = document.querySelectorAll('.tab');

  ring.style.strokeDasharray = CIRCUMFERENCE;
  ring.style.strokeDashoffset = 0;

  // ── Helpers ────────────────────────────────────────────────────────────────
  function getMinutes(m) {
    return parseInt(document.getElementById(m).value) || 1;
  }

  function getDuration() {
    if (mode === 'work')  return getMinutes('workMin') * 60;
    if (mode === 'break') return getMinutes('breakMin') * 60;
    return getMinutes('longMin') * 60;
  }

  function getCycles() {
    return parseInt(document.getElementById('cycleCount').value) || 4;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function updateRing() {
    const ratio = totalSeconds > 0 ? secondsLeft / totalSeconds : 1;
    ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
  }

  function updateDisplay() {
    display.textContent = formatTime(secondsLeft);
    updateRing();
  }

  function updatePhaseLabel() {
    const cycles = getCycles();
    if (mode === 'work') {
      phaseLabel.textContent = `Travail · cycle ${cyclesDone + 1}/${cycles}`;
    } else if (mode === 'break') {
      phaseLabel.textContent = 'Pause courte';
    } else {
      phaseLabel.textContent = 'Pause longue 🎉';
    }
  }

  function buildDots() {
    const cycles = getCycles();
    cycleDots.innerHTML = '';
    for (let i = 0; i < cycles; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i < cyclesDone ? ' done' : '');
      cycleDots.appendChild(d);
    }
  }

  function applyRingMode() {
    ring.className = 'ring-progress';
    if (mode === 'break') ring.classList.add('break');
    if (mode === 'long')  ring.classList.add('long-break');
  }

  function initTimer() {
    totalSeconds = getDuration();
    secondsLeft  = totalSeconds;
    updateDisplay();
    updatePhaseLabel();
    buildDots();
    applyRingMode();
  }

  // ── Tabs ───────────────────────────────────────────────────────────────────
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      stopTimer();
      mode = tab.dataset.mode;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      initTimer();
    });
  });

  // ── Timer logic ────────────────────────────────────────────────────────────
  function startTimer() {
    if (running) return;
    running = true;
    startBtn.textContent = '⏸ Pause';
    intervalId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    running = false;
    clearInterval(intervalId);
    startBtn.textContent = '▶ Reprendre';
  }

  function stopTimer() {
    running = false;
    clearInterval(intervalId);
    startBtn.textContent = '▶ Démarrer';
  }

  function tick() {
    if (tickOn) playTick();
    secondsLeft--;
    updateDisplay();
    if (secondsLeft <= 0) {
      clearInterval(intervalId);
      running = false;
      if (bellOn) playBell();
      onCycleEnd();
    }
  }

  function onCycleEnd() {
    const cycles = getCycles();
    if (mode === 'work') {
      cyclesDone++;
      buildDots();
      // Auto-switch to next break
      if (cyclesDone >= cycles) {
        cyclesDone = 0;
        setMode('long');
      } else {
        setMode('break');
      }
    } else {
      setMode('work');
    }
  }

  function setMode(m) {
    mode = m;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === m));
    initTimer();
    startBtn.textContent = '▶ Démarrer';
  }

  startBtn.addEventListener('click', () => {
    if (running) { pauseTimer(); }
    else { startTimer(); }
  });

  resetBtn.addEventListener('click', () => {
    stopTimer();
    cyclesDone = 0;
    initTimer();
  });

  // Settings change → reset display
  ['workMin','breakMin','longMin','cycleCount'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      stopTimer();
      initTimer();
    });
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  initTimer();
</script>
</body>
</html>
